<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pguard — Prototype จองงาน</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="proto/app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="proto/parts.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const G = { nm:'ณัฐพล วงศ์ดี', en:'Nattapon W.', av:'ณฐ', rate:4.9, jobs:188, exp:'6 ปี' };
const fmt = n => '฿'+n.toLocaleString('en-US',{minimumFractionDigits:2});

function Phone({ onMap, children }){
  return (
    <div className="phone">
      <div className="notch"></div>
      <div className={"screen"+(onMap?' on-map':'')}>
        <StatusBar onMap={onMap}/>
        <div className="body">{children}</div>
        <div className="home-ind"></div>
      </div>
    </div>
  );
}

/* ---------------- 1 · BOOKING ---------------- */
function Booking({ go, dark, service, setService }){
  const services = [['village','หมู่บ้าน'],['condo','คอนโด'],['factory','โรงงาน'],['event','อีเวนต์']];
  return (
    <Phone onMap>
      <div className="map" style={MapVars({dark})}><MapBg/></div>
      <div className="dest" style={{left:'50%',top:'36%'}}><div className="ring"></div></div>
      <div style={{position:'absolute',top:8,left:16,right:16,zIndex:8,display:'flex',gap:8}}>
        <div style={{flex:1,background:'var(--bg-surface)',borderRadius:14,boxShadow:'var(--sh-md)',padding:'11px 14px',display:'flex',alignItems:'center',gap:10}}>
          <Ico n="pin" s={17} c="var(--brand-int)"/>
          <span className="ell" style={{fontSize:13.5,fontWeight:600,color:'var(--text-strong)'}}>หมู่บ้านลัดดารมย์ ซ.5, บางนา</span>
        </div>
      </div>
      <div style={{flex:1}}></div>
      <div className="sheet">
        <div className="grab"></div>
        <div className="pad" style={{paddingBottom:4}}><div className="hd-title">จองเจ้าหน้าที่ รปภ.</div>
          <div className="hd-sub" style={{marginTop:2}}>เลือกประเภทสถานที่ของคุณ</div></div>
        <div className="chips" style={{marginTop:14}}>
          {services.map(([k,l])=>(
            <div key={k} className={"chip"+(service===k?' on':'')} onClick={()=>setService(k)}>
              <Ico n={k} s={22}/><span>{l}</span></div>
          ))}
        </div>
        <div className="pad" style={{marginTop:14}}>
          <div className="card sunken">
            <div className="row" style={{padding:'13px 16px'}}>
              <div className="ic"><Ico n="cal" s={18}/></div>
              <div><div className="l">วันนี้ · 8 ชั่วโมง</div><div className="v">14:00 – 22:00 น.</div></div>
              <div style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontWeight:600,fontSize:13,color:'var(--brand-int)'}}>แก้ไข</div>
            </div>
            <div className="row" style={{padding:'13px 16px'}}>
              <div className="ic"><Ico n="users" s={18}/></div>
              <div><div className="l">จำนวนเจ้าหน้าที่</div><div className="v">1 คน</div></div>
              <div style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontWeight:600,fontSize:13,color:'var(--brand-int)'}}>แก้ไข</div>
            </div>
          </div>
        </div>
        <div className="footer" style={{borderTop:'none',paddingTop:14}}>
          <div className="priceline">
            <div><div className="pl">รวมโดยประมาณ</div><div className="est">฿230/ชม. × 8 · จ่ายตามจริงเมื่อจบงาน</div></div>
            <div className="pv">฿1,840</div>
          </div>
          <button className="cta cta-amber" onClick={()=>go('searching')}>
            เรียกเจ้าหน้าที่เลย <Ico n="shield" s={18} c="#2A1500"/></button>
        </div>
      </div>
    </Phone>
  );
}

/* ---------------- 2 · SEARCHING ---------------- */
function Searching({ go, dark }){
  const [found, setFound] = useState(0);
  useEffect(()=>{
    const t1 = setInterval(()=>setFound(f=>Math.min(f+1,7)), 320);
    const t2 = setTimeout(()=>go('found'), 2900);
    return ()=>{ clearInterval(t1); clearTimeout(t2); };
  },[]);
  return (
    <Phone onMap>
      <div className="map" style={MapVars({dark})}><MapBg/></div>
      <div className="radar"><span className="wave"></span><span className="wave"></span><span className="wave"></span><span className="core"></span></div>
      <div style={{flex:1}}></div>
      <div className="sheet" style={{textAlign:'center',paddingBottom:30}}>
        <div className="grab"></div>
        <div className="pad">
          <div className="hd-title" style={{fontSize:21}}>กำลังค้นหาเจ้าหน้าที่ใกล้คุณ</div>
          <div className="hd-sub" style={{marginTop:6,fontSize:14}}>พบ {found} คนในรัศมี 3 กม. · กำลังจับคู่ที่ดีที่สุด</div>
          <div style={{display:'flex',justifyContent:'center',gap:8,margin:'22px 0 4px'}}>
            {[0,1,2].map(i=><span key={i} className="live-dot" style={{width:10,height:10,borderRadius:'50%',background:'var(--brand-int)',animationDelay:i*.2+'s'}}></span>)}
          </div>
        </div>
      </div>
    </Phone>
  );
}

/* ---------------- 3 · FOUND ---------------- */
function Found({ go }){
  return (
    <Phone>
      <div className="scroll fade">
        <div className="hd"><button className="iconbtn" onClick={()=>go('searching')}><Ico n="back" s={18}/></button>
          <div><div className="hd-title">พบเจ้าหน้าที่แล้ว</div><div className="hd-sub">จับคู่ใน 2.9 วินาที</div></div></div>
        <div className="gprofile">
          <div className="av">{G.av}<span style={{position:'absolute',bottom:-2,right:-2,width:18,height:18,borderRadius:'50%',background:'var(--status-active)',border:'3px solid var(--bg-surface)'}}></span></div>
          <div style={{flex:1,minWidth:0}}>
            <div className="nm">{G.nm}<Ico n="badge" s={17} c="var(--info)"/></div>
            <div className="meta"><Ico n="star" s={13} c="var(--amber-400)"/><b style={{color:'var(--text-strong)'}}>{G.rate}</b><span className="dot"></span><span>{G.jobs} งาน</span><span className="dot"></span><span>ประสบการณ์ {G.exp}</span></div>
          </div>
        </div>
        <div className="pad">
          <div className="card" style={{marginBottom:14}}>
            <div className="row"><div className="ic"><Ico n="nav" s={18}/></div>
              <div><div className="l">ระยะทาง / เวลามาถึง</div><div className="v">0.8 กม. · ถึงใน ~4 นาที</div></div></div>
            <div className="row"><div className="ic"><Ico n="shield" s={18}/></div>
              <div><div className="l">ใบอนุญาต</div><div className="v">รปภ. ขึ้นทะเบียน · ตรวจประวัติผ่าน</div></div>
              <div className="chev"><Ico n="check" s={18} c="var(--success)"/></div></div>
          </div>
          <div style={{display:'flex',gap:8,padding:'2px 2px 4px'}}>
            {['ตรงเวลา 99%','สุภาพ','มืออาชีพ'].map(t=>(
              <span key={t} style={{fontSize:12,fontWeight:500,padding:'7px 12px',borderRadius:999,background:'var(--green-50)',color:'var(--green-800)'}}>{t}</span>
            ))}
          </div>
        </div>
      </div>
      <div className="footer">
        <div style={{display:'flex',gap:10}}>
          <button className="cta cta-ghost" style={{flex:'0 0 92px'}} onClick={()=>go('searching')}>เปลี่ยน</button>
          <button className="cta cta-green" style={{flex:1}} onClick={()=>go('pay')}>ยืนยันเจ้าหน้าที่คนนี้</button>
        </div>
      </div>
    </Phone>
  );
}

/* ---------------- 4 · PAYMENT ---------------- */
function Pay({ go, pay, setPay }){
  const methods = [['promptpay','PromptPay','พร้อมเพย์ · 081-234-5678'],['card','บัตรเครดิต','•••• 4821 · Visa'],['wallet','pguard Wallet','คงเหลือ ฿2,400']];
  return (
    <Phone>
      <div className="scroll fade">
        <div className="hd"><button className="iconbtn" onClick={()=>go('found')}><Ico n="back" s={18}/></button>
          <div><div className="hd-title">ชำระเงิน</div><div className="hd-sub">กันวงเงินไว้ · ตัดจริงตามเวลางาน</div></div></div>
        <div className="pad">
          <div className="card sunken" style={{padding:'14px 16px',marginBottom:18}}>
            <div className="brk" style={{padding:0}}>
              <div className="bl muted"><span>ค่าบริการ ฿230 × 8 ชม.</span><span className="mono">฿1,840.00</span></div>
              <div className="bl muted"><span>ค่าธรรมเนียมแพลตฟอร์ม</span><span className="mono">฿55.00</span></div>
              <div className="bl muted"><span>ส่วนลดผู้ใช้ใหม่</span><span className="mono" style={{color:'var(--success)'}}>−฿100.00</span></div>
              <div className="div"></div>
              <div className="bl" style={{fontWeight:600}}><span>ยอดกันวงเงิน</span><span className="mono">฿1,795.00</span></div>
            </div>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:'var(--text-muted)',padding:'0 2px 10px'}}>วิธีชำระเงิน</div>
          <div className="card">
            {methods.map(([k,t,s],i)=>(
              <div key={k} className="row" onClick={()=>setPay(k)} style={{cursor:'pointer'}}>
                <div className="ic"><Ico n={k} s={18}/></div>
                <div><div className="v">{t}</div><div className="l" style={{marginTop:2}}>{s}</div></div>
                <div className="chev">
                  <span style={{width:22,height:22,borderRadius:'50%',border:'2px solid '+(pay===k?'var(--brand-int)':'var(--border-strong)'),display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {pay===k && <span style={{width:11,height:11,borderRadius:'50%',background:'var(--brand-int)'}}></span>}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="footer">
        <button className="cta cta-green" onClick={()=>go('tracking')}>ชำระเงินและยืนยันการจอง · ฿1,795</button>
      </div>
    </Phone>
  );
}

/* ---------------- 5 · TRACKING ---------------- */
function Tracking({ go, dark }){
  const [eta, setEta] = useState(4);
  const [pos, setPos] = useState({left:'80%',top:'16%'});
  const [arr, setArr] = useState(false);
  useEffect(()=>{
    const steps = [{left:'70%',top:'26%'},{left:'62%',top:'40%'},{left:'56%',top:'50%'},{left:'52%',top:'58%'}];
    let i=0;
    const t = setInterval(()=>{ if(i<steps.length){ setPos(steps[i]); setEta(e=>Math.max(e-1,0)); i++; } else { setArr(true); clearInterval(t);} }, 1600);
    return ()=>clearInterval(t);
  },[]);
  return (
    <Phone onMap>
      <div className="map" style={MapVars({dark})}><MapBg/></div>
      <svg className="route" viewBox="0 0 400 700" preserveAspectRatio="none">
        <path d="M320 112 C280 220 230 300 208 406" stroke="var(--brand-int)" strokeWidth="5" strokeDasharray="2 12" strokeLinecap="round" fill="none" opacity=".7"/>
      </svg>
      <div className="dest" style={{left:'52%',top:'62%'}}><div className="ring"></div></div>
      <div className="pin guard" style={pos}><div className="b"><Ico n="shield" s={16} c="#fff"/></div></div>
      <div className="statuspill">
        <span className="blip live-dot" style={{background:arr?'var(--status-active)':'var(--amber-400)'}}></span>
        {arr ? 'เจ้าหน้าที่ถึงจุดนัดแล้ว' : 'กำลังเดินทางมาหาคุณ'}
      </div>
      <div style={{flex:1}}></div>
      <div className="sheet">
        <div className="grab"></div>
        <div className="gprofile" style={{paddingTop:0}}>
          <div className="av" style={{width:54,height:54,fontSize:19}}>{G.av}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="nm" style={{fontSize:17}}>{G.nm}<Ico n="badge" s={15} c="var(--info)"/></div>
            <div className="meta"><Ico n="star" s={12} c="var(--amber-400)"/><b style={{color:'var(--text-strong)'}}>{G.rate}</b><span className="dot"></span><span>รปภ. ขึ้นทะเบียน</span></div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:'var(--font-mono)',fontSize:22,fontWeight:600,color:'var(--text-strong)'}}>{arr?'0':eta}</div>
            <div style={{fontSize:10.5,color:'var(--text-muted)'}}>{arr?'ถึงแล้ว':'นาที'}</div>
          </div>
        </div>
        <div className="callrow">
          <div className="cbtn"><Ico n="chat" s={17} c="var(--brand-int)"/>แชต</div>
          <div className="cbtn"><Ico n="phone" s={17} c="var(--brand-int)"/>โทร</div>
        </div>
        <div className="footer" style={{borderTop:'none',paddingTop:14}}>
          <button className={"cta "+(arr?'cta-green':'cta-ghost')} disabled={!arr} onClick={()=>go('active')}>
            {arr ? 'เริ่มงาน — ดูความคืบหน้า' : 'รอเจ้าหน้าที่มาถึง…'}</button>
        </div>
      </div>
    </Phone>
  );
}

/* ---------------- 6 · ACTIVE (hourly check-ins) ---------------- */
function Active({ go }){
  const slots = [
    {t:'14:00',title:'เริ่มงาน · เช็คอินจุดนัด',note:'ยืนยันตำแหน่งและสภาพพื้นที่',state:'done',photo:true},
    {t:'15:00',title:'ตรวจรอบที่ 1',note:'ทางเข้า-ออก ปกติ ไม่มีเหตุผิดปกติ',state:'done',photo:true},
    {t:'16:00',title:'ตรวจรอบที่ 2',note:'กำลังบันทึก…',state:'now',photo:false},
    {t:'17:00',title:'ตรวจรอบที่ 3',note:'รอเช็คอิน',state:'pending',photo:false},
    {t:'18:00',title:'ตรวจรอบที่ 4',note:'รอเช็คอิน',state:'pending',photo:false},
  ];
  return (
    <Phone>
      <div className="scroll fade">
        <div className="hd"><div style={{flex:1}}><div className="hd-title">งานกำลังดำเนินอยู่</div><div className="hd-sub">หมู่บ้านลัดดารมย์ · เจ้าหน้าที่ {G.nm.split(' ')[0]}</div></div>
          <span className="statuspill" style={{position:'static',transform:'none'}}><span className="blip live-dot"></span>LIVE</span></div>
        <div className="countwrap">
          <div className="ring-c">
            <svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="32" fill="none" stroke="var(--border)" strokeWidth="6"/>
              <circle cx="37" cy="37" r="32" fill="none" stroke="var(--brand-int)" strokeWidth="6" strokeLinecap="round" strokeDasharray="201" strokeDashoffset="126" transform="rotate(-90 37 37)"/></svg>
            <div className="t"><div className="tv">02:48</div><div className="tl2">เหลือ</div></div>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,color:'var(--text-muted)'}}>เวลางาน 14:00 – 22:00 น.</div>
            <div style={{fontSize:15.5,fontWeight:600,color:'var(--text-strong)',margin:'2px 0 6px'}}>ผ่านไป 5 ชม. 12 นาที จาก 8 ชม.</div>
            <div style={{height:7,borderRadius:4,background:'var(--bg-sunken)',overflow:'hidden'}}><div style={{width:'65%',height:'100%',background:'var(--brand-int)',borderRadius:4}}></div></div>
          </div>
        </div>
        <div className="pad" style={{paddingTop:6,paddingBottom:6}}>
          <div style={{fontSize:14,fontWeight:600,color:'var(--text-strong)'}}>รายงานความคืบหน้ารายชั่วโมง</div>
          <div className="hd-sub" style={{marginTop:2}}>เช็คอินแล้ว 2 จาก 5 จุด · พร้อมรูปและพิกัด</div>
        </div>
        <div className="timeline">
          {slots.map((s,i)=>(
            <div className="tl-item" key={i}>
              <div className="tl-rail">
                <div className={"tl-node "+(s.state==='done'?'done':s.state==='now'?'now':'')}>
                  {s.state==='done' ? <Ico n="check" s={16} c="#fff"/> : i+1}</div>
                {i<slots.length-1 && <div className={"tl-line"+(s.state==='done'?' done':'')}></div>}
              </div>
              <div className="tl-body">
                <div className="tl-time">{s.t}</div>
                <div className="tl-title">{s.title}</div>
                <div className="tl-note">{s.note}</div>
                {s.photo && <div className="tl-photo"><Ico n="cam" s={26} className="ph-ic"/><span className="ph-time">📍 {s.t} · GPS 4 ม.</span></div>}
                {s.state==='now' && <span className="warn-pill" style={{color:'var(--brand-int)',background:'var(--green-50)'}}><span className="live-dot" style={{width:7,height:7,borderRadius:'50%',background:'var(--brand-int)'}}></span>กำลังเช็คอิน</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="footer">
        <button className="cta cta-green" onClick={()=>go('summary')}>จบงาน — ดูสรุปค่าใช้จ่าย</button>
      </div>
    </Phone>
  );
}

/* ---------------- 7 · SUMMARY (cost + tip) ---------------- */
function Summary({ go, tip, setTip }){
  const base = 8*230, worked = 7.5, actual = Math.round(worked*230), refund = base-actual, fee=55, disc=100;
  const tipAmt = [0,40,80,120][tip];
  const total = actual + fee - disc + tipAmt;
  const tips = [['ไม่มี','฿0'],['฿40','ดี'],['฿80','เยี่ยม'],['฿120','สุดยอด']];
  return (
    <Phone>
      <div className="scroll fade">
        <div className="hd"><div style={{flex:1}}><div className="hd-title">สรุปงานเสร็จสิ้น</div><div className="hd-sub">8 ชม. · เสร็จ 21:30 น.</div></div>
          <span style={{fontSize:12,fontWeight:600,color:'var(--success)',background:'var(--success-bg)',padding:'5px 11px',borderRadius:999}}>สำเร็จ</span></div>
        <div className="gprofile" style={{paddingTop:0,paddingBottom:12}}>
          <div className="av" style={{width:50,height:50,fontSize:18}}>{G.av}</div>
          <div style={{flex:1}}><div className="nm" style={{fontSize:16}}>{G.nm}</div>
            <div className="meta"><span>เช็คอินครบ 5/5 จุด</span><span className="dot"></span><Ico n="check" s={13} c="var(--success)"/><span style={{color:'var(--success)'}}>ตรงเวลา</span></div></div>
        </div>
        <div className="brk">
          <div className="bl muted"><span>ค่าบริการ (เหมา 8 ชม.)</span><span className="mono">{fmt(base)}</span></div>
          <div className="bl credit"><span>ปรับตามเวลาจริง 7.5 ชม.</span><span className="mono">−{fmt(refund)}</span></div>
          <div className="bl muted"><span>ค่าธรรมเนียมแพลตฟอร์ม</span><span className="mono">{fmt(fee)}</span></div>
          <div className="bl credit"><span>ส่วนลดผู้ใช้ใหม่</span><span className="mono">−{fmt(disc)}</span></div>
          {tipAmt>0 && <div className="bl"><span>ทิปเจ้าหน้าที่ 💚</span><span className="mono">{fmt(tipAmt)}</span></div>}
          <div className="div"></div>
        </div>
        <div className="pad" style={{paddingTop:2}}>
          <div style={{fontSize:13.5,fontWeight:600,color:'var(--text-strong)',marginBottom:10}}>ให้ทิปเจ้าหน้าที่?</div>
        </div>
        <div className="tips">
          {tips.map(([t,s],i)=>(
            <div key={i} className={"tip"+(tip===i?' on':'')} onClick={()=>setTip(i)}>
              <div className="tt">{t}</div><div className="ts">{s}</div></div>
          ))}
        </div>
        <div className="pad" style={{paddingTop:14}}>
          <div className="card sunken" style={{padding:'12px 16px',display:'flex',gap:11,alignItems:'flex-start'}}>
            <Ico n="receipt" s={18} c="var(--text-muted)" style={{marginTop:2,flex:'none'}}/>
            <div style={{fontSize:12.5,color:'var(--text-muted)',lineHeight:1.5}}>คืนเงินส่วนต่าง {fmt(refund)} เข้าวิธีชำระเดิมภายใน 3–5 วันทำการ</div>
          </div>
        </div>
      </div>
      <div className="footer">
        <div className="brk" style={{padding:'0 0 12px'}}>
          <div className="total"><span className="tl3">ยอดสุทธิ</span><span className="tv">{fmt(total)}</span></div>
        </div>
        <button className="cta cta-green" onClick={()=>go('review')}>ชำระและให้คะแนนเจ้าหน้าที่</button>
      </div>
    </Phone>
  );
}

/* ---------------- 8 · REVIEW ---------------- */
function Review({ go, rating, setRating }){
  const [tags,setTags] = useState(['ตรงเวลา','มืออาชีพ']);
  const all = ['ตรงเวลา','สุภาพ','มืออาชีพ','รายงานละเอียด','รู้สึกปลอดภัย','แต่งกายเรียบร้อย'];
  const toggle = t => setTags(x=>x.includes(t)?x.filter(y=>y!==t):[...x,t]);
  return (
    <Phone>
      <div className="scroll fade">
        <div className="hd"><button className="iconbtn" onClick={()=>go('summary')}><Ico n="back" s={18}/></button>
          <div><div className="hd-title">ให้คะแนนงาน</div></div></div>
        <div className="gprofile" style={{flexDirection:'column',textAlign:'center',gap:10}}>
          <div className="av" style={{width:72,height:72,fontSize:26}}>{G.av}</div>
          <div><div className="nm" style={{justifyContent:'center'}}>{G.nm}</div><div className="hd-sub">บริการของคุณเป็นอย่างไรบ้าง?</div></div>
        </div>
        <div className="stars">
          {[1,2,3,4,5].map(i=>(
            <span key={i} className={"star"+(i<=rating?' on':'')} onClick={()=>setRating(i)}>
              <Ico n="star" s={40} c={i<=rating?'var(--amber-400)':'var(--border-strong)'} w={1.5} style={{fill:i<=rating?'var(--amber-400)':'none'}}/></span>
          ))}
        </div>
        <div className="rtags">
          {all.map(t=><span key={t} className={"rtag"+(tags.includes(t)?' on':'')} onClick={()=>toggle(t)}>{t}</span>)}
        </div>
        <div className="pad">
          <div className="card sunken" style={{padding:'14px 16px'}}>
            <div style={{fontSize:13.5,color:'var(--text-muted)'}}>เขียนรีวิว (ไม่บังคับ)</div>
            <div style={{fontSize:14.5,color:'var(--text-strong)',marginTop:6,fontWeight:500}}>“ดูแลดีมาก รายงานทุกชั่วโมงพร้อมรูป รู้สึกอุ่นใจ ครับ”</div>
          </div>
        </div>
      </div>
      <div className="footer">
        <button className="cta cta-amber" onClick={()=>go('done')}>ส่งรีวิว · ขอบคุณครับ</button>
      </div>
    </Phone>
  );
}

/* ---------------- 9 · DONE ---------------- */
function Done({ go }){
  return (
    <Phone>
      <div className="scroll fade" style={{display:'flex',flexDirection:'column'}}>
        <div className="success-hero">
          <div className="ck"><Ico n="check" s={48} c="var(--success)" w={2.4}/></div>
          <h2>เสร็จเรียบร้อย!</h2>
          <p>ขอบคุณที่ใช้บริการ pguard<br/>ใบเสร็จและบันทึกงานถูกบันทึกไว้แล้ว</p>
        </div>
        <div className="pad" style={{marginTop:8}}>
          <div className="card">
            <div className="row"><div className="ic"><Ico n="receipt" s={18}/></div>
              <div><div className="l">ใบเสร็จ #PG-284910</div><div className="v">ยอดสุทธิ ฿1,807.50</div></div>
              <div className="chev"><Ico n="chevR" s={18}/></div></div>
            <div className="row"><div className="ic"><Ico n="shield" s={18}/></div>
              <div><div className="l">บันทึกงาน + รายงาน 5 จุด</div><div className="v">ดาวน์โหลด PDF</div></div>
              <div className="chev"><Ico n="chevR" s={18}/></div></div>
          </div>
        </div>
      </div>
      <div className="footer">
        <button className="cta cta-green" onClick={()=>go('booking')}>จองงานใหม่</button>
      </div>
    </Phone>
  );
}

/* ---------------- APP ---------------- */
const STEPS = ['booking','searching','found','pay','tracking','active','summary','review','done'];
const STEP_LABEL = {booking:'1 · จองงาน',searching:'2 · ค้นหา',found:'3 · พบเจ้าหน้าที่',pay:'4 · ชำระเงิน',tracking:'5 · ติดตาม',active:'6 · งานดำเนินอยู่',summary:'7 · สรุปค่าใช้จ่าย',review:'8 · รีวิว',done:'9 · เสร็จสิ้น'};

function App(){
  const [screen,setScreen] = useState('booking');
  const [dark,setDark] = useState(false);
  const [service,setService] = useState('village');
  const [pay,setPay] = useState('promptpay');
  const [tip,setTip] = useState(1);
  const [rating,setRating] = useState(5);

  useEffect(()=>{ document.documentElement.setAttribute('data-theme', dark?'dark':'light'); },[dark]);

  const go = s => setScreen(s);
  const props = { go, dark, service, setService, pay, setPay, tip, setTip, rating, setRating };
  const Screens = { booking:Booking, searching:Searching, found:Found, pay:Pay, tracking:Tracking, active:Active, summary:Summary, review:Review, done:Done };
  const Cur = Screens[screen];
  const idx = STEPS.indexOf(screen);

  return (
    <div className="stage-wrap">
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:9}}>
          <svg width="22" height="23" viewBox="0 0 100 106" fill="none"><defs><linearGradient id="lg" x1="50" y1="4" x2="50" y2="106" gradientUnits="userSpaceOnUse"><stop stopColor="#1FA971"/><stop offset="1" stopColor="#0E3B2E"/></linearGradient></defs><path d="M50 4 L88 18 V50 C88 78 72 95 50 104 C28 95 12 78 12 50 V18 Z" fill="url(#lg)"/><path d="M50 30 C41 30 34 37 34 46 C34 58 50 74 50 74 C50 74 66 58 66 46 C66 37 59 30 50 30 Z" fill="#fff"/><circle cx="50" cy="46" r="7.5" fill="#1FA971"/></svg>
          <span style={{fontFamily:'var(--font-latin)',fontWeight:700,letterSpacing:'-.03em',fontSize:19,color:'var(--text-strong)'}}><span style={{color:'var(--brand-int)'}}>p</span>guard</span>
        </div>
        <span className="hint">· prototype การจองของลูกค้า</span>
      </div>

      <Cur {...props} />

      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <div className="ctrls">
          <button className={!dark?'on':''} onClick={()=>setDark(false)}>☀ Light</button>
          <button className={dark?'on':''} onClick={()=>setDark(true)}>☾ Dark</button>
        </div>
        <div className="ctrls">
          <button onClick={()=>go(STEPS[Math.max(idx-1,0)])}>‹</button>
          <button className="on" style={{cursor:'default',minWidth:130}}>{STEP_LABEL[screen]}</button>
          <button onClick={()=>go(STEPS[Math.min(idx+1,STEPS.length-1)])}>›</button>
        </div>
      </div>
      <div className="hint">แตะปุ่มในแอปเพื่อเดินตามขั้นตอนจริง · หรือใช้ ‹ › เพื่อข้าม</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
