<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pguard Admin — กฎอัตโนมัติ</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="admin.css">
<style>
  .rule { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid var(--border); }
  .rule:last-child { border-bottom:0; }
  .rule .flow { flex:1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .node { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:var(--r-md); font-size:13px; font-weight:500; }
  .node.trig { background:var(--info-bg); color:var(--info); }
  .node.cond { background:var(--warning-bg); color:var(--amber-700); }
  [data-theme="dark"] .node.cond { color:var(--amber-300); }
  .node.act { background:var(--success-bg); color:var(--success); }
  .arrow { color:var(--text-faint); }
  .builder { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:12px; align-items:stretch; }
  .bnode { background:var(--bg-sunken); border:1.5px dashed var(--border-strong); border-radius:var(--r-md); padding:16px; }
  .bnode .lab { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px; }
  .bnode.trig .lab { color:var(--info); } .bnode.cond .lab { color:var(--amber-600); } .bnode.act .lab { color:var(--success); }
</style>
</head>
<body>
<script>window.PAGE={active:'automation',title:'กฎอัตโนมัติ',titleEn:'Automation',sub:'ทริกเกอร์ เงื่อนไข และการดำเนินการ',subEn:'Triggers, conditions & actions'};</script>
<div class="app">
  <aside class="side" id="pgSide"></aside>
  <div class="main">
    <div class="topbar" id="pgTop"></div>
    <div class="content">
      <div class="panel" style="margin-bottom:18px">
        <div class="panel-head"><h3><span data-th>สร้างกฎใหม่</span><span data-en lang-hide>New rule</span></h3></div>
        <div class="panel-body">
          <div class="builder">
            <div class="bnode trig"><div class="lab"><span data-th>เมื่อ (ทริกเกอร์)</span><span data-en lang-hide>When (trigger)</span></div>
              <select class="select"><option>เจ้าหน้าที่ขาดเช็คอิน</option><option>งานถูกยกเลิก</option><option>รีวิว ≤ 2 ดาว</option></select></div>
            <div style="display:flex;align-items:center;color:var(--text-faint)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
            <div class="bnode cond"><div class="lab"><span data-th>ถ้า (เงื่อนไข)</span><span data-en lang-hide>If (condition)</span></div>
              <select class="select"><option>ขาดเกิน 1 รอบ</option><option>ภายใน 10 นาที</option><option>ไม่ตอบรับ</option></select></div>
            <div style="display:flex;align-items:center;color:var(--text-faint)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
            <div class="bnode act"><div class="lab"><span data-th>ทำ (การดำเนินการ)</span><span data-en lang-hide>Then (action)</span></div>
              <select class="select"><option>แจ้งเตือนทีมแอดมิน</option><option>ส่ง SMS ลูกค้า</option><option>ตั้งสถานะ flag</option></select></div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="pg.toast('สร้างกฎอัตโนมัติแล้ว')"><span data-th>บันทึกกฎ</span><span data-en lang-hide>Save rule</span></button></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3><span data-th>กฎที่ใช้งาน</span><span data-en lang-hide>Active rules</span></h3><span class="sub" style="margin-left:auto">6 <span data-th>กฎ</span><span data-en lang-hide>rules</span></span></div>
        <div id="rules"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const R=[
    ['เจ้าหน้าที่ขาดเช็คอิน','ขาดเกิน 1 รอบ','แจ้งเตือนทีมแอดมิน',true],
    ['งานถูกยกเลิก','ก่อนเริ่ม < 2 ชม.','คิดค่าธรรมเนียม 20%',true],
    ['รีวิว ≤ 2 ดาว','ครั้งที่ 2 ใน 30 วัน','ตั้ง flag เจ้าหน้าที่',true],
    ['ไม่มีเจ้าหน้าที่ตอบรับ','ภายใน 5 นาที','ขยายรัศมีค้นหา',true],
    ['เอกสารใกล้หมดอายุ','เหลือ < 30 วัน','ส่งแจ้งเตือนเจ้าหน้าที่',true],
    ['งานเสร็จไม่ครบเวลา','ทำ < 90% ของเวลา','คำนวณคืนเงินอัตโนมัติ',false],
  ];
  document.getElementById('rules').innerHTML=R.map(([t,c,a,on],i)=>`
    <div class="rule">
      <div class="flow">
        <span class="node trig"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7v8l10-12h-7z"/></svg>${t}</span>
        <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <span class="node cond">${c}</span>
        <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <span class="node act">${a}</span>
      </div>
      <button class="tgl ${on?'on':''}" onclick="this.classList.toggle('on');pg.toast(this.classList.contains('on')?'เปิดใช้งานกฎ':'ปิดใช้งานกฎ',this.classList.contains('on'))"></button>
    </div>`).join('');
</script>
<script src="admin-shell.js"></script>
</body>
</html>
