<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pguard Admin — รายงาน</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="admin.css">
<style>
  .date-pick { display:inline-flex; align-items:center; gap:9px; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-md); padding:8px 13px; font-size:13.5px; color:var(--text); cursor:pointer; }
  .legend { display:flex; gap:16px; font-size:12.5px; color:var(--text-muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend .d { width:10px; height:10px; border-radius:3px; }
  .heat { display:grid; grid-template-columns:auto repeat(12,1fr); gap:4px; font-size:11px; }
  .heat .hcell { aspect-ratio:1.4; border-radius:4px; }
  .heat .hlbl { font-size:11px; color:var(--text-muted); display:flex; align-items:center; padding-right:6px; }
  .donut-wrap { display:flex; align-items:center; gap:24px; }
</style>
</head>
<body>
<script>window.PAGE={active:'reports',title:'รายงาน',titleEn:'Reports',sub:'วิเคราะห์ผลการดำเนินงาน',subEn:'Operational analytics'};</script>
<div class="app">
  <aside class="side" id="pgSide"></aside>
  <div class="main">
    <div class="topbar" id="pgTop"></div>
    <div class="content wide">
      <div class="filters">
        <div class="date-pick"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>1 พ.ค. – 3 มิ.ย. 2026</span></div>
        <div class="spacer"></div>
        <button class="btn secondary sm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span data-th>ส่งออก CSV</span><span data-en lang-hide>Export CSV</span></button>
      </div>

      <div class="grid-2" style="margin-bottom:18px">
        <div class="panel">
          <div class="panel-head"><h3><span data-th>แนวโน้มรายได้</span><span data-en lang-hide>Revenue trend</span></h3><span class="sub" style="margin-left:auto;color:var(--success)">+14% MoM</span></div>
          <div class="panel-body"><svg viewBox="0 0 520 200" style="width:100%;height:auto">
            <g stroke="var(--border)" stroke-width="1"><line x1="0" y1="50" x2="520" y2="50"/><line x1="0" y1="100" x2="520" y2="100"/><line x1="0" y1="150" x2="520" y2="150"/></g>
            <polyline points="0,150 65,140 130,120 195,128 260,90 325,70 390,82 455,50 520,40" fill="none" stroke="var(--brand-int)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <polygon points="0,150 65,140 130,120 195,128 260,90 325,70 390,82 455,50 520,40 520,200 0,200" fill="url(#gr)" opacity=".15"/>
            <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FA971"/><stop offset="1" stop-color="#1FA971" stop-opacity="0"/></linearGradient></defs>
            <polyline points="0,168 65,160 130,150 195,155 260,140 325,128 390,135 455,118 520,110" fill="none" stroke="var(--amber-400)" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
          </svg>
          <div class="legend" style="margin-top:14px"><span><span class="d" style="background:var(--brand-int)"></span><span data-th>รายได้</span><span data-en lang-hide>Revenue</span></span><span><span class="d" style="background:var(--amber-400)"></span><span data-th>จำนวนงาน</span><span data-en lang-hide>Bookings</span></span></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3><span data-th>งานตามประเภทบริการ</span><span data-en lang-hide>Bookings by service</span></h3></div>
          <div class="panel-body"><div style="display:flex;flex-direction:column;gap:16px">
            ${''}
            <div id="svcBars"></div>
          </div></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3><span data-th>การใช้งานเจ้าหน้าที่ (heatmap)</span><span data-en lang-hide>Guard utilization</span></h3><span class="sub" style="margin-left:auto"><span data-th>ชม. × วัน</span><span data-en lang-hide>hour × day</span></span></div>
          <div class="panel-body"><div class="heat" id="heat"></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3><span data-th>การกลับมาใช้ซ้ำของลูกค้า</span><span data-en lang-hide>Customer retention</span></h3></div>
          <div class="panel-body"><div id="cohort"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // service bars
  const SVC=[['หมู่บ้าน','Village',42,'var(--brand-int)'],['คอนโด','Condo',31,'var(--green-400)'],['โรงงาน','Factory',18,'var(--amber-500)'],['อีเวนต์','Event',9,'var(--amber-300)']];
  document.getElementById('svcBars').innerHTML=SVC.map(([th,en,pct,c])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span><span data-th>${th}</span><span data-en lang-hide>${en}</span></span><span class="mono muted">${pct}%</span></div><div style="height:10px;border-radius:5px;background:var(--bg-sunken);overflow:hidden"><div style="width:${pct}%;height:100%;background:${c};border-radius:5px"></div></div></div>`).join('');
  // heatmap
  const days=['จ','อ','พ','พฤ','ศ','ส','อา'];
  let h='<div></div>'+Array.from({length:12},(_,i)=>`<div class="hlbl" style="justify-content:center">${i*2}</div>`).join('');
  days.forEach(d=>{h+=`<div class="hlbl">${d}</div>`;for(let i=0;i<12;i++){const v=Math.random();const op=0.12+v*0.85;h+=`<div class="hcell" style="background:color-mix(in srgb, var(--brand-int) ${Math.round(op*100)}%, transparent)"></div>`;}});
  document.getElementById('heat').innerHTML=h;
  // cohort retention bars
  const COH=[['สัปดาห์ 0','Week 0',100],['สัปดาห์ 1','Week 1',74],['สัปดาห์ 2','Week 2',61],['สัปดาห์ 4','Week 4',52],['สัปดาห์ 8','Week 8',45],['สัปดาห์ 12','Week 12',41]];
  document.getElementById('cohort').innerHTML=COH.map(([th,en,pct])=>`<div style="display:flex;align-items:center;gap:12px;margin-bottom:11px"><span style="width:80px;font-size:12.5px;color:var(--text-muted)"><span data-th>${th}</span><span data-en lang-hide>${en}</span></span><div style="flex:1;height:22px;border-radius:6px;background:var(--bg-sunken);overflow:hidden"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--green-600),var(--green-400));border-radius:6px"></div></div><span class="mono" style="width:38px;text-align:right;font-weight:600;color:var(--text-strong)">${pct}%</span></div>`).join('');
</script>
<script src="admin-shell.js"></script>
</body>
</html>
