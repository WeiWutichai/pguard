<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pguard Admin — ส่งการแจ้งเตือน</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="admin.css">
<style>
  .bcast-grid { display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  .aud-opt { display:flex; align-items:center; gap:12px; padding:13px 15px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:10px; cursor:pointer; }
  .aud-opt.on { border-color:var(--brand-int); background:var(--green-50); }
  [data-theme="dark"] .aud-opt.on { background:rgba(47,192,137,.1); }
  .aud-opt .ai { width:38px; height:38px; border-radius:11px; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center; flex:none; }
  .aud-opt.on .ai { background:var(--brand-int); color:#fff; }
  .aud-opt .at { font-size:14px; font-weight:600; color:var(--text-strong); }
  .aud-opt .ac { margin-left:auto; font-family:var(--font-mono); font-size:12px; color:var(--text-muted); }
  .seg-time { display:inline-flex; background:var(--bg-sunken); border:1px solid var(--border); border-radius:var(--r-md); padding:3px; }
  .seg-time button { border:0; background:transparent; font-family:var(--font-thai); font-size:13px; font-weight:600; color:var(--text-muted); padding:8px 16px; border-radius:8px; cursor:pointer; }
  .seg-time button.on { background:var(--bg-surface); color:var(--text-strong); box-shadow:var(--sh-xs); }
  /* phone preview */
  .preview-phone { background:var(--bg-sunken); border-radius:var(--r-lg); padding:24px; display:flex; flex-direction:column; align-items:center; }
  .notif-prev { width:280px; background:var(--bg-surface); border-radius:16px; box-shadow:var(--sh-lg); padding:14px; display:flex; gap:12px; }
  .notif-prev .pi { width:38px; height:38px; border-radius:10px; background:var(--green-900); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .notif-prev .pt { font-size:13.5px; font-weight:600; color:var(--text-strong); }
  .notif-prev .pb { font-size:12.5px; color:var(--text-muted); margin-top:2px; line-height:1.4; }
  .notif-prev .pm { font-size:10.5px; color:var(--text-faint); margin-top:4px; }
  .sent-row { display:flex; align-items:center; gap:13px; padding:13px 16px; border-bottom:1px solid var(--border); }
  .sent-row:last-child { border-bottom:0; }
  .sent-row .si { width:36px; height:36px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<script>window.PAGE={active:'broadcast',title:'ส่งการแจ้งเตือน',titleEn:'Broadcast',sub:'ส่ง push และข้อความถึงผู้ใช้',subEn:'Send push & in-app messages'};</script>
<div class="app">
  <aside class="side" id="pgSide"></aside>
  <div class="main">
    <div class="topbar" id="pgTop"></div>
    <div class="content">
      <div class="bcast-grid">
        <!-- compose -->
        <div class="panel"><div class="panel-head"><h3><span data-th>เขียนข้อความใหม่</span><span data-en lang-hide>Compose</span></h3></div>
          <div class="panel-body">
            <div class="field"><label data-th>กลุ่มเป้าหมาย</label><label data-en lang-hide>Target audience</label>
              <div class="aud-opt on"><div class="ai"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg></div><div><div class="at" data-th>ผู้ใช้ทั้งหมด</div><div class="at" data-en lang-hide>All users</div></div><span class="ac">~2,800</span></div>
              <div class="aud-opt"><div class="ai"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 8-8 11-4.5-3-8-6-8-11V5z"/></svg></div><div><div class="at" data-th>เฉพาะเจ้าหน้าที่</div><div class="at" data-en lang-hide>Guards only</div></div><span class="ac">384</span></div>
              <div class="aud-opt"><div class="ai"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg></div><div><div class="at" data-th>เฉพาะลูกค้า</div><div class="at" data-en lang-hide>Customers only</div></div><span class="ac">2,418</span></div>
              <div class="aud-opt"><div class="ai"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><div><div class="at" data-th>ผู้ใช้เฉพาะราย (ค้นหา)</div><div class="at" data-en lang-hide>Specific user</div></div></div>
            </div>
            <div class="field"><label data-th>ประเภท</label><label data-en lang-hide>Notification type</label>
              <select class="select"><option>ทั่วไป (general)</option><option>โปรโมชัน (promo)</option><option>ระบบ (system)</option><option>เตือนความปลอดภัย (safety)</option></select></div>
            <div class="field"><label data-th>หัวข้อ</label><label data-en lang-hide>Title</label><input class="input" id="bTitle" value="อัปเดตระบบใหม่ 🎉" oninput="syncPrev()"></div>
            <div class="field"><label data-th>เนื้อหา</label><label data-en lang-hide>Body</label><textarea class="input" id="bBody" rows="3" oninput="syncPrev()">เพิ่มฟีเจอร์ติดตามเจ้าหน้าที่แบบเรียลไทม์ อัปเดตแอปเพื่อใช้งาน</textarea></div>
            <div class="field" style="margin-bottom:0"><label data-th>กำหนดส่ง</label><label data-en lang-hide>Schedule</label>
              <div style="display:flex;gap:12px;align-items:center">
                <div class="seg-time" id="schedSeg"><button class="on" data-s="now" data-th>ส่งทันที</button><button data-s="later" data-th>ตั้งเวลา</button></div>
                <input class="input" type="text" value="3 มิ.ย. 2026 · 18:00" style="flex:1;opacity:.5" id="schedInput" disabled>
              </div>
            </div>
          </div>
          <div class="pagination" style="justify-content:flex-end;gap:10px"><button class="btn secondary"><span data-th>บันทึกร่าง</span><span data-en lang-hide>Save draft</span></button><button class="btn primary" onclick="pg.toast('ส่งการแจ้งเตือนถึง 2,800 คนแล้ว')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg><span data-th>ส่งเลย</span><span data-en lang-hide>Send now</span></button></div>
        </div>

        <!-- preview + history -->
        <div>
          <div class="panel" style="margin-bottom:18px"><div class="panel-head"><h3><span data-th>ตัวอย่าง</span><span data-en lang-hide>Preview</span></h3></div>
            <div class="panel-body"><div class="preview-phone">
              <div class="notif-prev"><div class="pi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 8-8 11-4.5-3-8-6-8-11V5z"/></svg></div>
                <div style="flex:1;min-width:0"><div class="pt" id="prevT">อัปเดตระบบใหม่ 🎉</div><div class="pb" id="prevB">เพิ่มฟีเจอร์ติดตามเจ้าหน้าที่แบบเรียลไทม์ อัปเดตแอปเพื่อใช้งาน</div><div class="pm">pguard · ตอนนี้</div></div></div>
            </div></div>
          </div>
          <div class="panel"><div class="panel-head"><h3><span data-th>ส่งล่าสุด</span><span data-en lang-hide>Sent history</span></h3></div>
            <div id="hist"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  function syncPrev(){document.getElementById('prevT').textContent=document.getElementById('bTitle').value||'หัวข้อ';document.getElementById('prevB').textContent=document.getElementById('bBody').value||'เนื้อหา';}
  document.getElementById('schedSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b));const later=b.dataset.s==='later';const inp=document.getElementById('schedInput');inp.disabled=!later;inp.style.opacity=later?'1':'.5';});
  document.querySelectorAll('.aud-opt').forEach(o=>o.addEventListener('click',()=>{document.querySelectorAll('.aud-opt').forEach(x=>x.classList.remove('on'));o.classList.add('on');}));
  const H=[['green','โปรโมชันวันแม่','ลูกค้า · 2,418 คน','2 มิ.ย.'],['blue','อัปเดตนโยบายความปลอดภัย','ทั้งหมด · 2,800 คน','31 พ.ค.'],['amber','เตือนต่ออายุเอกสาร','เจ้าหน้าที่ · 42 คน','29 พ.ค.']];
  const HC={green:'var(--success)',blue:'var(--info)',amber:'var(--amber-500)'};
  document.getElementById('hist').innerHTML=H.map(([c,t,aud,d])=>`<div class="sent-row"><div class="si" style="background:color-mix(in srgb,${HC[c]} 14%,transparent);color:${HC[c]}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></div><div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:var(--text-strong)">${t}</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:1px">${aud}</div></div><div style="font-size:12px;color:var(--text-faint);font-family:var(--font-mono)">${d}</div></div>`).join('');
</script>
<script src="admin-shell.js"></script>
</body>
</html>
