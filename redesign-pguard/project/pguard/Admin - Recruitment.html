<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pguard Admin — สรรหาบุคลากร</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="admin.css">
<style>
  .pipe { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; align-items:start; }
  .pcol { background:var(--bg-sunken); border-radius:var(--r-lg); padding:12px; min-height:300px; }
  .pcol-head { display:flex; align-items:center; gap:8px; padding:4px 6px 12px; font-size:13px; font-weight:600; color:var(--text-strong); }
  .pcol-head .ct { margin-left:auto; font-family:var(--font-mono); font-size:11px; background:var(--bg-surface); color:var(--text-muted); padding:1px 8px; border-radius:var(--r-full); }
  .pcard { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-md); padding:13px; margin-bottom:10px; box-shadow:var(--sh-xs); cursor:grab; }
  .pcard:hover { box-shadow:var(--sh-sm); }
  .pcard .nm { font-size:14px; font-weight:600; color:var(--text-strong); display:flex; align-items:center; gap:8px; }
  .pcard .meta { font-size:12px; color:var(--text-muted); margin-top:5px; display:flex; gap:7px; align-items:center; }
  .pcard .tags { display:flex; gap:5px; margin-top:9px; flex-wrap:wrap; }
  .pcard .t { font-size:10.5px; font-weight:500; padding:2px 8px; border-radius:var(--r-full); background:var(--bg-sunken); color:var(--text-muted); }
  .dotc { width:8px; height:8px; border-radius:50%; flex:none; }
</style>
</head>
<body>
<script>window.PAGE={active:'recruit',title:'สรรหาบุคลากร',titleEn:'Recruitment',sub:'ไปป์ไลน์ผู้สมัครเจ้าหน้าที่',subEn:'Guard recruitment pipeline'};</script>
<div class="app">
  <aside class="side" id="pgSide"></aside>
  <div class="main">
    <div class="topbar" id="pgTop"></div>
    <div class="content wide">
      <div class="filters">
        <span class="muted" style="font-size:13.5px"><span data-th>ผู้สมัคร 34 คนในไปป์ไลน์</span><span data-en lang-hide>34 candidates in pipeline</span></span>
        <div class="spacer"></div>
        <button class="btn primary sm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span data-th>เพิ่มผู้สมัคร</span><span data-en lang-hide>Add candidate</span></button>
      </div>
      <div class="pipe" id="pipe"></div>
    </div>
  </div>
</div>
<script>
  const COLS=[
    ['sourcing','หาแหล่ง','Sourcing','var(--text-muted)'],
    ['screened','คัดกรองแล้ว','Screened','var(--info)'],
    ['docs','ตรวจเอกสาร','Docs verified','var(--amber-500)'],
    ['approved','อนุมัติ','Approved','var(--brand-int)'],
    ['onboard','เริ่มงาน','Onboarded','var(--success)'],
  ];
  const CARDS={
    sourcing:[['ก.','กฤษณะ ทองคำ','3 ปี','สมัครผ่านเว็บ'],['ป.','ปรีชา ดีงาม','5 ปี','แนะนำโดยเพื่อน'],['ส.','สมพร ใจดี','2 ปี','Job fair']],
    screened:[['น.','นพดล วิเศษ','7 ปี','โทรสัมภาษณ์ ✓'],['อ.','อาทิตย์ สุข','4 ปี','โทรสัมภาษณ์ ✓']],
    docs:[['ว.','วิชัย มั่นคง','6 ปี','เอกสาร 5/5'],['ธ.','ธนา รุ่งเรือง','3 ปี','รอใบตรวจประวัติ']],
    approved:[['ณ.','ณัฐ พงษ์ศรี','8 ปี','อนุมัติแล้ว']],
    onboard:[['ม.','มานะ ตั้งใจ','5 ปี','อบรมเสร็จ'],['ร.','รัตน์ ศรีไทย','4 ปี','พร้อมรับงาน']],
  };
  document.getElementById('pipe').innerHTML=COLS.map(([k,th,en,col])=>`
    <div class="pcol">
      <div class="pcol-head"><span class="dotc" style="background:${col}"></span><span data-th>${th}</span><span data-en lang-hide>${en}</span><span class="ct">${(CARDS[k]||[]).length}</span></div>
      ${(CARDS[k]||[]).map(([av,nm,exp,note])=>`<div class="pcard"><div class="nm"><span style="width:28px;height:28px;border-radius:50%;background:var(--green-100);color:var(--green-800);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:var(--font-latin)">${av}</span>${nm}</div><div class="meta"><span>${exp}</span></div><div class="tags"><span class="t">${note}</span></div></div>`).join('')}
    </div>`).join('');
</script>
<script src="admin-shell.js"></script>
</body>
</html>
