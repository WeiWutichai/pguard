<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pguard Admin — จัดการงานทั้งหมด</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="admin.css">
<style>
  .view-toggle { display:inline-flex; background:var(--bg-sunken); border:1px solid var(--border); border-radius:var(--r-md); padding:3px; }
  .view-toggle button { border:0; background:transparent; font-family:var(--font-thai); font-size:13px; font-weight:600; color:var(--text-muted); padding:7px 14px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .view-toggle button.on { background:var(--bg-surface); color:var(--text-strong); box-shadow:var(--sh-xs); }
  .bulk-bar { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--green-900); color:#fff; border-radius:var(--r-md); margin-bottom:14px; }
  [data-theme="dark"] .bulk-bar { background:var(--brand-int); color:#04140D; }
  .bulk-bar .cnt { font-weight:600; }
  .bulk-bar .bb { margin-left:auto; display:flex; gap:8px; }
  .bulk-bar button { background:rgba(255,255,255,.18); border:0; color:inherit; font-family:var(--font-thai); font-weight:600; font-size:13px; padding:7px 13px; border-radius:8px; cursor:pointer; }
  [data-theme="dark"] .bulk-bar button { background:rgba(0,0,0,.15); }
  .cbx { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cbx.on { background:var(--brand-int); border-color:var(--brand-int); }
  /* calendar */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-h { font-size:12px; font-weight:600; color:var(--text-faint); text-align:center; padding-bottom:6px; }
  .cal-cell { min-height:96px; border:1px solid var(--border); border-radius:var(--r-md); padding:8px; background:var(--bg-surface); }
  .cal-cell .dn { font-family:var(--font-mono); font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .cal-cell.today .dn { color:var(--brand-int); font-weight:700; }
  .cal-job { font-size:10.5px; padding:3px 6px; border-radius:5px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<script>window.PAGE={active:'tasks',title:'จัดการงานทั้งหมด',titleEn:'Tasks',sub:'คำขอจ้างทุกสถานะ',subEn:'All guard requests'};</script>
<div class="app">
  <aside class="side" id="pgSide"></aside>
  <div class="main">
    <div class="topbar" id="pgTop"></div>
    <div class="content">
      <div class="filters">
        <div class="view-toggle" id="viewToggle">
          <button class="on" data-v="table"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span data-th>ตาราง</span><span data-en lang-hide>Table</span></button>
          <button data-v="cal"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span data-th>ปฏิทิน</span><span data-en lang-hide>Calendar</span></button>
        </div>
        <span class="chip-f on"><span data-th>ทุกสถานะ</span><span data-en lang-hide>All status</span></span>
        <span class="chip-f"><span data-th>ยังไม่จัด</span><span data-en lang-hide>Unassigned</span></span>
        <div class="spacer"></div>
        <div class="search-sm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="ค้นหา request…"></div>
      </div>

      <div id="tableView">
        <div class="bulk-bar"><div class="cbx on" style="background:rgba(255,255,255,.25);border-color:transparent"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div><span class="cnt">เลือก 3 รายการ</span>
          <div class="bb"><button><span data-th>มอบหมายเจ้าหน้าที่</span><span data-en lang-hide>Assign</span></button><button><span data-th>ยกเลิก</span><span data-en lang-hide>Cancel</span></button><button><span data-th>คืนเงิน</span><span data-en lang-hide>Refund</span></button></div></div>
        <div class="panel">
          <div class="table-wrap"><table class="tbl">
            <thead><tr><th style="width:40px"></th><th>Request</th><th data-th>ลูกค้า</th><th data-en lang-hide>Customer</th><th data-th>เจ้าหน้าที่</th><th data-th>บริการ</th><th data-th>สถานะ</th><th data-th>นัดหมาย</th><th data-th>ยอด</th></tr></thead>
            <tbody id="rows"></tbody>
          </table></div>
          <div class="pagination"><span data-th>แสดง 1–8 จาก 48 รายการ</span><span data-en lang-hide>1–8 of 48</span><div class="pages"><span class="pg on">1</span><span class="pg">2</span><span class="pg">…</span><span class="pg">6</span></div></div>
        </div>
      </div>

      <div id="calView" style="display:none">
        <div class="panel"><div class="panel-body">
          <div class="cal" id="cal"></div>
        </div></div>
      </div>
    </div>
  </div>
</div>
<script>
  const T=[
    ['REQ-48291','นภาพร ศรีสุข','—','หมู่บ้าน','pending','วันนี้ 14:00','฿1,840',1],
    ['REQ-48288','วิชัย ส.','ณัฐพล ว.','คอนโด','assigned','วันนี้ 13:00','฿2,000',1],
    ['REQ-48285','คอนโด ไอดีโอ','ธีรศักดิ์ ม.','คอนโด','started','วันนี้ 12:00','฿2,760',0],
    ['REQ-48280','ไทยพัฒนา','กิตติ ร.','โรงงาน','started','วันนี้ 08:00','฿4,480',1],
    ['REQ-48276','นิดา ป.','พิชัย ส.','อีเวนต์','accepted','วันนี้ 18:00','฿1,920',0],
    ['REQ-48270','สมหญิง ก.','สุริยา จ.','หมู่บ้าน','completed','เมื่อวาน','฿1,840',0],
    ['REQ-48261','อนุชา ห.','—','หมู่บ้าน','cancelled','เมื่อวาน','฿1,840',0],
    ['REQ-48255','โรงงาน ปทุม','เอกชัย ห.','โรงงาน','completed','เมื่อวาน','฿4,480',0],
  ];
  const ST={pending:'amber',assigned:'blue',accepted:'blue',started:'green',completed:'green',cancelled:'red'};
  const COL={pending:'var(--amber-500)',assigned:'var(--info)',accepted:'var(--info)',started:'var(--brand-int)',completed:'var(--success)',cancelled:'var(--danger)'};
  document.getElementById('rows').innerHTML=T.map(([id,cust,guard,svc,st,sched,amt,sel])=>`
    <tr><td><div class="cbx ${sel?'on':''}" onclick="event.stopPropagation();this.classList.toggle('on')">${sel?'<svg width=11 height=11 viewBox="0 0 24 24" fill=none stroke=#fff stroke-width=3><path d="M20 6 9 17l-5-5"/></svg>':''}</div></td>
      <td class="mono strong">${id}</td><td colspan="2">${cust}</td>
      <td>${guard==='—'?'<span class="bdg amber"><span data-th>ยังไม่จัด</span><span data-en lang-hide>Unassigned</span></span>':guard}</td>
      <td class="muted">${svc}</td>
      <td><span class="bdg ${ST[st]}"><span class="d" style="background:${COL[st]}"></span>${st}</span></td>
      <td class="mono muted">${sched}</td><td class="mono">${amt}</td></tr>`).join('');

  // calendar
  const days=['อา','จ','อ','พ','พฤ','ศ','ส'];
  let calH=days.map(d=>`<div class="cal-h">${d}</div>`).join('');
  const jobs={3:[['หมู่บ้าน','green'],['คอนโด','blue']],5:[['โรงงาน','amber']],8:[['อีเวนต์','green'],['คอนโด','green'],['+2','gray']],12:[['หมู่บ้าน','green']],15:[['โรงงาน','blue']]};
  const JC={green:'var(--success-bg)|var(--success)',blue:'var(--info-bg)|var(--info)',amber:'var(--warning-bg)|var(--amber-700)',gray:'var(--bg-sunken)|var(--text-muted)'};
  for(let d=1;d<=21;d++){const j=jobs[d]||[];const tc=d===8?'today':'';calH+=`<div class="cal-cell ${tc}"><div class="dn">${d}</div>${j.map(([t,c])=>{const[bg,col]=JC[c].split('|');return `<div class="cal-job" style="background:${bg};color:${col}">${t}</div>`;}).join('')}</div>`;}
  document.getElementById('cal').innerHTML=calH;

  document.getElementById('viewToggle').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#viewToggle button').forEach(x=>x.classList.toggle('on',x===b));const cal=b.dataset.v==='cal';document.getElementById('calView').style.display=cal?'':'none';document.getElementById('tableView').style.display=cal?'none':'';});
</script>
<script src="admin-shell.js"></script>
</body>
</html>
