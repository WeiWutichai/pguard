[package]
name = "pguard-api-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pguard-api-gateway"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }                 # workspace enables the "ws" feature
tokio = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
shared-events = { workspace = true }         # booking topic constants for the status WS
async-nats = { workspace = true }            # subscribe to pguard.events.booking.* (status fan-out)
futures = { workspace = true }               # WS stream split + NATS subscriber stream
observability = { workspace = true }
tokio-tungstenite = "0.24"                   # WS client side of the generic edge WS proxy (+ the gated WS e2e tests)

[dev-dependencies]
tower = { workspace = true }
