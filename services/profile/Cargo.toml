[package]
name = "pguard-profile"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pguard-profile"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }     # DecodingKey held in AppState (HasJwtSecret) — same as booking
async-nats = { workspace = true }       # outbox relay → JetStream (user.approved producer)
async-trait = { workspace = true }      # dyn EventPublisher seam for the relay (unit-testable)
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
shared-events = { workspace = true }     # EventEnvelope + topics (user.approved)
observability = { workspace = true }

[dev-dependencies]
tower = { workspace = true }            # ServiceExt::oneshot for router tests
