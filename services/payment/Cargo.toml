[package]
name = "pguard-payment"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pguard-payment"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }            # AuthUser extractor needs the jti revocation blocklist
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }     # money — Decimal everywhere, never f64
jsonwebtoken = { workspace = true }     # DecodingKey (HasJwtSecret) + inbound service-JWT verify
async-nats = { workspace = true }       # transactional-outbox relay → JetStream publish
# PRE-PAY reads booking's /internal/bookings/{id} (service-JWT'd); the slip path POSTs the slip
# image multipart to Slip2Go + PUTs it to S3 → needs the `multipart` feature on top of the
# workspace default (json + rustls-tls).
reqwest = { workspace = true, features = ["multipart"] }
sha2 = { workspace = true }             # SigV4 canonical-request + signing-key hashing (slip S3 store)
hmac = { workspace = true }             # SigV4 HMAC-SHA256 chain (slip S3 store)
futures = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
shared-events = { workspace = true }
observability = { workspace = true }

[dev-dependencies]
tower = { workspace = true }            # ServiceExt::oneshot for router tests
