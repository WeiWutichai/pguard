[package]
name = "pguard-identity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pguard-identity"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }     # user access JWTs (HS256, via shared::auth)
argon2 = { workspace = true }           # password + refresh-secret hashing (CPU-only)
totp-rs = { workspace = true }          # RFC-6238 TOTP 2FA (#144) — vetted, not hand-rolled
aes-gcm = { workspace = true }          # AES-256-GCM seal of the TOTP secret at rest (TOTP_ENC_KEY)
sha2 = { workspace = true }             # SHA-256 of API-token secrets + recovery codes (hash-at-rest)
rand = { workspace = true }             # CSPRNG: TOTP secret, recovery codes, API-token secret
data-encoding = { workspace = true }    # base32 recovery-code / token alphabet (RFC 4648)
subtle = { workspace = true }           # constant-time compare of presented API-token / recovery hash
async-nats = { workspace = true }       # JetStream consumer for user.compromised
async-trait = { workspace = true }      # dyn seam for the revoke-all dependency
futures = { workspace = true }          # StreamExt over the JetStream consumer + export fan-out
reqwest = { workspace = true }          # data-export aggregator: service-JWT'd internal reads
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
shared-events = { workspace = true }
observability = { workspace = true }

[dev-dependencies]
tower = { workspace = true }            # ServiceExt::oneshot for router tests
