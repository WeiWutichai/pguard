[package]
name = "pguard-rating"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pguard-rating"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }            # AuthUser extractor needs the jti revocation blocklist
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }     # rating summary average — Decimal, never f64
jsonwebtoken = { workspace = true }     # DecodingKey (HasJwtSecret) + service-JWT mint/verify
reqwest = { workspace = true }          # calls booking's /internal read (service-JWT'd)
async-nats = { workspace = true }       # transactional-outbox relay → JetStream publish
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
shared-events = { workspace = true }
observability = { workspace = true }

[dev-dependencies]
tower = { workspace = true }            # ServiceExt::oneshot for router tests
