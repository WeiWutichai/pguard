# HMAC-SHA256 event signing (forged-event defense) + constant-time verify + the signed
# publish/verify NATS glue (single source of truth so no producer/consumer forgets).
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
async-nats = { workspace = true }
anyhow = { workspace = true }
# Stamp the current span's W3C traceparent into the envelope at construction time so a
# booking→NATS→notification flow is one distributed trace (C5.1). No cycle: observability
# does not depend on shared-events.
observability = { workspace = true }
