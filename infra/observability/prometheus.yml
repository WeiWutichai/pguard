# pguard v2 — Prometheus config (SCAFFOLD STUB)
#
# Scrapes the otel-collector (which fans in metrics via remote-write) and, later,
# each service's /metrics endpoint directly. See CLAUDE.md → Observability.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The collector exposes its own internal telemetry here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-scrape.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Per-service /metrics jobs ──────────────────────────────────────────────
  # Rust services run on the HOST in dev (`cargo run`), so from inside the
  # compose network they live at host.docker.internal:<port>. Uncomment + adjust
  # the port as each service exposes /metrics.
  #
  # - job_name: api-gateway
  #   static_configs:
  #     - targets: ["host.docker.internal:3000"]
  # - job_name: identity
  #   static_configs:
  #     - targets: ["host.docker.internal:3001"]
  # - job_name: booking
  #   static_configs:
  #     - targets: ["host.docker.internal:3002"]
  # - job_name: payment
  #   static_configs:
  #     - targets: ["host.docker.internal:3003"]
  # - job_name: notification
  #   static_configs:
  #     - targets: ["host.docker.internal:3004"]
  # - job_name: presence
  #   static_configs:
  #     - targets: ["host.docker.internal:3005"]
