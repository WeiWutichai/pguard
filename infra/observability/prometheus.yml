# pguard v2 — Prometheus config (C5.1: per-service /metrics scrape)
#
# Scrapes the otel-collector's own telemetry AND each Rust service's `/metrics`
# endpoint (exposed by the `observability` package: http_requests_total,
# http_request_duration_seconds, nats_consumer_pending). The Grafana "pguard ·
# service overview" dashboard reads these. See CLAUDE.md → Observability.
#
# Rust services run on the HOST in dev (`cargo run`), so from inside the compose
# network they live at host.docker.internal:<port>. The `prometheus` compose
# service maps host.docker.internal → host-gateway so this resolves on Linux too.
# The `job` label = service name; dashboards aggregate by it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The collector exposes its own internal telemetry here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-scrape.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Per-service /metrics jobs (host ports per service main.rs) ──────────────
  # api-gateway serves /metrics on a SEPARATE admin port (METRICS_PORT 9100), NOT its
  # public edge port 3000 — so the registry isn't scrapable from the internet.
  - job_name: api-gateway
    static_configs: [{ targets: ["host.docker.internal:9100"] }]
  - job_name: identity
    static_configs: [{ targets: ["host.docker.internal:3001"] }]
  - job_name: profile
    static_configs: [{ targets: ["host.docker.internal:3002"] }]
  - job_name: otp
    static_configs: [{ targets: ["host.docker.internal:3003"] }]
  - job_name: notification
    static_configs: [{ targets: ["host.docker.internal:3004"] }]
  - job_name: booking
    static_configs: [{ targets: ["host.docker.internal:3005"] }]
  - job_name: payment
    static_configs: [{ targets: ["host.docker.internal:3006"] }]
  - job_name: rating
    static_configs: [{ targets: ["host.docker.internal:3007"] }]
  - job_name: calling
    static_configs: [{ targets: ["host.docker.internal:3008"] }]
  - job_name: presence
    static_configs: [{ targets: ["host.docker.internal:3009"] }]
  - job_name: chat
    static_configs: [{ targets: ["host.docker.internal:3010"] }]
