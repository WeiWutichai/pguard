# notification — lean event consumer + REST ingress (service-JWT). DB-backed.
# Base = prod intent (FCM ENABLED). FCM_DISABLED is VALUE-AWARE (notification fcm::fcm_disabled):
# only a truthy value disables push; "false" below = ENABLED, which FAIL-FASTS at boot unless a
# real service-account JSON is mounted at FCM_SERVICE_ACCOUNT_PATH (loud, never a silent no-op).
# The dev + staging overlays patch FCM_DISABLED="true" (no push, no creds needed). To run prod
# push: keep "false" AND mount the FCM service-account secret as a file at the path below
# (no prod overlay exists yet — see infra/k8s/README.md).
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: http
      port: 3004
      targetPort: 3004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: pguard
        app.kubernetes.io/component: service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: notification
          image: pguard/notification:0.1.0
          envFrom:
            - configMapRef: { name: pguard-config }
            - secretRef: { name: pguard-app-secrets }
            - secretRef: { name: pguard-db-secrets }
          env:
            - name: FCM_DISABLED
              value: "false"
            - name: FCM_SERVICE_ACCOUNT_PATH
              value: "/run/secrets/fcm-service-account.json"
            # Per-service NATS credentials (subject ACL — see contracts/asyncapi/nats-acl.md).
            - name: NATS_USER
              value: "notification"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pguard-nats-secrets, key: NATS_NOTIFICATION_PASSWORD }
          ports:
            - name: http
              containerPort: 3004
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 10
