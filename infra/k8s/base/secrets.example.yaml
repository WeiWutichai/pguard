# ─────────────────────────────────────────────────────────────────────────────
# pguard v2 — Secrets TEMPLATE (documentation only — NOT applied by kustomize).
#
#   ⚠️  DO NOT commit a filled-in copy. Real secrets are created out-of-band
#       (see infra/k8s/README.md → "Secrets"). The dev overlay generates DUMMY
#       values via secretGenerator; staging/prod create these with `kubectl
#       create secret` from a gitignored env file (the `.env.staging.example`
#       pattern), or a sealed-secrets / external-secrets operator.
#
# This file enumerates the EXACT keys every Secret must carry (cross-checked
# against the compose `${VAR:?}` fail-fast list). It is intentionally absent from
# base/kustomization.yaml so a stray CHANGE_ME can never reach a cluster.
#
# Generate each value uniquely (never reuse one across two keys):
#   openssl rand -hex 48      # 96 hex chars — JWT / service-JWT / event-signing / TURN
#   openssl rand -base64 24   # DB / MinIO / Grafana passwords
# ─────────────────────────────────────────────────────────────────────────────
---
# App secrets — EVERY Rust service loads these at startup (compose x-rust-env +
# per-service SERVICE_JWT_SECRET). JWT_SECRET/SERVICE_JWT_SECRET/EVENT_SIGNING_SECRET
# must be ≥64 chars or the services exit.
apiVersion: v1
kind: Secret
metadata:
  name: pguard-app-secrets
  namespace: pguard
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME__openssl_rand_hex_48"
  SERVICE_JWT_SECRET: "CHANGE_ME__openssl_rand_hex_48"
  EVENT_SIGNING_SECRET: "CHANGE_ME__openssl_rand_hex_48"
---
# DB secrets — postgres-primary/replica/pgbouncer + every DB-backed service.
# DATABASE_URL/DATABASE_READ_URL embed POSTGRES_PASSWORD by design (mirrors the
# compose x-db-env URLs); keep the password consistent across all four values.
apiVersion: v1
kind: Secret
metadata:
  name: pguard-db-secrets
  namespace: pguard
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME__db_password"
  REPLICATION_PASSWORD: "CHANGE_ME__replication_password"
  # Writes + read-after-write → pgbouncer:6432 (transaction pooling).
  DATABASE_URL: "postgres://pguard:CHANGE_ME__db_password@pgbouncer:6432/pguard"
  # list/report/discovery reads → the streaming replica.
  DATABASE_READ_URL: "postgres://pguard:CHANGE_ME__db_password@postgres-replica:5432/pguard"
---
# Object store — minio root creds + the S3_ACCESS_KEY/S3_SECRET_KEY booking & chat
# sign presigned URLs with (same values; compose maps S3_* ⇒ MINIO_ROOT_*).
apiVersion: v1
kind: Secret
metadata:
  name: pguard-s3-secrets
  namespace: pguard
type: Opaque
stringData:
  MINIO_ROOT_USER: "CHANGE_ME__minio_user"
  MINIO_ROOT_PASSWORD: "CHANGE_ME__minio_password"
  S3_ACCESS_KEY: "CHANGE_ME__minio_user"
  S3_SECRET_KEY: "CHANGE_ME__minio_password"
---
# OTP / SMS (INET CSGAPI) — otp service only. Inert when SMS is disabled, but the
# service still reads them at startup, so they must be present (any non-empty value).
apiVersion: v1
kind: Secret
metadata:
  name: pguard-otp-secrets
  namespace: pguard
type: Opaque
stringData:
  INET_SMS_USERNAME: "disabled-placeholder"
  INET_SMS_PASSWORD: "disabled-placeholder"
  INET_SMS_SENDER: "PGUARD"
---
# TURN static-auth-secret — shared by coturn (--static-auth-secret) and the calling
# service (which mints short-lived per-caller creds from it). ≥64 chars recommended.
apiVersion: v1
kind: Secret
metadata:
  name: pguard-turn-secrets
  namespace: pguard
type: Opaque
stringData:
  TURN_SECRET: "CHANGE_ME__openssl_rand_hex_48"
---
# Grafana admin — observability is internal-only; still never commit the password.
apiVersion: v1
kind: Secret
metadata:
  name: pguard-grafana-secrets
  namespace: pguard
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME__grafana_password"
