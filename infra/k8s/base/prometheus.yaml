# prometheus — scrapes each service's /metrics + receives OTLP metrics via remote-write.
#
# ADAPTED from infra/observability/prometheus.yml: that file targets `host.docker.internal:<port>`
# because in the DEV compose the Rust services run on the HOST (cargo run). In k8s every service
# runs in-cluster, so the scrape targets are rewritten to cluster DNS (service name = hostname).
# This is the single intentional divergence from the source config; everything else is verbatim.
# (api-gateway keeps /metrics on its admin port 9100, never the public edge.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8888"]

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # ── Per-service /metrics (cluster DNS; api-gateway on its admin port 9100) ──
      - job_name: api-gateway
        static_configs: [{ targets: ["api-gateway:9100"] }]
      - job_name: identity
        static_configs: [{ targets: ["identity:3001"] }]
      - job_name: profile
        static_configs: [{ targets: ["profile:3002"] }]
      - job_name: otp
        static_configs: [{ targets: ["otp:3003"] }]
      - job_name: notification
        static_configs: [{ targets: ["notification:3004"] }]
      - job_name: booking
        static_configs: [{ targets: ["booking:3005"] }]
      - job_name: payment
        static_configs: [{ targets: ["payment:3006"] }]
      - job_name: rating
        static_configs: [{ targets: ["rating:3007"] }]
      - job_name: calling
        static_configs: [{ targets: ["calling:3008"] }]
      - job_name: presence
        static_configs: [{ targets: ["presence:3009"] }]
      - job_name: chat
        static_configs: [{ targets: ["chat:3010"] }]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http # otel-collector remote-writes to prometheus:9090/api/v1/write
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: pguard
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-remote-write-receiver" # otel-collector metrics path
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
