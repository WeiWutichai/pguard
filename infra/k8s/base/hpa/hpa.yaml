# HorizontalPodAutoscalers — ONLY for genuinely stateless, horizontally-scalable workloads:
# the gateway + the 11 stateless services + web-admin. EXCLUDED by design: the StatefulSets
# (postgres/replica/nats/redis/minio/tempo/loki/grafana), pgbouncer (1 pooler is plenty here),
# prometheus (single TSDB), and mediasoup/coturn (hostNetwork ⇒ one-per-node, scale by adding
# nodes, never replicas).
#
# NOT in base/kustomization.yaml — included only by overlays/staging (dev runs replicas:1, no
# HPA). When an HPA is active it OWNS that Deployment's replica count (don't also pin replicas).
# requires metrics-server in the cluster. Target 70% CPU is a conservative starting point — tune
# from the perf baseline (v1-audit/perf-baseline/results.md).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  labels: { app.kubernetes.io/part-of: pguard }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
