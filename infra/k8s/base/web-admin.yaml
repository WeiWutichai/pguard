# web-admin — Next.js 16 admin UI (standalone). Server-side calls reach the gateway over cluster
# DNS (PGUARD_API_BASE_URL); the browser uses same-origin /v1 via the Ingress, so the auth cookie
# stays first-party (NEXT_PUBLIC_API_BASE_URL intentionally unset). Mirrors compose `web-admin`
# (which gates it behind the `ui` profile — here it is first-class, fronted by the Ingress).
apiVersion: v1
kind: Service
metadata:
  name: web-admin
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: web-admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-admin
        app.kubernetes.io/part-of: pguard
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web-admin
          image: pguard/web-admin:0.1.0
          env:
            - name: NODE_ENV
              value: "production"
            # Server-side base URL for the generated TS client → the gateway (internal DNS).
            - name: PGUARD_API_BASE_URL
              value: "http://api-gateway:3000"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
