# payment — payments, refunds, proration, receipts (split from v1 booking). DB-backed.
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: payment
  ports:
    - name: http
      port: 3006
      targetPort: 3006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/part-of: pguard
        app.kubernetes.io/component: service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: payment
          image: pguard/payment:0.1.0
          envFrom:
            - configMapRef: { name: pguard-config }
            - secretRef: { name: pguard-app-secrets }
            - secretRef: { name: pguard-db-secrets }
          env:
            - name: BOOKING_URL
              value: "http://booking:3005"
          ports:
            - name: http
              containerPort: 3006
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 3006 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3006 }
            initialDelaySeconds: 10
            periodSeconds: 10
