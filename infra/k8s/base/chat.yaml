# chat — messaging REST + WS (N+1-fixed list), attachment uploads. DB-backed + signs its own
# SigV4 presigned URLs for attachments (S3 settings from config + s3-secrets).
apiVersion: v1
kind: Service
metadata:
  name: chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: chat
  ports:
    - name: http
      port: 3010
      targetPort: 3010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/part-of: pguard
        app.kubernetes.io/component: service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: chat
          image: pguard/chat:0.1.0
          envFrom:
            - configMapRef: { name: pguard-config } # incl. S3_ENDPOINT/BUCKET/REGION/PUBLIC_URL
            - secretRef: { name: pguard-app-secrets }
            - secretRef: { name: pguard-db-secrets }
            - secretRef: { name: pguard-s3-secrets } # S3_ACCESS_KEY, S3_SECRET_KEY
          env:
            # Per-service NATS credentials (subject ACL — see contracts/asyncapi/nats-acl.md).
            - name: NATS_USER
              value: "chat"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pguard-nats-secrets, key: NATS_CHAT_PASSWORD }
            # chat validates conversation creation against booking (service-JWT GET /internal/bookings/{id}).
            - name: BOOKING_URL
              value: "http://booking:3005"
          ports:
            - name: http
              containerPort: 3010
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 3010 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3010 }
            initialDelaySeconds: 10
            periodSeconds: 10
