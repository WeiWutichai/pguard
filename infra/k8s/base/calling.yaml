# calling — WebRTC signaling + ICE/TURN credential minting (split from v1 booking). DB-backed.
# Serves GET /v1/calls/ice: mints SHORT-LIVED per-caller TURN creds from TURN_SECRET (shared with
# coturn) — the secret never reaches clients. TURN_URLS/STUN_URLS are the CLIENT-reachable URLs;
# PATCH TURN_URLS per overlay to the public TURN host.
apiVersion: v1
kind: Service
metadata:
  name: calling
  labels:
    app.kubernetes.io/name: calling
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: calling
  ports:
    - name: http
      port: 3008
      targetPort: 3008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calling
  labels:
    app.kubernetes.io/name: calling
    app.kubernetes.io/part-of: pguard
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calling
        app.kubernetes.io/part-of: pguard
        app.kubernetes.io/component: service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: calling
          image: pguard/calling:0.1.0
          envFrom:
            - configMapRef: { name: pguard-config }
            - secretRef: { name: pguard-app-secrets }
            - secretRef: { name: pguard-db-secrets }
            - secretRef: { name: pguard-turn-secrets } # TURN_SECRET (shared with coturn)
          env:
            - name: BOOKING_URL
              value: "http://booking:3005"
            - name: MEDIASOUP_URL
              value: "http://mediasoup:3011"
            - name: STUN_URLS
              value: "stun:stun.l.google.com:19302"
            # PATCH per overlay → turn:<public-host>:3478?transport=udp,...:3478?transport=tcp
            - name: TURN_URLS
              value: "turn:turn.pguard.local:3478?transport=udp,turn:turn.pguard.local:3478?transport=tcp"
            - name: TURN_CRED_TTL_SECS
              value: "3600"
            # Per-service NATS credentials (subject ACL — see contracts/asyncapi/nats-acl.md).
            - name: NATS_USER
              value: "calling"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pguard-nats-secrets, key: NATS_CALLING_PASSWORD }
          ports:
            - name: http
              containerPort: 3008
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 3008 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3008 }
            initialDelaySeconds: 10
            periodSeconds: 10
