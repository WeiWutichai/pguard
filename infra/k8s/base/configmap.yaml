# pguard v2 — shared NON-SECRET env, mirrors the compose `x-rust-env` + `x-db-env`
# anchors and the per-service non-secret S3 settings. Secrets (passwords, JWT/HMAC keys,
# DATABASE_URL — which embeds the password) live in Secret objects, never here.
#
# Source of truth: infra/docker/docker-compose.prod.yml (anchors at lines 44–69, 421–430).
# Every value here is a compose non-secret env var; `diff vs compose` is in infra/k8s/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pguard-config
  labels:
    app.kubernetes.io/part-of: pguard
data:
  # ── x-rust-env (shared by every Rust service) ──────────────────────────────
  RUST_LOG: "info"
  # Cluster DNS: service name = hostname (compose `nats`/`redis`/`otel-collector`).
  NATS_URL: "nats://nats:4222"
  REDIS_CACHE_URL: "redis://redis:6379/0"
  REDIS_PUBSUB_URL: "redis://redis:6379/1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  # ── x-db-env non-secret half (POSTGRES_USER/DB; the password + composed
  #    DATABASE_URL/DATABASE_READ_URL are in the pguard-db-secrets Secret) ──────
  POSTGRES_USER: "pguard"
  POSTGRES_DB: "pguard"
  DATABASE_MAX_CONNECTIONS: "10"
  DATABASE_READ_MAX_CONNECTIONS: "10"
  # ── Object store non-secret settings (booking + chat presigned uploads).
  #    S3_ACCESS_KEY/S3_SECRET_KEY are in pguard-s3-secrets. ────────────────────
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "pguard"
  S3_REGION: "us-east-1"
  # Empty ⇒ presigned GET URLs fall back to S3_ENDPOINT (set to the public CDN host
  # in an overlay when MinIO/R2 is reachable under a public name).
  S3_PUBLIC_URL: ""
