# =============================================================================
# pguard — NATS server config (JetStream + per-service authorization)
#
# Mounted into the nats container (compose `-c /etc/nats/nats.conf`). Closes the
# "no server-side auth" gap: previously any container on the network could publish/
# subscribe ANY subject (the signed envelope stops FORGED payloads, but not an
# unauthorized publish/subscribe). Now every service connects as its OWN user and the
# broker enforces least-privilege subject permissions.
#
# Passwords come from the environment (NATS resolves `$VAR` here) — same `${VAR:?}`
# secret pattern as the rest of the stack; NO real credentials live in this file or the
# repo. See infra/.env.staging.example for the var list and docs/SECRET-ROTATION.md to
# rotate them. The ACL is documented for review in contracts/asyncapi/nats-acl.md.
#
# ── Least-privilege model ────────────────────────────────────────────────────
# DATA plane (the meaningful boundary): each producer may publish ONLY its own
#   bounded-context subjects (`pguard.events.<ctx>.>`). A consumer-only service
#   (notification, presence, the gateway) may publish NO event subject at all — so a
#   compromised container cannot inject a cross-context event (e.g. booking forging a
#   `payment.completed`, or notification forging anything). This is enforced per-user.
# CONTROL plane (JetStream): services that use JetStream share the `$JS.API.>` +
#   `$JS.ACK.>` control subjects (stream/consumer create+info, pull-next, ack) and
#   `_INBOX.>` for request replies. There is exactly ONE stream (`PGUARD_EVENTS`), so
#   the residual breadth is bounded; scoping `$JS.API.*.PGUARD_EVENTS.*` per stream is a
#   noted follow-up (kept broad here to avoid a fragile, version-specific ACL that could
#   break JetStream — staging must not go down on a permission typo).
# The api-gateway uses a CORE (non-JetStream) subscribe to the booking subjects for its
#   status-WS hub, so it gets `subscribe` on `pguard.events.booking.>` and publishes
#   nothing.
# =============================================================================

# JetStream with the default (ephemeral) store — same as the prior `-js` flag. The k8s
# StatefulSet overrides the store dir to its durable PVC via the `-sd /data` CLI flag
# (CLI flags override config), so this file stays portable across compose + k8s.
jetstream {}

http: 8222   # monitoring (/healthz, /varz) — unauthenticated, read-only metrics only

authorization {
  users: [
    # ── Producers: publish only their own context's data subjects + JS control ──
    { user: "booking", password: $NATS_BOOKING_PASSWORD, permissions: {
        # booking also CONSUMES payment.completed (JS pull → control plane) to stamp paid_at and
        # un-gate the PRE-PAY en_route transition, so it needs the JS control subjects (already
        # granted for its outbox relay); its DATA publish stays scoped to booking.*. A JS PULL
        # consumer receives over `_INBOX.>` — no data-subject subscribe permission is required.
        publish:   { allow: ["pguard.events.booking.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "payment", password: $NATS_PAYMENT_PASSWORD, permissions: {
        # payment also CONSUMES booking.completed (JS pull → control plane), so it needs
        # the JS control subjects; its DATA publish is still scoped to payment.*.
        publish:   { allow: ["pguard.events.payment.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "rating", password: $NATS_RATING_PASSWORD, permissions: {
        publish:   { allow: ["pguard.events.rating.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "calling", password: $NATS_CALLING_PASSWORD, permissions: {
        publish:   { allow: ["pguard.events.calling.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "chat", password: $NATS_CHAT_PASSWORD, permissions: {
        publish:   { allow: ["pguard.events.chat.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "profile", password: $NATS_PROFILE_PASSWORD, permissions: {
        # profile is the producer of `user.approved` (the approval→login loop).
        publish:   { allow: ["pguard.events.user.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    # ── Consumer-only services: NO data publish (can't forge any event) ──────────
    { user: "identity", password: $NATS_IDENTITY_PASSWORD, permissions: {
        # identity is a CONSUMER (durable user.approved + user.compromised). In production it
        # publishes NO NATS subject: refresh-token-reuse → DB `revoke_family`, force-revoke-all
        # → a Redis trv marker (neither is NATS). So it gets the consumer-only grant — a
        # compromised identity cannot forge a `user.approved` (login bypass) or `user.compromised`
        # (mass-revoke). If a real NATS `user.compromised` producer is ever added to identity,
        # widen this to `pguard.events.user.>` then (and add it back to nats-acl.md).
        publish:   { allow: ["$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "notification", password: $NATS_NOTIFICATION_PASSWORD, permissions: {
        # Durable consumer over `pguard.events.>` — JS control only, never publishes data.
        publish:   { allow: ["$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }
    { user: "presence", password: $NATS_PRESENCE_PASSWORD, permissions: {
        # Durable consumer over `pguard.events.booking.>` (guard-assignment read-model).
        # GPS fan-out is Redis, not NATS — so presence publishes NO NATS subject.
        publish:   { allow: ["$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] } } }

    # ── api-gateway: CORE subscribe to booking subjects (status WS); publishes nothing ──
    { user: "gateway", password: $NATS_GATEWAY_PASSWORD, permissions: {
        publish:   { allow: [] }
        subscribe: { allow: ["pguard.events.booking.>", "_INBOX.>"] } } }

    # ── monitoring: nats-surveyor / prometheus-nats-exporter (read-only system) ──
    { user: "monitoring", password: $NATS_MONITORING_PASSWORD, permissions: {
        publish:   { allow: ["$SYS.REQ.>", "$JS.API.INFO"] }
        subscribe: { allow: ["_INBOX.>", "$SYS.>"] } } }
  ]
}
