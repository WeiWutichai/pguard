# e2e-only overrides on docker-compose.prod.yml. Apply with:
#   docker compose --env-file infra/.env.e2e \
#     -f infra/docker/docker-compose.prod.yml -f infra/docker/docker-compose.e2e.yml <cmd>
#
# e2e accommodations of documented limitations (NOT changes to prod behaviour):
#   1. otp SMS disabled (NoopSender) so the flow is deterministic without real SMS.
#   2. rating published on a DIRECT host port :3007 — NOT a web-admin bypass (the gateway routes
#      rating since PR #25; the web-admin + e2e now go through it). It's published for the CONTRACT
#      suite, which hits rating directly on :3007 (RATING_DIRECT in tests/contract/src/http.ts) to
#      verify the SERVICE's own auth/role enforcement + response shapes for the admin/assignment
#      endpoints. (presence no longer needs a host port — the old web-admin map bypass via
#      PGUARD_PRESENCE_URL was removed once the gateway routed /v1/locations.)
services:
  otp:
    environment:
      SMS_DISABLED: "1"
  rating:
    ports:
      - "3007:3007"
