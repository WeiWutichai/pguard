# =============================================================================
# pguard v2 — nginx STAGING edge (TLS termination + the single public ingress)
#
# Used by infra/docker/docker-compose.staging.yml (mounted at /etc/nginx/nginx.conf).
# This is the ONLY host-published HTTP/S surface; every backend stays cluster-internal.
#
# Topology (v2 differs from v1 — there IS a dedicated api-gateway service now):
#   browser / mobile ──TLS──> nginx ─┬─ /v1/*  (REST + booking-status WS) ─> api-gateway:3000
#                                     └─ /      (everything else, the SPA)  ─> web-admin:3000
#   The api-gateway is the app SECURITY EDGE: it does JWT/jti/trv validation, CSRF,
#   per-IP rate limiting, identity-header injection and `/v1` stripping, then routes
#   to the per-service upstreams. nginx therefore does NOT fan out to individual
#   backends (chat/presence/calling/rating) the way v1's nginx did — it hands ALL
#   `/v1/*` to the gateway, which owns routing. As the gateway grows routes (e.g.
#   calling/TURN), staging picks them up automatically with no change here.
#
# What nginx adds on top of the gateway (mirrors v1 nginx.prod.conf hardening):
#   - TLS 1.2/1.3 termination with the certbot-issued cert + HTTP→HTTPS redirect
#   - Let's Encrypt ACME http-01 webroot for zero-downtime renewals
#   - Security response headers (HSTS etc.) on the TLS edge
#   - A COARSE per-IP rate-limit layer (auth/otp tighter) — defense in depth in
#     FRONT of the gateway's own fine-grained limiter
#   - WebSocket `Upgrade`/`Connection` plumbing + long-lived timeouts
#
# Mounted from the host (see docker-compose.staging.yml + STAGING-SETUP.md):
#   /etc/letsencrypt   -> /etc/letsencrypt   (ro)  certbot live/archive
#   /var/www/certbot   -> /var/www/certbot   (ro)  ACME webroot
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Don't advertise the nginx version (banner-grab hardening).
    server_tokens off;

    # Body-size ceiling. The api-gateway buffers request bodies with a HARD 1 MiB cap
    # (proxy::MAX_BODY_BYTES → clean JSON 413). We allow a little more here so an
    # oversized upload reaches the gateway and gets that clean error instead of nginx's
    # blunt 413. NOTE: large document/image uploads (>1 MiB) through `/v1` will still be
    # rejected by the gateway until it supports streaming — a backend follow-up.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    # ── Rate-limit zones (coarse, per source IP) — mirror v1's zones ──────────
    # The gateway runs its OWN per-IP limiter (Redis fixed-window, tiered); these are a
    # cheap outer layer so a flood is shed at the edge before it reaches the gateway.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m   rate=5r/s;
    # OTP is SMS-cost sensitive — tightest. ~10/min/IP (burst gives a few immediate).
    limit_req_zone $binary_remote_addr zone=otp_limit:10m  rate=10r/m;

    # WebSocket upgrade plumbing: Connection: upgrade only when the client asked for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams (cluster DNS — service name = hostname on the pguard-prod net) ─
    # depends_on in the compose ensures both are started before nginx, so these names
    # resolve at config load. After a redeploy that RECREATES a backend (new IP),
    # recreate nginx too so it re-resolves — the runbook's redeploy step does this.
    upstream api_gateway {
        server api-gateway:3000;
        keepalive 32;
    }
    upstream web_admin {
        server web-admin:3000;
        keepalive 16;
    }

    # =========================================================================
    # Default servers — reject unknown-Host / direct-IP probes (don't proxy them to
    # the app). Any request whose SNI/Host isn't pguard.innoveraappcenter.com lands
    # here instead of falling through to the real vhost.
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;                      # drop the connection, no response
    }
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        # Reject the TLS handshake for non-matching SNI — no cert needed (nginx ≥1.19.4).
        ssl_reject_handshake on;
    }

    # =========================================================================
    # HTTP :80 — ACME challenge + redirect everything else to HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name pguard.innoveraappcenter.com;

        # nginx-local liveness over plain HTTP — the compose healthcheck hits this with
        # an explicit Host header (the :80 catch-all default_server returns 444, and the
        # :443 copy of /health is unreachable from a plain-HTTP wget).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Let's Encrypt http-01 (certbot --webroot renewals serve from here).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS :443 — all real traffic
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name pguard.innoveraappcenter.com;

        # --- TLS (certbot-issued; see STAGING-SETUP.md) ---
        ssl_certificate     /etc/letsencrypt/live/pguard.innoveraappcenter.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pguard.innoveraappcenter.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # AES-GCM + ChaCha20 (battery-friendly on phones without AES-NI). No CBC/RSA-kx.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Security headers (TLS edge owns these) ---
        # nginx terminates TLS, so HSTS belongs here. These also cover the web-admin
        # (which does NOT pass through the gateway). To avoid DUPLICATES on `/v1`
        # responses (the gateway stamps its own copy), `proxy_hide_header` below strips
        # the gateway's versions of these six so the client sees exactly one. The
        # gateway's Content-Security-Policy is INTENTIONALLY left intact for `/v1`
        # (a strict `default-src 'none'` tuned for the JSON API); the web-admin's CSP
        # is the app's responsibility (a too-strict CSP here would break the SPA).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0" always;
        add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(self)" always;

        # Drop the gateway's duplicate copies of the six headers above on proxied
        # responses (inherited by every location that doesn't set its own). The
        # gateway's CSP is NOT hidden (kept for `/v1`).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Permissions-Policy;

        # nginx-local liveness (the compose healthcheck hits this) — never proxied.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ACME http-01 also reachable over HTTPS (harmless; webroot renewals use :80).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # --- gateway's own readiness probe (for uptime monitors) ---
        location = /healthz {
            access_log off;
            proxy_pass http://api_gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # API — everything under /v1 goes to the gateway (it owns routing + auth).
        # Longest-prefix wins, so /v1/otp/ and /v1/auth/ (tighter zones) and
        # /v1/ws/ (WebSocket) take priority over the generic /v1/ block.
        #
        # X-Forwarded-For is set to $remote_addr (OVERWRITE, not append): the gateway
        # trusts the LEFT-MOST XFF hop as the client IP for its rate limiter, so a
        # client-supplied XFF must NOT be forwarded (it would spoof the limit key).
        # nginx is the first trusted hop, so $remote_addr is the real client.
        # =====================================================================

        # ── Upload carve-out (matches the gateway's BodyCap::Large, 12 MiB) ──────
        # Two multipart upload routes need a larger body than the default 2m server cap:
        #   - POST /v1/attachments                       (chat image attachment)
        #   - POST /v1/bookings/{id}/progress-reports    (guard check-in photo)
        # The gateway raises ITS per-route buffer to 12 MiB for exactly these (proxy.rs +
        # domain::routing::body_cap_for); nginx must let the body through to reach it.
        #
        # nginx location precedence: `=` (exact) and `~` (regex) are evaluated BEFORE the
        # prefix `location /v1/` below, so these win for their paths without disturbing it.
        # A new location does NOT inherit proxy_*/limit_req from a sibling — the full set is
        # repeated here (only client_max_body_size differs from the /v1/ block). add_header +
        # proxy_hide_header still inherit from the server block (no add_header here).
        #
        # The chat/booking services re-validate every upload (size + magic bytes + IDOR), so
        # the larger nginx+gateway cap bypasses no backend check. Large video uploads (>12 MiB)
        # remain out of scope through the edge.
        location = /v1/attachments {
            limit_req zone=api_limit burst=50 nodelay;
            client_max_body_size 12m;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ ^/v1/bookings/[^/]+/progress-reports$ {
            limit_req zone=api_limit burst=50 nodelay;
            client_max_body_size 12m;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OTP — strictest (SMS cost). burst lets a real user retry a resend.
        location /v1/otp/ {
            limit_req zone=otp_limit burst=5 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth (login/refresh/logout/me, register, data-export) — brute-force sensitive.
        location /v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket — /v1/ws/* (today: booking-status, terminated at the gateway;
        # other WS routes activate as the gateway adds them). Preserve Upgrade +
        # the Origin header (the gateway checks it against CORS_ALLOWED_ORIGINS for
        # cross-site-WS-hijack protection) + the Authorization/Cookie (Bearer/cookie
        # on upgrade). Long timeouts keep the socket alive.
        location /v1/ws/ {
            limit_req zone=ws_limit burst=10 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else under /v1 — general API tier.
        location /v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # Web-admin SPA (Next.js standalone) — everything not matched above.
        # The browser's same-origin `/v1` API calls are handled by the blocks above
        # (so the auth cookie stays first-party); this serves the app shell + assets.
        # =====================================================================
        location / {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://web_admin;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
