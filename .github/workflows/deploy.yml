name: Deploy

# Build + push every production image to ghcr.io on push to main. 13 images:
# the 11 Rust services (shared parameterized Dockerfile, repo-root context) + the
# mediasoup SFU (its own context) + the Next.js web-admin. The deploy step itself
# is intentionally disabled (manual ops) — this proves the image build+push matrix.

on:
  push:
    branches: [main]

# Serialize main deploys; never cancel an in-flight image push.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

# Default-deny floor for the GITHUB_TOKEN; the build-and-push job widens to `packages: write`.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build & push each service image to ghcr.io/<owner>/pguard/<svc>:{latest,<sha>}.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Surface every service's real build error in one run instead of one-at-a-time.
      fail-fast: false
      matrix:
        include:
          # 11 Rust services — repo-root context + the shared parameterized
          # `rust-service.Dockerfile`; BIN + APP_PORT match docker-compose.prod.yml.
          - { service: api-gateway, context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-api-gateway, port: "3000" }
          - { service: identity,    context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-identity,    port: "3001" }
          - { service: profile,     context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-profile,     port: "3002" }
          - { service: otp,         context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-otp,         port: "3003" }
          - { service: notification, context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-notification, port: "3004" }
          - { service: booking,     context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-booking,     port: "3005" }
          - { service: payment,     context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-payment,     port: "3006" }
          - { service: rating,      context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-rating,      port: "3007" }
          - { service: calling,     context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-calling,     port: "3008" }
          - { service: presence,    context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-presence,    port: "3009" }
          - { service: chat,        context: ., dockerfile: infra/docker/rust-service.Dockerfile, bin: pguard-chat,        port: "3010" }
          # mediasoup (Node SFU) — its own context (matches docker-compose.prod.yml).
          - { service: mediasoup, context: services/mediasoup, dockerfile: services/mediasoup/Dockerfile }
          # web-admin (Next.js 16) — repo-root context, its own Dockerfile.
          - { service: web-admin, context: ., dockerfile: infra/docker/web-admin.Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        # ghcr rejects an uppercase repository path; `github.repository` keeps the
        # owner's casing (e.g. "WeiWutichai/pguard"), which `docker buildx push`
        # rejects with "repository name must be lowercase". Downcase once here.
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # BIN/APP_PORT only for the Rust services (empty lines are ignored for the rest).
          build-args: |
            ${{ matrix.bin && format('BIN={0}', matrix.bin) || '' }}
            ${{ matrix.port && format('APP_PORT={0}', matrix.port) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to staging — INTENTIONALLY DISABLED (`if: false`). Build & Push above
  # keeps ghcr.io fresh; operators run `docker compose -f docker-compose.prod.yml
  # pull && up -d` on the host by hand. No real hosts/secrets are wired in this slice.
  #
  # To enable an automated staging deploy (mirroring v1 `../guard-dispatch`), flip the
  # `if:` to a branch guard and add the documented steps below — DON'T commit real
  # hosts/secrets here:
  #   - tailscale/github-action@v4   (join the tailnet to reach the private VPS)
  #   - appleboy/ssh-action@v1       (SSH to ${{ secrets.STG_HOST }} as ${{ secrets.STG_USER }})
  #       script: cd <host path> && export REGISTRY/IMAGE_PREFIX/IMAGE_TAG=<sha> &&
  #               docker compose -f docker-compose.prod.yml pull && up -d --remove-orphans
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to staging (manual — disabled)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: false
    steps:
      - name: Manual deploy placeholder
        run: |
          echo "Automated deploy is intentionally disabled in this slice."
          echo "Images are published to ghcr.io/<owner>/pguard/<svc>; deploy by hand on the host."
