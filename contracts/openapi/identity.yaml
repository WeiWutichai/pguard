openapi: 3.1.0
info:
  title: pguard — Identity Service API
  version: 0.1.0
  description: |
    The auth foundation (source of truth for this service — codegen produces the Rust
    handler stubs/types, the Dart client, and the TS client). Identity ISSUES + manages
    the user access JWTs that every other pguard service validates.

    Ported from the v1 `../guard-dispatch/services/auth` god-service, split out and
    hardened for v2:
      1. **Refresh-token rotation + reuse detection (RFC 6749 §6).** Each refresh is a
         single-use opaque token in a `family`; presenting an already-rotated token is
         treated as theft and revokes the whole family.
      2. **Force-revoke-all.** A per-user `token_revocation_version` (plus the Redis jti
         blocklist) lets incident response invalidate every outstanding access token at
         once. Exposed as a service-JWT'd internal endpoint AND driven by the
         `pguard.events.user.compromised` NATS event.
      3. **Generic 401 on login failure** — no user-enumeration; the password verify runs
         even for unknown identifiers (constant-time path).

    Client-facing paths are served behind the gateway under the `/v1` prefix (CLAUDE.md
    "API versioning"). Success responses use the standard `{ success, data }` envelope;
    errors use `ErrorBody`. On login/refresh the token pair is ALSO set as httpOnly,
    Secure, SameSite=Lax cookies (`access_token`, `refresh_token`) for the web admin.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3001
    description: Local dev (identity-service direct)

tags:
  - name: Auth
    description: Login, token refresh, logout, current user, self-profile + password
  - name: Admin
    description: Admin-only endpoints (role-gated; routed at the gateway)
  - name: Internal
    description: Service-to-service endpoints (service-JWT only; not exposed publicly)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account from a verified phone + chosen role (returns 202, NO tokens)
      description: |
        Completes OTP registration. The caller passes the single-use `phone_verified_token`
        issued by `POST /otp/verify` (the phone is taken from that token, never the body), the
        chosen `role` (`guard` or `customer` — `admin` is rejected), and `pin_hash` (the
        client-side SHA-256 hex of the user's PIN, which identity Argon2's as the password).

        The `phone_verified_token` is consumed **single-use** (Redis `GETDEL`); a reused,
        expired, or forged token is rejected. The account is UPSERTed in the non-loginable
        `pending` state: re-registering a still-`pending` phone is allowed (refreshes the
        credentials/role), but a phone that already exists in a non-pending state → `409`.

        **Returns `202 Accepted` with NO access/refresh tokens and NO session** — a pending
        account cannot authenticate. `POST /auth/login` succeeds only once the account is
        `approved`: guards via admin vetting (`/admin/guard-profiles/{id}/approve`), customers
        **automatically on first profile submission** (`POST /profile/customer` emits `user.approved`).
        Either way the flip is event-driven — identity never lets profile write its schema.
        The response carries a single-use, purpose-scoped `profile_token` the client
        immediately exchanges at `POST /profile/{guard,customer}` to submit its profile.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: |
            Account created in the `pending` state. Carries `{ user_id, profile_token }` and
            deliberately NO access/refresh tokens or auth cookies (login is blocked until
            approval).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RegisterResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with phone/email + password; issue an access + refresh token
      description: |
        Looks up the user by `identifier` (phone OR email), verifies the password with
        Argon2 (constant-time, anti-enumeration), then issues an access JWT + a rotating
        refresh token (new family). Tokens are returned in the body AND set as cookies.
        Any failure returns a generic 401 — the response never reveals whether the
        account exists.

        **2FA (#144):** if the account has TOTP enabled, the password is NOT enough — the `200`
        body instead carries a `TwoFactorChallenge` (`{ two_factor_required: true, challenge_token }`)
        with NO tokens/cookies. The client completes login at `POST /auth/2fa/verify` with a code.
        Accounts WITHOUT 2FA are unaffected (the `data` is the usual token pair).

        **Multi-role (Option A):** the no-2FA `data` is a `LoginTokenPair` — the usual `TokenPair`
        fields PLUS `available_roles` (the account's approved roles). BACKWARD COMPATIBLE: a
        single-role user gets `available_roles: [their_role]` and the access token is minted with
        their registration/primary role exactly as before. When `available_roles` has >1 entry the
        app can show a role picker and call `POST /auth/switch-role`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: |
            Either the issued token pair + available_roles (no 2FA) OR a 2FA challenge
            (`two_factor_required: true`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/LoginTokenPair'
                          - $ref: '#/components/schemas/TwoFactorChallenge'
          headers:
            Set-Cookie:
              description: |
                On the no-2FA path, httpOnly Secure SameSite=Lax `access_token` + `refresh_token`
                cookies (absent on the 2FA-challenge path).
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token (RFC 6749 §6) — issue a new access + refresh pair
      description: |
        Validates the presented refresh token (from the body or the `refresh_token`
        cookie). On success it rotates: the presented token is revoked and a new
        access+refresh pair is issued in the SAME family. **Reuse detection:** presenting
        a token that was already rotated revokes the entire family and returns 401.
        Expired or unknown tokens also return a generic 401.
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/TokenPairOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out — blocklist the access jti and revoke the refresh family
      description: |
        Adds the presented access-token `jti` to the Redis revocation blocklist (TTL =
        remaining token lifetime) and revokes the refresh family of the supplied refresh
        token (body or cookie). Clears the auth cookies.
      operationId: logout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/revoke-all:
    post:
      tags: [Auth]
      summary: Sign out everywhere — revoke ALL of the caller's own sessions
      description: |
        Self-serve force-revoke-all: bumps the caller's `token_revocation_version` and revokes
        every refresh family, so all other devices' tokens are rejected at once, then clears
        this browser's auth cookies. The account stays active (re-auth required) — unlike
        `DELETE /auth/me` which also soft-deletes + redacts.
      operationId: revokeAllSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/switch-role:
    post:
      tags: [Auth]
      summary: Switch the caller's ACTIVE role (multi-role, Option A)
      description: |
        Mints a NEW access + refresh token pair whose active role is `role`. THE security gate:
        `role` MUST be in the caller's APPROVED roles (`user_roles` — the set surfaced by
        `GET /auth/me` `roles` and login's `available_roles`). A role the caller is NOT enrolled
        in → `409` with code `ROLE_NOT_ENROLLED` and NO token is minted (no privilege escalation —
        a customer cannot mint a guard token unless they hold an approved guard profile). An
        unknown role → `400`; `admin` → `403` (never self-assignable). On success the tokens are
        returned in the body AND set as cookies (a fresh refresh family, like login).
      operationId: switchRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchRoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/TokenPairOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RoleNotEnrolled' }

  /auth/roles:
    post:
      tags: [Auth]
      summary: Enroll the logged-in user in a NEW role (multi-role, Option A)
      description: |
        Starts enrollment of a role the caller does NOT yet hold (e.g. a customer adding a guard
        role). Returns a single-use `profile_token` scoped to `(this user_id, role)` — the SAME
        shape register issues — so the app submits that role's profile form at
        `POST /profile/{guard,customer}`, creating a PENDING second profile for the SAME account.
        The role enters the switchable set (`user_roles`) ONLY on admin approval; this endpoint
        does NOT grant the role. `409` with code `ROLE_ALREADY_ENROLLED` if the caller already
        holds the role; unknown role → `400`; `admin` → `403`.
      operationId: enrollRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRoleRequest' }
      responses:
        '202':
          description: |
            Enrollment started — a single-use `profile_token` for the new role's profile
            submission. NO access/refresh token; the role is not granted until approved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RegisterResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RoleAlreadyEnrolled' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The authenticated user's id + role + display_name + email
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      summary: Update the caller's OWN display_name + email (#144 admin self-profile)
      description: |
        Self-edit of `display_name` (trimmed, 1–120 chars) + optional `email` (lowercased +
        shape-checked, UNIQUE). Self only — keyed by the authenticated user; phone/role/password
        are NEVER changed here (password has its own `PUT /auth/password`). An email already used
        by another account → `409` with code `EMAIL_TAKEN`. Returns the refreshed self-profile.
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated self-profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/EmailTaken' }
    delete:
      tags: [Auth]
      summary: Erase the authenticated user's account (PDPA §33 right to erasure)
      description: |
        Soft-deletes the caller's OWN account in one transaction: redacts PII (phone → an
        opaque per-user placeholder, email → null), deactivates it (blocks re-login),
        retains a minimal deletion audit (`deleted_at`), force-revokes every token (refresh
        families + a `token_revocation_version` bump so outstanding access tokens are
        rejected at once), and clears the auth cookies. Irreversible.
      operationId: deleteMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account erased
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    put:
      tags: [Auth]
      summary: Change the caller's OWN password (#144)
      description: |
        Verifies `current_password` against the stored Argon2 hash (a wrong value → a GENERIC 401,
        no enumeration), then Argon2-stores `new_pin_hash` and force-revokes the user's OTHER
        sessions (refresh families revoked + `token_revocation_version` bumped, so every other
        device is rejected at once) and clears THIS browser's auth cookies so the current session
        re-authenticates with the new PIN. Self only.
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed; other sessions revoked + this browser's cookies cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          password_changed: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/reset-pin:
    post:
      tags: [Auth]
      summary: Reset a FORGOTTEN PIN via the OTP flow (edge-public)
      description: |
        Authorized ENTIRELY by a single-use `phone_verified_token` from the OTP flow run
        with `purpose: "pin_reset"` (bound at `POST /otp/request`, minted at
        `POST /otp/verify`) — the phone comes from that token, NEVER the body, so a
        caller can only reset the PIN of a phone they just proved they own. A
        registration-purpose (`phone_verify`) token is REJECTED (purpose isolation on
        top of single-use). No current PIN is required (it was forgotten).
        On success the new Argon2 hash is stored, EVERY session is force-revoked
        (`token_revocation_version` bumped + all refresh families revoked), and the reset
        is recorded in `identity.credential_audit`. Edge-public: no bearer token — the
        purpose token in the body is the sole credential.
      operationId: resetPin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPinRequest' }
      responses:
        '200':
          description: PIN reset; every existing session revoked — log in with the new PIN
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pin_reset: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Begin TOTP 2FA enrollment (provision — NOT yet enabled, #144)
      description: |
        Generates a fresh TOTP secret for the CALLER, seals it at rest (AES-256-GCM under the
        service-held `TOTP_ENC_KEY`), and returns the `otpauth://` provisioning URI (render as a QR)
        plus the base32 `secret` (manual-entry fallback). **2FA is NOT enabled yet** — the client
        must scan the QR and then call `POST /auth/2fa/enable` with a live code. Calling setup again
        before enabling simply re-provisions. `409` if 2FA is already enabled (disable first).
      operationId: setup2fa
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provisioning URI + base32 secret (2FA still off)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Setup2faResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable TOTP 2FA after verifying a live code (#144)
      description: |
        Verifies the 6-digit `code` from the authenticator against the provisioning secret from
        `/auth/2fa/setup`, then turns 2FA ON and returns one-time **recovery codes** shown EXACTLY
        ONCE (store them — they are not retrievable again). A wrong code → `401` (nothing changes);
        no provisioning in progress → `409`.
      operationId: enable2fa
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Enable2faRequest' }
      responses:
        '200':
          description: 2FA enabled; one-time recovery codes (shown once)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Enable2faResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable TOTP 2FA (confirm with a code or password, #144)
      description: |
        Turns 2FA OFF for the CALLER after confirming intent via EITHER a live TOTP `code` OR the
        account `password` (SHA-256 hex, same shape as login). Clears the secret + recovery codes.
        A wrong code/password → `401`; neither supplied → `400`. Disabling an already-off account is
        a harmless no-op (`200`).
      operationId: disable2fa
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Disable2faRequest' }
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          two_factor_enabled: { type: boolean, example: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Complete a 2FA login (second step) — issues the token pair (#144)
      description: |
        The second login step. When `POST /auth/login` finds 2FA enabled it returns a single-use
        `challenge_token` (NOT a token pair). The client posts that token here together with EITHER a
        TOTP `code` OR a one-time `recovery_code`; on success identity issues the access + refresh
        token pair (also set as cookies), exactly like a normal login. The challenge is single-use
        (replays rejected); a recovery code is single-use (consumed). **Edge-public** (carries the
        challenge token, not an access token). Invalid/expired challenge or wrong code → `401`.
      operationId: verify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Verify2faRequest' }
      responses:
        '200':
          description: Tokens issued (same shape + cookies as login)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
          headers:
            Set-Cookie:
              description: httpOnly Secure SameSite=Lax `access_token` + `refresh_token` cookies.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List the caller's active sessions (per-device, #144)
      description: |
        Lists the caller's ACTIVE refresh families as a device list: `{ family_id, user_agent, ip
        (masked), created_at, last_used_at, current }`. `current` marks the session whose refresh
        token is presented (cookie or `X-Refresh-Token`). `ip` is masked to its first two octets/
        hextets. A family is "active" if it still has a non-revoked, unexpired token.
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's active sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{family_id}:
    delete:
      tags: [Auth]
      summary: Revoke ONE of the caller's sessions (sign out a single device, #144)
      description: |
        Revokes a single refresh family that belongs to the CALLER (sign out one device). Ownership-
        scoped — a family that isn't the caller's → `404` (IDOR-safe). The "sign out everywhere"
        endpoint (`POST /auth/revoke-all`) is separate. The revoked device's refresh token can no
        longer rotate; its access token expires naturally (≤15 min).
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: family_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/api-tokens:
    post:
      tags: [Admin]
      summary: Create an admin API token — full token returned ONCE (role=admin, #144)
      description: |
        Creates a long-lived admin API token for the CALLER. **Admin only** (else `403`). Returns the
        FULL token `pguard_<prefix>_<secret>` **exactly once** — only the SHA-256 hash of the secret
        is stored, so it can never be shown again. The token authenticates as the creator's role
        (admin) and is usable as a `Bearer` for admin API calls (the gateway validates it via
        identity's internal verify endpoint and injects the trusted user). Revoke via DELETE.
      operationId: createApiToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiTokenRequest' }
      responses:
        '200':
          description: The created token (full secret shown once)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateApiTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Admin]
      summary: List the caller's admin API tokens (NEVER the secret, role=admin, #144)
      description: |
        Lists the CALLER'S admin API tokens — `{ id, name, prefix, role, created_at, last_used_at,
        revoked }`. **Admin only**. The secret is NEVER returned (only the public prefix). A revoked
        token is still listed (audit) but cannot authenticate.
      operationId: listApiTokens
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's API tokens (no secrets)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ApiTokenView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/api-tokens/{id}:
    delete:
      tags: [Admin]
      summary: Revoke one of the caller's admin API tokens (role=admin, #144)
      description: |
        Soft-revokes ONE of the caller's OWN admin API tokens by id. **Admin only** + ownership-scoped
        (a token that isn't theirs → `404`, IDOR-safe). The row is kept for audit; a revoked token
        fails verification immediately.
      operationId: revokeApiToken
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/search:
    get:
      tags: [Admin]
      summary: Search users by name / phone / email / id (role=admin, #138 per-user notify)
      description: |
        Finds users across ALL roles for the admin per-user-notify picker. Matches `q`
        case-insensitively against `display_name` / `phone` / `email`, plus an exact id match when
        `q` is a UUID. **Admin only** (non-admin → 403). Returns `[{ id, role, display_name,
        phone_masked }]` — the phone is MASKED (last-4) and NO other PII crosses the wire. `limit`
        is clamped (default 20, max 50). A blank `q` returns an empty list (no full-table dump).

        Routed at the gateway to **identity** (it knows every role + the admin display name) — a
        more-specific rule than `/admin/users/resolve` → profile.
      operationId: adminSearchUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Free-text query (name / phone / email / exact id).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching users (phone masked)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserSearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/data-export:
    get:
      tags: [Auth]
      summary: Export the authenticated user's data (PDPA §19 access / §32 portability)
      description: |
        Aggregates the caller's data from every owning service (identity fields + profile +
        bookings + payments + reviews) into one machine-readable JSON envelope. identity owns
        no business data — it fans out over service-JWT to each owner's internal export.
        **Best-effort:** a downstream that's unavailable is reported as `"error"` in
        `_meta.sections` rather than failing the whole export, so the user still receives what
        is retrievable. `chat` + GPS `location_history` are follow-up sections.
      operationId: dataExport
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The aggregated, machine-readable export
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: |
                          `{ user, profile, bookings, payments, reviews, _meta }` where
                          `_meta = { generated_at, sections: { <section>: "ok" | "error" } }`.
                        properties:
                          user: { type: object }
                          profile: { type: object, nullable: true }
                          bookings: { type: array, items: { type: object } }
                          payments: { type: array, items: { type: object } }
                          reviews: { type: array, items: { type: object } }
                          _meta:
                            type: object
                            properties:
                              generated_at: { type: string, format: date-time }
                              sections:
                                type: object
                                additionalProperties: { type: string, enum: [ok, error] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/users/{id}/revoke-all:
    post:
      tags: [Internal]
      summary: Force-revoke all of a user's tokens (service-JWT only)
      description: |
        Bumps the user's `token_revocation_version` and revokes every outstanding refresh
        family — instantly invalidating all access + refresh tokens for incident response.
        **v2:** requires a service-JWT (`serviceAuth`, audience `pguard-internal`). Also
        triggered asynchronously by the `pguard.events.user.compromised` NATS event. Not
        routed through the public gateway.
      operationId: internalRevokeAll
      security: [{ serviceAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/users/names:
    post:
      tags: [Internal]
      summary: Batch-resolve user_ids to { role, display_name } (service-JWT only)
      description: |
        Resolve a batch of `user_id`s to `{ role, display_name }` for an internal caller. This is
        identity's OWN schema, so it answers EVERY role — including ADMINS, who have no profile row
        (the gap that left admin names blank on the web admin lists / Activity Log #142). The
        profile service's `POST /admin/users/resolve` resolves guard/customer locally, then calls
        this for the still-unresolved ids and merges admin names in.

        **Requires a service-JWT** (`serviceAuth`, audience `pguard-internal`); blocked at the
        public gateway (`/internal/`). Returns a MAP keyed by id; unknown/deleted ids are OMITTED.
        ONLY `role` + `display_name` — NEVER phone/email. Bounded to 500 ids (a larger batch → 400).
      operationId: internalResolveUserNames
      security: [{ serviceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveUsersRequest' }
      responses:
        '200':
          description: |
            Map keyed by id → `{ role, display_name }`. Ids with no live row are omitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { $ref: '#/components/schemas/ResolvedUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token, audience `pguard-internal`, signed with SERVICE_JWT_SECRET.

  responses:
    TokenPairOk:
      description: |
        Issued tokens. Also delivered as `Set-Cookie: access_token=...; HttpOnly; Secure;
        SameSite=Lax` and `refresh_token=...` (the refresh cookie is scoped to `/auth`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
    EmptyOk:
      description: Success (no payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { type: 'null' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BadRequest:
      description: Malformed request (bad role/pin shape, or an invalid/expired/used token)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: The action is not permitted (e.g. self-assigning the admin role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: The phone is already registered in a non-pending state — log in instead
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    EmailTaken:
      description: |
        The submitted email is already in use by another account (`PUT /auth/me`). Same 409
        envelope as `Conflict`; the `error.code` is `EMAIL_TAKEN` so the client can branch on it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    RoleNotEnrolled:
      description: |
        `POST /auth/switch-role`: the requested role is valid but the caller is NOT enrolled in it
        (it is not in their `user_roles`). NO token is minted (no privilege escalation). Same 409
        envelope as `Conflict`; the `error.code` is `ROLE_NOT_ENROLLED` so the client can offer to
        register the role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    RoleAlreadyEnrolled:
      description: |
        `POST /auth/roles`: the caller already holds the requested role (it is in their
        `user_roles`). Same 409 envelope as `Conflict`; the `error.code` is `ROLE_ALREADY_ENROLLED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    UserRole:
      type: string
      enum: [admin, customer, guard]

    RegisterRequest:
      type: object
      required: [phone_verified_token, role, pin_hash]
      properties:
        phone_verified_token:
          type: string
          description: |
            The single-use phone-verified JWT from `POST /otp/verify`. The phone is read from
            this token (not the body) and the token is consumed (single-use).
        role:
          type: string
          enum: [guard, customer]
          description: Chosen at registration. `admin` is rejected (403 — no self-assignment).
        pin_hash:
          type: string
          description: Client-side SHA-256 hex of the user's PIN (64 hex chars); Argon2'd server-side.

    RegisterResult:
      type: object
      required: [user_id, profile_token]
      properties:
        user_id: { type: string, format: uuid }
        profile_token:
          type: string
          description: |
            Single-use, purpose-scoped JWT (`guard_profile` / `customer_profile`) the client
            exchanges at `POST /profile/{guard,customer}`. NOT an access token.

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Phone number or email address.
        password:
          type: string
          description: |
            For PIN-based mobile login, the SHA-256 hex of the PIN (the same value hashed at
            register). Login succeeds only for an `approved`, active account — a `pending`
            (just-registered) or rejected account returns the same generic 401 as a bad
            password (no enumeration of approval state).

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: |
            The opaque refresh token (`{rotation_id}.{secret}`). May be omitted if the
            `refresh_token` cookie is present.

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: { type: string, description: Short-lived access JWT (HS256). }
        refresh_token: { type: string, description: Single-use rotating refresh token. }
        expires_in: { type: integer, format: int64, description: Access-token lifetime, seconds. }
        token_type: { type: string, enum: [Bearer] }

    LoginTokenPair:
      type: object
      # `available_roles` is OPTIONAL (additive) — the server always sends it, but keeping it out of
      # `required` keeps the field backward-compatible: an old/minimal TokenPair body still validates
      # against the login response, and a single-role client that ignores it is unaffected.
      required: [access_token, refresh_token, expires_in, token_type]
      description: |
        The `data` of a successful no-2FA login (multi-role, Option A): the usual `TokenPair`
        fields PLUS `available_roles`. BACKWARD COMPATIBLE — a single-role user sees every
        `TokenPair` field unchanged plus `available_roles: [their_role]`; the access token is
        minted with the registration/primary role exactly as before.
      properties:
        access_token: { type: string, description: Short-lived access JWT (HS256). }
        refresh_token: { type: string, description: Single-use rotating refresh token. }
        expires_in: { type: integer, format: int64, description: Access-token lifetime, seconds. }
        token_type: { type: string, enum: [Bearer] }
        available_roles:
          type: array
          description: |
            The account's APPROVED roles (`user_roles`). `[role]` for a single-role user; both
            for a dual-role user (the app can then offer `POST /auth/switch-role`).
          items: { $ref: '#/components/schemas/UserRole' }

    SwitchRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [guard, customer]
          description: |
            The role to switch the active session into. MUST be one the caller is enrolled in
            (in `available_roles` / `GET /auth/me` `roles`) — otherwise `409 ROLE_NOT_ENROLLED`.

    EnrollRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [guard, customer]
          description: |
            The NEW role to enroll (must NOT already be held). Returns a `profile_token` for that
            role's profile submission; the role is granted only after admin approval.

    Me:
      type: object
      required: [user_id, role, roles]
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/UserRole' }
        roles:
          type: array
          description: |
            The SET of APPROVED roles this account holds (multi-role, Option A). For a single-role
            user this is exactly `[role]`; for a dual-role user it carries both so the app can
            offer a role switch (`POST /auth/switch-role`). Always contains the active `role`.
          items: { $ref: '#/components/schemas/UserRole' }
        display_name:
          type: string
          nullable: true
          description: |
            The caller's own display name (#144). `null` when unset — notably an admin who has not
            filled it in yet. Settable via `PUT /auth/me`.
        email:
          type: string
          nullable: true
          description: The caller's own email, or `null` if unset. Settable via `PUT /auth/me`.

    UpdateMeRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          description: New display name (trimmed; 1–120 characters).
        email:
          type: string
          nullable: true
          description: |
            New email — optional (omit / null / "" clears it). Lowercased + shape-checked
            server-side; UNIQUE across users (a collision → 409 `EMAIL_TAKEN`).

    ChangePasswordRequest:
      type: object
      required: [current_password, new_pin_hash]
      properties:
        current_password:
          type: string
          description: |
            SHA-256 hex of the CURRENT PIN (same shape/value as login's `password`). Verified
            server-side; a wrong value → a generic 401 (no enumeration).
        new_pin_hash:
          type: string
          description: SHA-256 hex of the NEW PIN (64 hex chars; same shape as register's `pin_hash`).

    ResetPinRequest:
      type: object
      required: [phone_verified_token, new_pin_hash]
      properties:
        phone_verified_token:
          type: string
          description: |
            Single-use JWT from an OTP run bound to `purpose: "pin_reset"` (set at
            `POST /otp/request`, minted at `POST /otp/verify`). Carries the verified
            phone (the body has NO phone field). A `phone_verify`-purpose
            (registration) token is rejected.
        new_pin_hash:
          type: string
          description: SHA-256 hex of the NEW PIN (64 hex chars; same shape as register's `pin_hash`).

    ResolveUsersRequest:
      type: object
      required: [ids]
      description: |
        Batch of user_ids to resolve to `{ role, display_name }`. Duplicates are de-duplicated
        server-side; an empty list → an empty map. Bounded to 500 ids (a larger batch → 400).
      properties:
        ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }

    ResolvedUser:
      type: object
      required: [role]
      description: |
        One resolved identity for the internal name-resolver — ONLY `{ role, display_name }`
        (least-privilege; NEVER phone/email). `display_name` is `null` when none is set.
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        display_name: { type: string, nullable: true }

    UserSearchResult:
      type: object
      required: [id, role, phone_masked]
      description: |
        One admin user-search hit (#138). `phone_masked` keeps only the last 4 digits; NO other
        PII (email/bank/address) is ever returned.
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/UserRole' }
        display_name: { type: string, nullable: true }
        phone_masked: { type: string, example: '******5678' }

    # ----- 2FA (#144) -----

    Setup2faResponse:
      type: object
      required: [otpauth_uri, secret]
      description: |
        TOTP enrollment material (2FA NOT yet enabled). `otpauth_uri` is the `otpauth://totp/...`
        provisioning URI to render as a QR; `secret` is the base32 manual-entry fallback.
      properties:
        otpauth_uri:
          type: string
          example: otpauth://totp/pguard:0812345678?secret=JBSWY3DPEHPK3PXP&issuer=pguard&digits=6&period=30
        secret: { type: string, example: JBSWY3DPEHPK3PXP }

    Enable2faRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The 6-digit TOTP code from the authenticator app.
          example: '123456'

    Enable2faResponse:
      type: object
      required: [recovery_codes]
      description: One-time recovery codes — shown ONCE, never retrievable again.
      properties:
        recovery_codes:
          type: array
          items: { type: string, example: ABCD-EFGH-IJKL-MNOP }

    Disable2faRequest:
      type: object
      description: |
        Confirm intent with EITHER a live TOTP `code` OR the account `password` (at least one).
      properties:
        code: { type: string, nullable: true, description: A live 6-digit TOTP code. }
        password:
          type: string
          nullable: true
          description: SHA-256 hex of the account PIN (same shape as login's `password`).

    Verify2faRequest:
      type: object
      required: [challenge_token]
      description: |
        Second login step. Carries the single-use `challenge_token` from login plus EITHER a TOTP
        `code` OR a one-time `recovery_code`.
      properties:
        challenge_token: { type: string, description: The challenge token returned by login. }
        code: { type: string, nullable: true, description: A 6-digit TOTP code. }
        recovery_code: { type: string, nullable: true, description: A one-time recovery code. }

    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_token]
      description: |
        Login outcome when 2FA is enabled — NO tokens. The client posts `challenge_token` to
        `POST /auth/2fa/verify` with a code to complete login.
      properties:
        two_factor_required: { type: boolean, enum: [true] }
        challenge_token: { type: string }

    # ----- Admin API tokens (#144) -----

    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Human label for the token, e.g. "CI deploy bot".

    CreateApiTokenResponse:
      type: object
      required: [id, name, prefix, token]
      description: |
        The created token. `token` is the FULL bearer (`pguard_<prefix>_<secret>`) shown EXACTLY
        ONCE — store it now; it is not retrievable later. Only the prefix is listed thereafter.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: ab2cd3 }
        token: { type: string, example: pguard_ab2cd3_v8w9x0secretsecretsecret }

    ApiTokenView:
      type: object
      required: [id, name, prefix, role, created_at, revoked]
      description: One admin API token in the listing — NEVER the secret.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: ab2cd3 }
        role: { $ref: '#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }

    # ----- Per-device sessions (#144) -----

    SessionView:
      type: object
      required: [family_id, created_at, current]
      description: |
        One active session (refresh family). `current` marks the caller's own session. `ip` is
        masked (first two octets/hextets kept).
      properties:
        family_id: { type: string, format: uuid }
        user_agent: { type: string, nullable: true }
        ip: { type: string, nullable: true, example: '203.0.x.x' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        current: { type: boolean }

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: UNAUTHORIZED }
        message: { type: string }
