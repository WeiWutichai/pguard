openapi: 3.1.0
info:
  title: pguard — Calling Service API
  version: 0.1.0
  description: |
    v2 OpenAPI contract for the calling service (source of truth — codegen produces Rust
    handler stubs/types, the Dart client, the TS client). WebRTC voice/video SIGNALING; the
    media plane is the Node mediasoup SFU (brokered by calling over a service-JWT).

    v2 rules baked into the contract:
      1. **Participant-only authz.** A call may only be placed between the two participants of
         an ACTIVE booking — verified via booking's service-JWT'd `/internal/bookings/{id}`.
         The `callee` is DERIVED from the booking (the other participant), never supplied by
         the client (no dialing strangers / IDOR).
      2. **Events (outbox).** State changes emit `pguard.events.calling.{initiated,accepted,
         rejected,ended}` in the SAME tx (transactional outbox); notification consumes them.
      3. **Generic errors.** No enumeration / no internal leak.

    ## WebSocket signaling — `GET /ws/call`
    - **Auth = `Authorization: Bearer <access-token>` on the upgrade request.** A token in the
      URL query is NEVER read → such a request is rejected `401` (no sensitive data in the WS
      URL). This is not expressible in OpenAPI paths, so it is documented here.
    - After open, the client sends JSON frames:
      `{ "type": "signal", "call_id": "<uuid>", "signal": <opaque SDP/ICE> }`.
      The server looks up the call's two participants, verifies the sender is one of them, and
      forwards `{ "type": "signal", "from": "<uuid>", "call_id": "<uuid>", "signal": ... }` to
      the OTHER participant's live socket. Errors come back as
      `{ "type": "error", "message": "<reason>" }`. A non-participant / unknown call is refused.

    Client-facing paths are served behind the gateway under `/v1`. Success responses use the
    standard `{ success, data }` envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3008
    description: Local dev (calling-service direct)

tags:
  - name: Calls
    description: Call control (signaling lifecycle)

paths:
  /calls/initiate:
    post:
      tags: [Calls]
      summary: Start a call to the other participant of a booking
      description: |
        Initiates a call. The handler verifies (via booking's internal read) that the caller
        is the booking's customer or assigned guard and the booking is active; the `callee` is
        DERIVED as the other participant. Inserts an `initiated` call + emits `calling.initiated`.
        409 if the callee is already busy or the booking has no assigned guard / is inactive.
      operationId: initiateCall
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateCallRequest' }
      responses:
        '200': { $ref: '#/components/responses/CallOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/calls:
    get:
      tags: [Admin]
      summary: List ALL calls cross-user (role=admin, read-only call log)
      description: |
        The admin call log — every call (NOT participant-scoped, unlike `GET /calls/{id}`),
        newest first, optional `status`/`call_type` filters + limit/offset. Admin only (else
        403). The per-call lifecycle TIMELINE is served by `GET /admin/calls/{id}/events`. Media
        QUALITY (jitter/loss/bitrate) is NOT persisted — a signaling relay can't observe it; it
        needs SFU/TURN stats (not wired). See that endpoint's description.
      operationId: adminListCalls
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CallStatus' }
        - name: call_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CallType' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: All matching calls, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Call' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/calls/{id}/events:
    get:
      tags: [Admin]
      summary: One call's lifecycle TIMELINE (role=admin, call-events read model)
      description: |
        The ordered per-call timeline — the call record plus its lifecycle events in
        chronological order: milestones (`ringing` → `accepted`/`rejected` → `connected` →
        `ended`/`missed`, each with `occurred_at` + the `actor_id` that drove it) plus the
        signaling steps the relay observes as it forwards frames (`offer`/`answer`/
        `ice_candidate` relayed, `peer_offline` when the peer had no live socket). Admin only
        (else 403); a non-existent call → 404.

        **NOT included (by design):** media QUALITY — jitter, packet loss, bitrate, MOS. A
        signaling relay cannot observe these; they require SFU (mediasoup `getStats`) / TURN
        (coturn) statistics, which are not wired into the calling service. The timeline surfaces
        only what the control + signaling planes actually see. `detail` carries small structured
        metadata about each step (e.g. `end_reason`, the relayed `to`/`delivered`) — never the
        raw SDP/ICE blob.
      operationId: adminCallEvents
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200': { $ref: '#/components/responses/CallTimelineOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /calls/{id}:
    get:
      tags: [Calls]
      summary: Get a call the caller participates in (or admin)
      operationId: getCall
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200': { $ref: '#/components/responses/CallOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /calls/{id}/accept:
    put:
      tags: [Calls]
      summary: Callee accepts a ringing call (initiated → accepted)
      operationId: acceptCall
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200': { $ref: '#/components/responses/CallOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/{id}/reject:
    put:
      tags: [Calls]
      summary: Callee rejects a ringing call (initiated → rejected)
      operationId: rejectCall
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200': { $ref: '#/components/responses/CallOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/{id}/connected:
    put:
      tags: [Calls]
      summary: Report media connected (accepted → connected)
      operationId: connectedCall
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200': { $ref: '#/components/responses/CallOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/{id}/end:
    put:
      tags: [Calls]
      summary: End a call (→ ended, or → missed if never answered)
      description: Either participant may end. A never-answered call becomes `missed`; otherwise `ended` with a derived `duration_seconds`. Emits `calling.ended`.
      operationId: endCall
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndCallRequest' }
      responses:
        '200': { $ref: '#/components/responses/CallOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/ice:
    get:
      tags: [Calls]
      summary: ICE servers (STUN + short-lived TURN credentials) for the caller's RTCPeerConnection
      description: |
        Returns the ICE server list the mobile client feeds into its WebRTC `RTCPeerConnection`:
        public STUN, plus — when a TURN relay is configured — a TURN entry with a SHORT-LIVED,
        per-caller credential. The credential follows the coturn REST scheme
        (draft-uberti-behave-turn-rest): `username = "<expiry_unix>:<user_id>"`,
        `credential = base64(HMAC-SHA1(static-auth-secret, username))`. It is minted PER REQUEST,
        expires after `ttl_secs`, and is scoped to the caller — the static `TURN_SECRET` is NEVER
        sent to the client. The client should refetch before `ttl_secs` elapses. STUN-only is
        served when no TURN is configured (local dev / same-LAN).
      operationId: getIceConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/IceConfigOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web; for WS, Bearer on the upgrade request only.

  parameters:
    CallId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    CallOk:
      description: The call
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Call' }
    BadRequest:
      description: Invalid request (e.g. unknown call_type)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Forbidden:
      description: Authenticated but not a participant (or wrong participant for the action)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    NotFound:
      description: Call or booking not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Conflict:
      description: Illegal state transition, callee busy, or booking not callable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    CallTimelineOk:
      description: The call record + its ordered lifecycle timeline
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/CallTimeline' }
    IceConfigOk:
      description: ICE server list (STUN + short-lived TURN credentials)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/IceConfig' }

  schemas:
    CallStatus:
      type: string
      enum: [initiated, accepted, connected, ended, rejected, missed]
    CallType:
      type: string
      enum: [audio, video]

    InitiateCallRequest:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string
          format: uuid
          description: The active booking whose other participant is called (callee derived server-side).
        call_type: { $ref: '#/components/schemas/CallType' }

    EndCallRequest:
      type: object
      properties:
        reason: { type: string, nullable: true, description: 'Optional audit reason (e.g. "hangup").' }

    IceServer:
      type: object
      required: [urls]
      description: One WebRTC ICE server (STUN = urls only; TURN = urls + short-lived username/credential).
      properties:
        urls:
          type: array
          items: { type: string }
          description: 'STUN/TURN URLs, e.g. "stun:stun.l.google.com:19302" or "turn:turn.pguard.app:3478?transport=udp".'
        username: { type: string, nullable: true, description: 'TURN only — "<expiry_unix>:<user_id>".' }
        credential: { type: string, nullable: true, description: 'TURN only — base64(HMAC-SHA1(secret, username)); short-lived.' }

    IceConfig:
      type: object
      required: [ice_servers, ttl_secs]
      properties:
        ice_servers:
          type: array
          items: { $ref: '#/components/schemas/IceServer' }
        ttl_secs:
          type: integer
          format: int64
          description: TURN credential lifetime; refetch before this elapses.

    Call:
      type: object
      required: [id, caller_id, callee_id, booking_id, call_type, status, started_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        caller_id: { type: string, format: uuid }
        callee_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        call_type: { $ref: '#/components/schemas/CallType' }
        status: { $ref: '#/components/schemas/CallStatus' }
        started_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_seconds: { type: integer, format: int32, nullable: true }
        end_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CallEventType:
      type: string
      description: |
        The kind of timeline step. Lifecycle milestones (from the control plane):
        `ringing`/`accepted`/`rejected`/`connected`/`ended`/`missed`. Signaling steps (observed
        by the relay): `offer`/`answer`/`ice_candidate` (relayed between peers), `peer_offline`
        (a frame the peer's socket couldn't receive).
      enum:
        [ringing, accepted, rejected, connected, ended, missed,
         offer, answer, ice_candidate, peer_offline]

    CallEvent:
      type: object
      required: [id, call_id, event_type, occurred_at]
      description: One step of a call's timeline (admin call-events read model).
      properties:
        id: { type: string, format: uuid }
        call_id: { type: string, format: uuid }
        event_type: { $ref: '#/components/schemas/CallEventType' }
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: The participant this step is attributed to (caller/callee), when known.
        detail:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Small structured metadata about the step (e.g. end_reason, the relayed to/delivered). NEVER the raw SDP/ICE blob.'
        occurred_at: { type: string, format: date-time }

    CallTimeline:
      type: object
      required: [call, events]
      description: |
        One call's record + its ordered lifecycle timeline. Media QUALITY (jitter/loss/bitrate)
        is intentionally absent — a signaling relay can't observe it (needs SFU/TURN stats).
      properties:
        call: { $ref: '#/components/schemas/Call' }
        events:
          type: array
          description: Lifecycle + signaling steps in chronological order.
          items: { $ref: '#/components/schemas/CallEvent' }

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: CONFLICT }
        message: { type: string }
