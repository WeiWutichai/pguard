openapi: 3.1.0
info:
  title: pguard — Booking Service API
  version: 0.1.0
  description: |
    v2 OpenAPI contract for the booking service (the source of truth for this service —
    codegen produces the Rust handler stubs/types, the Dart client, and the TS client).

    Split from the v1 `../guard-dispatch/services/booking` god-service. This slice closes
    Phase 1's **producer** side of the decoupling: a booking status change writes the
    business row AND a transactional-outbox row in ONE database transaction, and a
    background relay publishes those rows to NATS JetStream as `pguard.events.booking.*`
    events (see `contracts/asyncapi/events.yaml`). The notification consumer subscribes
    and reacts — booking **never** writes another service's schema (v1 Issue C1).

    All client-facing paths are served behind the gateway under the `/v1` prefix
    (CLAUDE.md "API versioning"). Success responses use the standard `{ success, data }`
    envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3005
    description: Local dev (booking-service direct)

tags:
  - name: Bookings
    description: Booking requests + lifecycle transitions
  - name: Internal
    description: Service-to-service endpoints (service-JWT only; not exposed publicly)

paths:
  /bookings:
    post:
      tags: [Bookings]
      summary: Create a booking request (customer only)
      description: |
        A customer creates a booking request (status `requested`). Role gating is enforced
        in the handler (403 for non-customers). No event is emitted for a bare request.
      operationId: createBooking
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Bookings]
      summary: List the caller's bookings
      description: Bookings where the caller is the customer OR the assigned guard, newest first.
      operationId: listBookings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's bookings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/bookings:
    get:
      tags: [Admin]
      summary: List ALL bookings cross-user (role=admin)
      description: |
        The admin operations list — every booking (NOT owner-scoped, unlike `GET /bookings`),
        newest first, with optional `status` and `search` (address substring) filters and
        limit/offset pagination. Admin only (else 403). The gateway routes `/admin/bookings`
        (and its subpaths) to the booking service via a dedicated prefix rule.
      operationId: adminListBookings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by lifecycle status. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on the booking address.
          schema: { type: string }
        - name: guard_id
          in: query
          required: false
          description: Restrict to bookings assigned to this guard (the guard's job history).
          schema: { type: string, format: uuid }
        - name: customer_id
          in: query
          required: false
          description: Restrict to bookings placed by this customer (the customer's booking history).
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: All matching bookings, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/bookings:
    get:
      tags: [Admin]
      summary: Booking analytics — volume + utilization + retention (role=admin)
      description: |
        Composite booking analytics over `[from, to)` in one round-trip: daily booking-volume
        series, a guard-hours heatmap (day-of-week × 2-hour bucket of scheduled time), and an
        aggregate customer-retention curve. Defaults to the last 30 days (capped at 366). Admin
        only (else 403). NOTE: a bookings-BY-SERVICE-TYPE breakdown is NOT included — the booking
        model has no service_type dimension in v2 (it would entail the deferred catalog→charge
        integration decision).
      operationId: adminBookingsReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC3339). Default = `to − 30 days`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC3339). Default = now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Booking analytics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookingsReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/customer-bookings:
    get:
      tags: [Admin]
      summary: Per-customer booking aggregates (role=admin)
      description: |
        Lifetime booking counts per customer for the web-admin customers page: `total`,
        `completed`, and `cancelled` (folding the terminal cancelled + declined states),
        grouped by `customer_id`. No date window — this is the lifetime-per-customer view.
        Admin only (else 403).
      operationId: adminCustomerBookingsReport
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Per-customer booking aggregates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerBookingStat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/checkins/overdue:
    get:
      tags: [Admin]
      summary: Active jobs with an overdue hourly check-in (role=admin)
      description: |
        The dashboard "เช็คอินที่ขาด" (missed check-ins) signal. A job is in progress when
        `status = 'arrived'` AND `work_started_at` is stamped (the proration clock); hour `N`
        (1-based, ≤ `hours`) opens at `work_started_at + (N−1)h`. Each returned item is an active
        job with ≥ 1 owed-but-unfiled hour whose open time has already passed: `due_at` is the
        oldest such gap's open time (overdue-since), `missed_count` is how many gaps (late /
        out-of-order filing is tolerated, so this counts every gap). `total` is the count of ALL
        such jobs (independent of the page) for the alert badge. Oldest-overdue first. Admin only
        (else 403). House limit/offset pagination.
      operationId: adminOverdueCheckins
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200).
          schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          description: Row offset (default 0).
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Overdue check-ins (list + total count)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OverdueCheckinsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/bookings/{id}/assign:
    post:
      tags: [Admin]
      summary: Admin assigns a guard to an unassigned booking (role=admin)
      description: |
        An admin assigns a guard to a `requested` booking with no guard yet → it lands in
        `accepted` with `guard_id` set (the same end-state as a guard self-accept), enqueuing
        `pguard.events.booking.job_accepted` `{ booking_id, customer_id, guard_id }` in the
        same transaction (transactional outbox). Admin only (else 403). Returns 409 if the
        booking already has an assigned guard (reassignment is out of scope) or the booking is
        not in a state from which assignment is legal. The target `guard_id` is not validated
        to be an approved guard here — send ids from the admin guard list.
      operationId: adminAssignBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignGuardRequest' }
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/pricing/services:
    get:
      tags: [Admin]
      summary: List the service catalog (role=admin)
      description: |
        Admin-managed catalog of bookable service types with a base rate. STANDALONE — the
        charge path is not wired to this catalog yet (bookings keep their server-owned
        base_fee). Active-first, newest next. Admin only (else 403).
      operationId: adminListServices
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Service catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a catalog service (role=admin)
      operationId: adminCreateService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequest' }
      responses:
        '200': { $ref: '#/components/responses/ServiceOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pricing/services/{id}:
    put:
      tags: [Admin]
      summary: Update a catalog service (role=admin)
      operationId: adminUpdateService
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServiceRequest' }
      responses:
        '200': { $ref: '#/components/responses/ServiceOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Deactivate (soft-delete) a catalog service (role=admin)
      description: Sets `is_active = false` (history preserved). Returns the updated row.
      operationId: adminDeleteService
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/ServiceOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /available-guards:
    get:
      tags: [Bookings]
      summary: Discovery — ONLINE approved guards enriched with their rating summary
      description: |
        booking owns discovery but none of the guard catalog (profile), reviews (rating), or
        live presence (presence). This lists the APPROVED guard catalog (read from profile's
        `/internal/guards` over a service-JWT), RESTRICTED to guards who are currently ONLINE —
        live per presence's `/internal/online-guards` (`is_online` AND a fresh GPS fix,
        "พร้อมรับงาน") — and enriches each with the guard's live rating summary (read from
        rating's `/internal/guards/{id}/rating-summary`).

        Online filter: an OFFLINE approved guard is dropped from the list. FAIL-OPEN on
        presence: if the presence consult errors/times out, the full approved list is returned
        UNFILTERED (a presence hiccup must never blank discovery and block all bookings).

        Best-effort on ratings: a guard whose rating lookup fails still appears with
        `average_rating: null` and `review_count: 0`.
      operationId: listAvailableGuards
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scheduled_at
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            Start of the customer's chosen window. When supplied WITH `hours`, the busy-guard
            exclusion is scoped to this window (a guard booked for a non-overlapping time is still
            offered). Omit both for the coarse "any active job" exclusion.
        - name: hours
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: Length of the window in hours (paired with `scheduled_at`).
      responses:
        '200':
          description: Approved guards with rating summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AvailableGuard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /services:
    get:
      tags: [Bookings]
      summary: List ACTIVE catalog services (customer-facing picker)
      description: |
        The customer-facing service picker: the ACTIVE catalog services a customer can book
        against, projected to a narrow shape (`id`, `name_th`, `name_en`, `base_fee`,
        `min_hours`) — `notes`/`is_active`/timestamps are admin-only and NOT exposed here.
        Any authenticated user may read it (NOT admin-gated, unlike `/admin/pricing/services`).
        A customer passes the chosen `id` as `CreateBookingRequest.service_id`, which resolves
        the booking's server-owned `base_fee` and `min_hours` floor on the charge path.
      operationId: listServices
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active catalog services
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicServiceItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookings/open:
    get:
      tags: [Bookings]
      summary: Open-job discovery — requested bookings with no guard yet (guard only)
      description: |
        Bookings a guard can claim: `status = requested AND guard_id IS NULL`. Guard/admin
        only (403 otherwise). A literal path segment registered beside `/bookings/{id}` —
        static segments win in the router (same precedent as calling's `/calls/ice`), and
        the gateway's existing `/bookings` prefix rule routes it with no gateway change.

        Filtering: with `lat`+`lng` (and optional `radius_km`, default 10) only bookings
        that HAVE coordinates within the radius are returned, nearest first. Without
        coordinates, all open bookings are returned newest-first (coordinates on bookings
        are optional). `lat`/`lng` must be sent together; `radius_km` requires them.
        Paginated with `limit`/`offset`.
      operationId: listOpenBookings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lat
          in: query
          required: false
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
          description: Guard's latitude (must be paired with `lng`).
        - name: lng
          in: query
          required: false
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
          description: Guard's longitude (must be paired with `lat`).
        - name: radius_km
          in: query
          required: false
          schema: { type: number, format: double, exclusiveMinimum: 0, maximum: 500, default: 10 }
          description: Great-circle search radius in km (requires `lat`+`lng`).
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Open bookings (claimable by the caller)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get one booking the caller participates in
      operationId: getBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{id}/accept:
    post:
      tags: [Bookings]
      summary: Guard accepts a request
      description: |
        A guard accepts → status `accepted`, `guard_id` set to the caller. Enqueues
        `pguard.events.booking.job_accepted` `{ booking_id, customer_id, guard_id }` into
        the outbox in the SAME transaction (transactional outbox). Rejected with 409 if the
        booking is not in a state from which acceptance is legal.
      operationId: acceptBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/skip:
    post:
      tags: [Bookings]
      summary: Guard passes on an open offer (server-tracked skip)
      description: |
        The guard SKIPS an open offer they aren't taking. Server-tracked (per-guard) so open-job
        discovery (`GET /bookings/open`) stops re-offering THIS booking to THIS guard — the booking
        stays `requested`/open for OTHER guards (NOT a cancellation). Idempotent. Guard only.
      operationId: skipBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Skip recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          skipped: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{id}/decline:
    put:
      tags: [Bookings]
      summary: Assigned guard withdraws (after accepting)
      description: |
        The ASSIGNED guard backs out → status `declined` (terminal). v2 is first-come-accept,
        so there is no per-guard offer to decline before accepting — decline is the assigned
        guard withdrawing (`accepted → declined`). Enqueues `pguard.events.booking.declined`
        in the same transaction. 403 if the caller is not the assigned guard.
      operationId: declineBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/en-route:
    put:
      tags: [Bookings]
      summary: Assigned guard is en route
      description: |
        Status → `en_route`. Enqueues `pguard.events.booking.guard_en_route` into the
        outbox in the same transaction. Assigned guard only.
      operationId: enRouteBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/arrived:
    put:
      tags: [Bookings]
      summary: Assigned guard has arrived
      description: |
        Status → `arrived`. Enqueues `pguard.events.booking.arrived` into the outbox in
        the same transaction. Assigned guard only.
      operationId: arrivedBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/start:
    put:
      tags: [Bookings]
      summary: Assigned guard starts the job
      description: |
        Stamps `work_started_at` (the proration basis); status stays `arrived` (no event).
        Assigned guard only; the booking must be `arrived`. A second start is an idempotent
        no-op. The job must be started before completion can be requested.
      operationId: startBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/complete:
    put:
      tags: [Bookings]
      summary: Assigned guard requests completion
      description: |
        Status `arrived → pending_completion` — the guard REQUESTS completion; the customer
        then reviews (see review-completion). No event yet. 409 if the job was not started.
        Assigned guard only.
      operationId: completeBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/review-completion:
    put:
      tags: [Bookings]
      summary: Customer reviews the guard's completion request
      description: |
        The CUSTOMER (request owner) decides: `approve` → `completed` (emits
        `pguard.events.booking.completed` with `booked_hours` + `actual_seconds`, driving
        payment proration) or `reject` → back to `arrived` (the guard finishes). Customer/admin
        only; the booking must be `pending_completion`.
      operationId: reviewCompletion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCompletionRequest' }
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/cancel:
    put:
      tags: [Bookings]
      summary: Customer/admin cancels a pre-arrival booking
      description: |
        Status → `cancelled`. Allowed only PRE-ARRIVAL (`requested`/`accepted`/`en_route`) —
        once a guard is on-site the job runs to completion review. Enqueues
        `pguard.events.booking.cancelled`. Customer (request owner) or admin only.
      operationId: cancelBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { $ref: '#/components/responses/BookingOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/progress-reports:
    post:
      tags: [Bookings]
      summary: Assigned guard submits an hourly check-in (photo + GPS)
      description: |
        The ASSIGNED guard checks in for `hour_number` of a job IN PROGRESS (status
        `arrived` with `work_started_at` stamped by start). `multipart/form-data` —
        server-mediated upload following the chat-attachment house pattern: the photo is
        validated (size before magic bytes; JPEG/PNG/WEBP ≤ 10MB), the SERVER uploads it
        to S3/MinIO under a server-generated key (clients never supply keys or see
        credentials), and only the key + metadata are persisted. Enqueues
        `pguard.events.booking.progress_reported` into the outbox in the SAME transaction.

        Rules: `hour_number` must be within `1..=hours`; hour N opens once N−1 hours have
        elapsed since `work_started_at` (409 `CONFLICT` too-early otherwise); one check-in
        per hour — a duplicate `hour_number` is 409 `DUPLICATE_CHECK_IN` (checked BEFORE the
        upload), so a client retry can never double-report and uploads nothing; clients
        branch on `error.code`, not the message. Strictly the assigned guard (no admin
        bypass — a report is the guard's first-person attestation of presence). GPS is
        optional (the guard may be offline at capture); when sent, `lat`+`lng` must come
        together.

        > **⚠️ Deployment dependency (tracked, NOT yet satisfied):** the booking service
        > accepts bodies up to 12 MiB on this route, but the api-gateway currently buffers
        > EVERY proxied body at a hard 1 MiB (`proxy.rs MAX_BODY_BYTES` → 413) and staging
        > nginx caps at 2 MB (`client_max_body_size 2m`). Until the gateway grows a
        > per-route body-cap carve-out (≥ 12 MiB for this route; in-flight gateway slice)
        > + a location-scoped nginx override, photos over ~1 MiB get **413 at the edge**
        > and never reach this endpoint. Mobile wiring MUST gate on that follow-up.
      operationId: createProgressReport
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProgressReportUploadForm' }
      responses:
        '200':
          description: The created progress report (with a fresh presigned photo URL, TTL 1h)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProgressReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Conflict — `error.code` is the machine-readable discriminator (the envelope
            shape is the standard `ErrorBody`, unchanged):
              - `DUPLICATE_CHECK_IN` — a check-in for this `hour_number` already exists
                (caught at the pre-flight before the upload, and again by the unique index
                inside the insert transaction). An idempotent client retry SHOULD treat
                this as success — the hour is already recorded and nothing was re-uploaded.
              - `CONFLICT` — the hour is not open yet (hour N opens once N−1 hours have
                elapsed since `work_started_at`) or the job has not been started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '413':
          description: >-
            Body too large. Today this fires at the EDGE for >1 MiB (gateway buffer cap;
            see the deployment-dependency note above) — once the per-route carve-out
            lands, the service's own 12 MiB route cap produces it.
    get:
      tags: [Bookings]
      summary: List a booking's check-in reports (participants only)
      description: |
        The booking's customer (owner) and assigned guard may read (admin bypasses) —
        IDOR-gated both ways; a non-participant gets 403. Reports are returned in
        `hour_number` order, each with a FRESHLY presigned photo URL (the stored key is
        re-signed on every read — signed URLs are never persisted as the source of truth).
      operationId: listProgressReports
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The booking's progress reports, hour order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProgressReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/bookings/{id}:
    get:
      tags: [Internal]
      summary: Read authoritative booking fields (service-JWT only)
      description: |
        Service-to-service read used by the payment service to make the money decision
        against the authoritative booking — never trusting client-supplied
        customer/guard/status. **Requires a service-JWT** (`serviceAuth`, audience
        `pguard-internal`); v1 had no auth on cross-service reads. Returns only
        `{ id, customer_id, guard_id, status, hours }` (least-privilege over the wire). Not
        routed through the public gateway.
      operationId: getInternalBooking
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The authoritative booking subset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InternalBooking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/users/{user_id}/export:
    get:
      tags: [Internal]
      summary: PDPA data export aggregation (service-to-service)
      description: |
        Service-to-service read used by identity's `ExportClient` fan-out to aggregate this
        service's slice of a user's PDPA data export. **Requires a service-JWT** (`serviceAuth`,
        audience `pguard-internal`); never reachable from the public edge (the gateway blocks
        `/internal/`). Returns this service's per-user export blob (an opaque object).
      operationId: internalExportUser
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: This service's per-user export blob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token, audience `pguard-internal`, signed with SERVICE_JWT_SECRET.

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
      description: Page size (max 200).
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
      description: Rows to skip.

  responses:
    BookingOk:
      description: The booking
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Booking' }
    ServiceOk:
      description: The catalog service
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ServiceCatalogItem' }
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but not permitted (wrong role / not a participant)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Booking not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Illegal lifecycle transition for the booking's current status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    BookingStatus:
      type: string
      description: Booking lifecycle status. See the state machine in src/domain/state.rs.
      enum:
        - requested
        - accepted
        - declined
        - en_route
        - arrived
        - pending_completion
        - completed
        - cancelled

    AssignGuardRequest:
      type: object
      required: [guard_id]
      properties:
        guard_id:
          type: string
          format: uuid
          description: The guard the admin assigns to this booking.

    ServiceCatalogItem:
      type: object
      required: [id, name_th, name_en, base_fee, min_hours, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name_th: { type: string }
        name_en: { type: string }
        base_fee:
          type: string
          description: Base fee in THB per hour per guard (exact decimal string).
          example: "230.00"
        min_hours: { type: integer, format: int32, minimum: 1, maximum: 24 }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicServiceItem:
      type: object
      description: >-
        The customer-facing view of an ACTIVE catalog service (the `GET /services` picker) —
        a narrow subset of `ServiceCatalogItem` (no `is_active`/timestamps). `notes` is surfaced
        as the customer-facing package description.
      required: [id, name_th, name_en, base_fee, min_hours]
      properties:
        id: { type: string, format: uuid }
        name_th: { type: string }
        name_en: { type: string }
        base_fee:
          type: string
          description: Server-owned ฿/hour/guard rate (exact decimal string).
          example: "230.00"
        min_hours: { type: integer, format: int32, minimum: 1, maximum: 24 }
        notes:
          type: string
          nullable: true
          description: Short customer-facing package description (the admin notes).

    CreateServiceRequest:
      type: object
      required: [name_th, name_en, base_fee, min_hours]
      properties:
        name_th: { type: string }
        name_en: { type: string }
        base_fee:
          type: string
          description: Exact decimal string in THB (0 to 1000000).
          example: "230.00"
        min_hours: { type: integer, format: int32, minimum: 1, maximum: 24 }
        notes: { type: string, nullable: true }

    UpdateServiceRequest:
      type: object
      required: [name_th, name_en, base_fee, min_hours]
      properties:
        name_th: { type: string }
        name_en: { type: string }
        base_fee: { type: string, example: "230.00" }
        min_hours: { type: integer, format: int32, minimum: 1, maximum: 24 }
        notes: { type: string, nullable: true }

    ReviewCompletionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
          description: "`approve` → completed (emits booking.completed); `reject` → back to arrived."

    CreateBookingRequest:
      type: object
      required: [address, scheduled_at, hours]
      properties:
        address: { type: string }
        scheduled_at: { type: string, format: date-time }
        hours: { type: integer, format: int32, minimum: 1 }
        service_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional catalog service the customer picked. When present, the booking's
            `base_fee` is resolved SERVER-SIDE from that ACTIVE catalog service (the client
            never sends a fee) and the service's `min_hours` floor is enforced (`hours` below
            it → 400). A missing/inactive `service_id` → 404. When absent, `base_fee` falls to
            the server-owned column default (back-compat).
        guard_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          default: 1
          description: Number of guards requested. Authoritative once persisted (used by the money path).
        tip:
          type: string
          default: "0"
          description: Optional up-front tip (exact decimal string); folded into the expected total.
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Optional site latitude (must be paired with `lng`) — feeds open-job radius discovery.
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Optional site longitude (must be paired with `lat`).

    Booking:
      type: object
      required: [id, customer_id, status, address, scheduled_at, hours, base_fee, guard_count, tip, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/BookingStatus' }
        address: { type: string }
        scheduled_at: { type: string, format: date-time }
        hours: { type: integer, format: int32 }
        base_fee: { type: string, description: "Server-owned ฿/hour/guard rate (exact decimal)", example: "500.00" }
        guard_count: { type: integer, format: int32 }
        tip: { type: string, description: "Up-front tip (exact decimal)", example: "0" }
        lat: { type: number, format: double, nullable: true, description: Site latitude (null when not provided at create). }
        lng: { type: number, format: double, nullable: true, description: Site longitude (null when not provided at create). }
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the PRE-PAY charge cleared (stamped by the payment.completed consumer). null = unpaid;
            the client uses this to know the accepted→en_route transition is gated (show the pay-step).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProgressReportUploadForm:
      type: object
      description: |
        multipart/form-data parts for the hourly check-in. The photo part's Content-Type
        must be the declared MIME (image/jpeg, image/png or image/webp, ≤ 10MB) and must
        match the actual bytes (magic-byte verified server-side).
      required: [hour_number, photo]
      properties:
        hour_number:
          type: integer
          format: int32
          minimum: 1
          description: Which job-hour this check-in covers (1-based, ≤ the booking's `hours`).
        photo:
          type: string
          format: binary
          description: The check-in photo (JPEG/PNG/WEBP, ≤ 10MB).
        lat: { type: number, format: double, minimum: -90, maximum: 90, description: GPS at capture time (optional; pair with `lng`). }
        lng: { type: number, format: double, minimum: -180, maximum: 180, description: GPS at capture time (optional; pair with `lat`). }
        accuracy: { type: number, format: float, description: GPS accuracy in meters (optional; non-finite/negative/absurd values are discarded server-side, stored as null). }
        note: { type: string, maxLength: 2000, description: Optional free-text note (trimmed; empty treated as absent; max 2000 characters). }

    ProgressReport:
      type: object
      description: |
        One hourly check-in. `photo_url` is a FRESH presigned GET URL (TTL 1h) signed per
        read from the stored `photo_key` — the bucket and credentials are never exposed.
      required: [id, booking_id, guard_id, hour_number, photo_key, photo_url, created_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid }
        hour_number: { type: integer, format: int32 }
        photo_key: { type: string, description: S3 object key (internal reference; not directly fetchable). }
        photo_url: { type: string, description: Fresh presigned download URL (TTL 1h). }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        accuracy_m: { type: number, format: float, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    InternalBooking:
      type: object
      description: |
        The authoritative subset exposed to internal (service-JWT'd) callers — the fields the
        payment service needs to verify a charge, compute the expected total
        (`base_fee × hours × guard_count + tip`), and carry the guard into the payment event.
        Deliberately narrower than `Booking` (no address/timestamps). `base_fee` is
        server-owned — the client never sets it.
      required: [id, customer_id, status, hours, base_fee, guard_count, tip]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/BookingStatus' }
        hours: { type: integer, format: int32 }
        base_fee: { type: string, description: "Server-owned ฿/hour/guard rate (exact decimal)", example: "500.00" }
        guard_count: { type: integer, format: int32 }
        tip: { type: string, description: "Up-front tip (exact decimal)", example: "0" }

    AvailableGuard:
      type: object
      description: >-
        An approved guard (profile catalog) enriched with their rating summary (rating).
        `display_name` + `avatar_url` are the same approved-guard exposure as
        `GET /guards/{id}/public` — the guard the customer is choosing — so the selection card
        shows a real name + photo instead of an id + initials. Both are omitted when absent
        (`avatar_url` is a short-lived presigned GET URL, null/omitted when no avatar is set).
        `has_documents` says WHETHER the guard's five credential documents are on file
        (profile-derived boolean) — the documents themselves are never exposed to customers.
        OMITTED when unknown (an older profile that doesn't emit the field), so a client must
        render "unknown" as nothing, never as "no documents".
      required: [guard_id, review_count]
      properties:
        guard_id: { type: string, format: uuid }
        display_name:
          type: string
          nullable: true
          description: Guard's full name for the selection card; null/omitted if not set.
          example: "Somchai Jaidee"
        avatar_url:
          type: string
          nullable: true
          description: Short-lived presigned GET URL for the guard's photo; null/omitted if no avatar.
        years_of_experience: { type: integer, format: int32, nullable: true }
        average_rating:
          type: string
          nullable: true
          description: AVG of visible overall ratings (decimal string); null if none / rating unreachable.
          example: "4.50"
        review_count: { type: integer, format: int64 }
        has_documents:
          type: boolean
          description: True when all five credential documents (id card, security license, training cert, criminal check, driver license) are on file with profile; omitted when unknown.

    DailyCount:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, format: int64 }

    UtilizationCell:
      type: object
      description: Guard-hours in a day-of-week × 2-hour slot (`hours` = Σ hours×guard_count).
      required: [dow, bucket, hours]
      properties:
        dow: { type: integer, format: int32, description: "0=Sunday .. 6=Saturday" }
        bucket: { type: integer, format: int32, description: "2-hour bucket 0..11 (0 = 00:00–02:00)" }
        hours: { type: integer, format: int64 }

    RetentionPoint:
      type: object
      required: [week, pct]
      properties:
        week: { type: integer, format: int32 }
        pct: { type: number, format: double, description: "% of customers still active at week N (week 0 = 100)." }

    BookingsReport:
      type: object
      required: [daily, utilization, retention, total]
      properties:
        daily:
          type: array
          items: { $ref: '#/components/schemas/DailyCount' }
        utilization:
          type: array
          items: { $ref: '#/components/schemas/UtilizationCell' }
        retention:
          type: array
          items: { $ref: '#/components/schemas/RetentionPoint' }
        total: { type: integer, format: int64, description: Total bookings in the window. }

    CustomerBookingStat:
      type: object
      description: Lifetime booking aggregate for one customer (web-admin customers page).
      required: [customer_id, total, completed, cancelled]
      properties:
        customer_id: { type: string, format: uuid }
        total: { type: integer, format: int64, description: All bookings ever placed by this customer. }
        completed: { type: integer, format: int64, description: Bookings that reached the completed state. }
        cancelled: { type: integer, format: int64, description: "Terminal not-done states (cancelled + declined)." }

    OverdueCheckin:
      type: object
      description: An active job whose next scheduled hourly check-in is overdue.
      required: [booking_id, guard_id, customer_id, due_at, missed_count]
      properties:
        booking_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid, description: The assigned guard who owes the check-in. }
        customer_id: { type: string, format: uuid }
        due_at:
          type: string
          format: date-time
          description: Open time of the oldest owed-but-unfiled hour (overdue-since).
        missed_count:
          type: integer
          format: int64
          description: Owed hours (open time passed) with no check-in filed yet.

    OverdueCheckinsResponse:
      type: object
      description: Overdue-check-ins list plus a total count for the dashboard alert badge.
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OverdueCheckin' }
        total:
          type: integer
          format: int64
          description: All active jobs with an overdue check-in (independent of the page).

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: CONFLICT }
        message: { type: string }
