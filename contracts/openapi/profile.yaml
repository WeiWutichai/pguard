openapi: 3.1.0
info:
  title: pguard — Profile Service API
  version: 0.1.0
  description: |
    Guard + customer profiles and the guard onboarding-approval lifecycle (source of truth
    for this service — codegen produces the Rust handler stubs/types, the Dart client, and
    the TS client). Split out of the v1 `../guard-dispatch/services/auth` god-service.

    Every endpoint here is **AuthUser-gated** (a registered, logged-in user — Bearer access
    JWT, or the `access_token` cookie for web). There is NO phone-verify / profile-token
    flow in this slice; that registration step is future identity work.

    **PDPA — bank account masking (security-reviewer §7):** on the owner-facing read
    (`GET /profile/me`) the `account_number` is returned MASKED to its last 4 characters.
    The admin onboarding endpoints (`GET /admin/guard-profiles`) return the FULL value, as
    the reviewer needs it to verify payout details.

    **Role gates (403):** `POST/PUT /profile/guard` require role `guard`; `POST
    /profile/customer` requires role `customer`; all `/admin/*` endpoints require role
    `admin`. A wrong-role caller receives a generic 403 that names the REQUIRED role, never
    the caller's (no role enumeration).

    Client-facing paths are served behind the gateway under the `/v1` prefix (CLAUDE.md
    "API versioning"). Success responses use the standard `{ success, data }` envelope;
    errors use `ErrorBody`.

    **Documents:** a guard uploads their own credential IMAGES (id card, security license,
    training cert, criminal check, driver license, passbook photo) via
    `POST /profile/guard/{user_id}/documents` — multipart, magic-byte validated, stored in
    private S3 under a server-generated key. **Own docs only**, authed by EITHER the short-lived
    `doc_upload_token` from the profile submit (registration — so an admin can review the documents
    BEFORE approving) OR a logged-in guard (post-approval). The owner or an admin reads a document
    via the matching `GET` (short-lived presigned URL, never the raw key). Document **expiry dates**
    are captured separately (metadata only) via `document_expiries` on the guard profile submit —
    these feed the admin "expiring documents" surface.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3002
    description: Local dev (profile-service direct)

tags:
  - name: Profile
    description: The caller's own guard/customer profile (create, update, read)
  - name: Admin
    description: Guard onboarding review (admin role only)

paths:
  /profile/guard:
    post:
      tags: [Profile]
      summary: Create or update the caller's guard profile (profile_token OR logged-in guard)
      description: |
        Upserts the caller's guard profile. **Dual auth** (either satisfies the request):
          - a single-use, purpose-scoped `profileToken` (`guard_profile`) from registration
            (`POST /auth/register`) — the user is NOT logged in yet. The token is consumed
            single-use; a `customer_profile` token is rejected here (purpose isolation).
          - a logged-in guard's `bearerAuth` access token (a later self-edit), role-gated.

        Writes ONLY the profile schema: on first create `approval_status` is `pending`; a
        later upsert edits fields but NEVER changes the approval decision (only an admin does,
        via approve/reject), and `users.role` (identity-owned) is never touched. The read-back
        masks `account_number` (PDPA).
      operationId: upsertGuardProfile
      security: [{ bearerAuth: [] }, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertGuardProfileRequest' }
      responses:
        '200': { $ref: '#/components/responses/GuardProfileSubmitOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Profile]
      summary: Update the caller's EXISTING guard profile (role=guard)
      description: |
        Updates an existing guard profile's editable fields. Unlike `POST` this never
        inserts: a caller with no profile yet receives 404. Requires role `guard`. The
        read-back masks `account_number` (PDPA).
      operationId: updateGuardProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertGuardProfileRequest' }
      responses:
        '200': { $ref: '#/components/responses/GuardProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profile/customer:
    post:
      tags: [Profile]
      summary: Create or update the caller's customer profile (profile_token OR logged-in customer)
      description: |
        Upserts the caller's customer profile (minimal in this slice: full name + address).
        **Dual auth** (either satisfies the request):
          - a single-use `profileToken` (`customer_profile`) from registration (the user is
            not logged in yet); consumed single-use, and a `guard_profile` token is rejected
            here (purpose isolation).
          - a logged-in customer's `bearerAuth` access token (a later self-edit), role-gated.

        Writes ONLY the customer profile schema; identity's approval state is never written
        directly. The new row starts `pending` and emits NO event: **customers are now
        admin-approved exactly like guards** — a reviewer approves/rejects them via
        `POST /admin/customer-profiles/{user_id}/{approve,reject}`, which emits `user.approved`
        so identity unblocks login. The fields in this minimal slice are optional, so
        "submission" — not field completeness — is the gate (the official client makes
        `address` required). A later self-edit re-upsert leaves the approval decision untouched.
      operationId: upsertCustomerProfile
      security: [{ bearerAuth: [] }, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertCustomerProfileRequest' }
      responses:
        '200': { $ref: '#/components/responses/CustomerProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /profile/me:
    get:
      tags: [Profile]
      summary: The caller's own profile (account number MASKED)
      description: |
        Returns the caller's profile, tagged by `kind` (`guard` or `customer`) so the
        client need not guess. For a guard the `account_number` is MASKED to its last 4
        characters (PDPA §7). A caller with no profile (or an admin, who has no self-profile
        in this slice) receives 404.
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's profile (masked account number for guards)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /guards/{id}/public:
    get:
      tags: [Profile]
      summary: Assigned guard's public mini-profile (customer live-tracking map)
      description: |
        The MINI-profile (name + years of experience) of the guard assigned to the caller's
        booking, for the customer live-tracking map. **IDOR-gated:** a `customer` may read it ONLY
        while they have an ACTIVE booking with this guard (an event-derived read-model projected
        from `pguard.events.booking.*`); a `guard` may read only their own; an `admin` may read
        any. A customer without an active booking gets **403** (NOT 404 — no existence probe).
        **Approval-gated:** an un-approved or unknown guard returns **404** (its existence is never
        revealed). Returns ONLY `{ user_id, full_name, years_of_experience }` — never the
        bank/address/DOB/emergency-contact PII. `full_name` is PII reachable by a non-owner ONLY
        under this active-booking trust boundary (PDPA §7); a photo is deferred (no avatar storage).
      operationId: getPublicGuardProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The assigned guard's user_id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The assigned guard's public mini-profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicGuardProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/{id}/public:
    get:
      tags: [Profile]
      summary: Guard's view of a customer's public mini-profile (name + photo)
      description: |
        The MINI-profile (name + photo) of a customer, so the guard's job sheet can address the
        customer by their REAL NAME instead of a raw id. **Role-gated:** any `guard` may read it —
        from the job OFFER onwards, per the 2026-07-11 product decision that guards see who is
        booking BEFORE accepting (the old active-booking IDOR gate 403'd every unaccepted offer
        and every finished job in the work history); a `customer` may read only their own; an
        `admin` may read any. Returns ONLY `{ user_id, full_name, avatar_url }` — never the
        customer's address/company/email/phone PII. Exposure stays bounded: customer ids are
        unguessable UUIDv4s a guard only learns from bookings already shown to them.
      operationId: getPublicCustomerProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The customer's user_id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The customer's public mini-profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicCustomerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profile/guard/{user_id}/documents:
    post:
      tags: [Profile]
      summary: Upload one of a guard's credential images
      description: |
        Upload ONE guard credential image (JPEG/PNG/WEBP, ≤10 MiB). Auth (any one):
        a logged-in **guard** (OWN docs only), the short-lived `doc_upload_token` from
        `POST /profile/guard` (registration — lets a not-yet-approved guard upload so an admin can
        review BEFORE approving), OR a logged-in **admin** (may upload on behalf of ANY guard — the
        "guard forgot to attach" staff override; admin writes are audit-logged). The image is
        magic-byte validated (declared MIME must match the content), stored in private S3 under a
        server-generated key, and the key written to the matching `*_key` column. Returns a
        short-lived (1h) presigned GET URL — the raw key is never exposed.
      operationId: uploadGuardDocument
      security: [{ bearerAuth: [] }, { profileToken: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          description: The guard's user_id (must equal the caller).
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, file]
              properties:
                document_type:
                  type: string
                  enum: [id_card, security_license, training_cert, criminal_check, driver_license, passbook_photo]
                file:
                  type: string
                  format: binary
                  description: The credential image (JPEG/PNG/WEBP, ≤10 MiB).
      responses:
        '200':
          description: Uploaded; returns the type + a presigned download URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuardDocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large (image exceeds the 12 MiB body cap) }
    get:
      tags: [Profile]
      summary: A presigned URL for one of the guard's stored documents
      description: |
        Returns a short-lived presigned GET URL for ONE stored credential image. Read auth is
        **owner-or-admin** (an admin must be able to verify a guard's credentials). 404 when the
        document type is valid but not yet uploaded, or the guard has no profile.
      operationId: getGuardDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: document_type
          in: query
          required: true
          schema:
            type: string
            enum: [id_card, security_license, training_cert, criminal_check, driver_license, passbook_photo]
      responses:
        '200':
          description: A presigned download URL for the requested document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuardDocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profile/guard/{user_id}/avatar:
    post:
      tags: [Profile]
      summary: Upload the guard's own profile picture
      description: |
        Upload/replace the guard's avatar (JPEG/PNG/WEBP, ≤10 MiB). Auth: logged-in **guard, own
        avatar only** (`{user_id}` must equal the caller — no admin bypass on write). Image is
        magic-byte validated (declared MIME must match the content), stored in private S3 under a
        server-generated key, and the key written to `avatar_key`. Returns a short-lived (1h)
        presigned GET URL — the raw key is never exposed.
      operationId: uploadGuardAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          description: The guard's user_id (must equal the caller).
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The avatar image (JPEG/PNG/WEBP, ≤10 MiB).
      responses:
        '200':
          description: Uploaded; returns a presigned download URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuardAvatarResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large (image exceeds the 12 MiB body cap) }
    get:
      tags: [Profile]
      summary: A presigned URL for the guard's avatar
      description: |
        Returns a short-lived presigned GET URL for the stored avatar. Read auth is
        **owner-or-admin**. 404 when no avatar is set or the guard has no profile.
      operationId: getGuardAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A presigned download URL for the avatar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuardAvatarResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profile/customer/{user_id}/avatar:
    post:
      tags: [Profile]
      summary: Upload the customer's own profile picture
      description: |
        Upload/replace the customer's avatar (JPEG/PNG/WEBP, ≤10 MiB). The MIRROR of
        `POST /profile/guard/{user_id}/avatar` for the customer side. Auth: logged-in **customer,
        own avatar only** (`{user_id}` must equal the caller — no admin bypass on write). Image is
        magic-byte validated (declared MIME must match the content), stored in private S3 under a
        server-generated key, and the key written to `customer_profiles.avatar_key`. Returns a
        short-lived (1h) presigned GET URL — the raw key is never exposed.
      operationId: uploadCustomerAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          description: The customer's user_id (must equal the caller).
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The avatar image (JPEG/PNG/WEBP, ≤10 MiB).
      responses:
        '200':
          description: Uploaded; returns a presigned download URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerAvatarResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large (image exceeds the 12 MiB body cap) }
    get:
      tags: [Profile]
      summary: A presigned URL for the customer's avatar
      description: |
        Returns a short-lived presigned GET URL for the stored avatar. Read auth is
        **owner-or-admin**. 404 when no avatar is set or the customer has no profile.
      operationId: getCustomerAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A presigned download URL for the avatar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerAvatarResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profile/guard/{user_id}/document-expiries:
    get:
      tags: [Profile]
      summary: The guard's recorded credential expiry dates
      description: |
        Owner-or-admin: a guard reads their OWN expiry dates (the "My documents" screen), an admin
        reads any guard's. Only the expiring credential types appear (the passbook has no expiry).
      operationId: listGuardDocumentExpiries
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The recorded expiry dates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GuardDocumentExpiry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /profile/guard/{user_id}/document-expiry:
    put:
      tags: [Profile]
      summary: Set/replace one credential's expiry date
      description: |
        Owner-or-admin: a guard edits their OWN expiry (post-approval), an admin may edit ANY guard's
        (audit-logged). `document_type` must be an expiring credential (id_card / security_license /
        training_cert / criminal_check / driver_license — the passbook has none) else 400.
      operationId: setGuardDocumentExpiry
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDocumentExpiryRequest' }
      responses:
        '200':
          description: The saved expiry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuardDocumentExpiry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/guard-profiles:
    get:
      tags: [Admin]
      summary: List guard profiles for onboarding review (role=admin; FULL bank details)
      description: |
        Lists guard profiles, newest first, optionally filtered by `approval_status`. Admin
        only (else 403). **Returns the FULL, UN-masked `account_number`** — the reviewer
        needs it to verify payout details.

        Rows are `GuardProfileAdmin`: the profile PLUS `created_at` (signup time) and
        `login_phone` (the account's own number, resolved from identity) so the approval queue
        can show a reachable human instead of a short id.
      operationId: adminListGuardProfiles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: approval_status
          in: query
          required: false
          description: Filter by status. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200':
          description: Matching guard profiles (FULL account numbers + login phone + signup time)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GuardProfileAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/customer-profiles:
    get:
      tags: [Admin]
      summary: List customer profiles (role=admin)
      description: |
        Lists customer profiles, newest first (capped at 200, not paginated), optionally filtered
        by `approval_status`. Admin only (else 403). Each row carries `approval_status`
        (pending/approved/rejected) so the admin can see who is still awaiting review — customers
        are now admin-approved exactly like guards (no longer auto-approved on first profile
        insert). The ผู้สมัคร page's "ผู้เรียก รปภ." (customer) tab passes
        `?approval_status=pending`. Records a PDPA §30 read-audit row.

        Each row also carries `login_phone` (the account's own number, resolved from identity) —
        distinct from the optional, often-blank `contact_phone` on the profile itself.
      operationId: adminListCustomerProfiles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: approval_status
          in: query
          required: false
          description: Filter by status. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200':
          description: All customer profiles, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerProfileAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/access-audit:
    get:
      tags: [Admin]
      summary: List the PDPA §30 data-access audit trail (role=admin)
      description: |
        Who (an admin) accessed what PII and when — the §30 access trail written by the admin
        list endpoints. Newest first, optional `action` filter + limit/offset. Admin only.
        NOTE: this is a DATA-ACCESS trail, not a full business-action feed (approved/refund/
        check-in with actor/IP/payload) — that needs a dedicated audit-event sink.
      operationId: adminListAccessAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: action
          in: query
          required: false
          description: Filter by the recorded action (e.g. admin_list_guard_profiles).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Access-audit rows, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AccessAuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /org-settings:
    get:
      tags: [Profile]
      summary: The company block printed on receipts (any signed-in user)
      description: |
        The seller identity a Thai tax invoice (ใบกำกับภาษี) legally requires — company name, tax
        ID and address. Readable by ANY authenticated role, unlike the admin twin below: the
        receipt is rendered on the customer's device, so gating this to admins would mean shipping
        a document that cannot legally be one. Org-wide public-facing config, not personal data, so
        it is not §30-audited. Never 404s — an unset row returns all-`null` fields so the client can
        state the document is incomplete instead of printing a blank header.
      operationId: getOrgSettings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The company profile (fields may be null when unset)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OrgSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/org-settings:
    get:
      tags: [Admin]
      summary: Read the organization (company) profile (role=admin)
      description: |
        The org (company) profile — `company_name` / `tax_id` / `address` — shown on RECEIPTS
        and IN-APP (#143, Settings → บริษัท / Company profile). This is org-wide, admin-owned
        config (edited at runtime, no redeploy), so unlike the env-config Settings tabs it has a
        real single-row store owned by the profile service. Admin only (else 403).

        WHY THE THREE FIELDS MATTER: they are the SELLER block that a Thai full tax invoice
        (ใบเสร็จรับเงิน/ใบกำกับภาษี) is legally required to carry — the issuer's name, TIN
        (เลขประจำตัวผู้เสียภาษี) and registered address. While they are null, every receipt the
        platform issues is missing its issuer block and is not a valid tax invoice, even though
        VAT 7% was collected from the customer.

        NEVER 404s: when nothing has been saved yet, every field is `null` and `updated_at` is
        `null` (an "unset" default) — the admin UI renders blank inputs and warns that receipts
        are incomplete. Reading the company profile is org config, not PII, so it is NOT
        §30 access-audited.
      operationId: adminGetOrgSettings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The org (company) profile (or the all-null unset default)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrgSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Set/replace the organization (company) profile (role=admin)
      description: |
        Upsert the single-row org (company) profile. Admin only (else 403). All fields optional
        (the admin saves incrementally). Validates a LENIENT `tax_id` (8–20 digits, spaces/hyphens
        allowed — not a checksum) and bounded `company_name`/`address` lengths (≤ 500 chars); an
        invalid value → 400. The acting admin is recorded server-side (`updated_by`). Returns the
        stored row for read-back.
      operationId: adminUpdateOrgSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrgSettingsRequest' }
      responses:
        '200':
          description: The stored org (company) profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrgSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/resolve:
    post:
      tags: [Admin]
      summary: Batch-resolve user_ids to display names (role=admin)
      description: |
        Resolve a batch of `user_id`s to display names for the admin lists that otherwise render
        raw UUIDs — จัดการงาน/jobs (guard_id + customer_id), รีวิว/reviews (guard_id + customer_id),
        บันทึกการโทร/calls (caller + callee), and the Activity Log (admin user_id). **Admin only**
        (role gate at the gateway-routed edge + this service; non-admin → **403**).

        profile OWNS the guard/customer display names (`guard_profiles.full_name` /
        `customer_profiles.full_name`), answered in ONE query. For the ids it CAN'T resolve locally
        (almost always ADMINS — who have no profile row here — or unknown/deleted ids) it then asks
        identity's service-JWT'd `POST /internal/users/names` and MERGES the admin `{ role: admin,
        display_name }` entries into the same map (#142 Activity Log). Best-effort: an identity
        outage degrades to "admin ids omitted" (client fallback) rather than failing the resolve.

        The response is a MAP keyed by id → `{ role, display_name }`:
          - a guard/customer id resolves to its name + the role derived from which table it is in
            (`display_name` may be `null` mid-onboarding — the role is still authoritative);
          - an admin id resolves to `{ role: admin, display_name }` merged from identity;
          - an id with NO row in EITHER place (genuinely unknown / deleted) is simply **OMITTED**
            from the map — the client renders a fallback (role label + short id) for it.

        Returns ONLY `{ role, display_name }` — NEVER any other PII (phone / bank / address / email).
        Bounded to `RESOLVE_NAMES_LIMIT` (500) ids per call — a larger batch → **400** (page it),
        not a silent truncation (a partial map is indistinguishable from "these ids are unknown").
        Duplicate ids are de-duplicated server-side; an empty `ids` list → an empty map (`{}`).
      operationId: adminResolveUserNames
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveNamesRequest' }
      responses:
        '200':
          description: |
            A map keyed by the resolved id. Ids with no profile row (admins, unknown/deleted) are
            omitted — the client falls back to a role label + short id for those.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { $ref: '#/components/schemas/ResolvedName' }
                        description: id (uuid string) → resolved name. Unknown ids are omitted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /support/tickets:
    post:
      tags: [Profile]
      summary: File a support ticket (any signed-in user)
      description: |
        The mobile Help page ("แจ้งปัญหา / ส่งความคิดเห็น") POSTs a support ticket here. The
        reporter is the AUTHENTICATED user (the caller), never taken from the body — a user can
        only file on their own behalf — so this is open to ANY signed-in role (guard/customer/
        admin). `kind` must be `problem` or `feedback`; `message` is the free-text body,
        non-empty and ≤ 2000 chars (trimmed before storage). An invalid kind / empty / over-long
        message is a typed **400**. The stored ticket (id, status `open`, created_at) is returned
        for the client's success state; an admin reads the queue via `GET /admin/support/tickets`.
      operationId: createSupportTicket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportTicketRequest' }
      responses:
        '200':
          description: The created support ticket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/support/tickets:
    get:
      tags: [Admin]
      summary: List support tickets, newest first (role=admin)
      description: |
        The admin queue of support tickets filed from the mobile Help page — newest first
        (`created_at DESC`), limit/offset paged. Admin only (else **403**). Each row carries the
        reporter's `user_id`; the web admin maps it to a display name with the existing batch
        name-resolver (`POST /admin/users/resolve`). Replica read.
      operationId: adminListSupportTickets
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Support tickets, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SupportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/documents/expiring:
    get:
      tags: [Admin]
      summary: List guard documents needing renewal + urgency buckets (role=admin)
      description: |
        Guard documents expiring within the `window` (days; INCLUDING already-expired), soonest
        first — each carrying `days_left` (negative = expired). The response also returns
        window-INDEPENDENT `buckets` (expired / due_7 / due_30 / due_90) for the dashboard pills,
        so the counts don't change as the admin narrows the list. Admin only (else 403); replica
        read. Rows are populated by the guard profile submit (`POST /profile/guard`, which folds
        in the registration doc step's expiry dates) — empty until that capture lands.
      operationId: adminListExpiringDocuments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: window
          in: query
          required: false
          description: List filter (days). One of 7, 30, 90 (default 90). Any other value → 400.
          schema: { type: integer, enum: [7, 30, 90], default: 90 }
      responses:
        '200':
          description: Expiring guard documents (filtered to the window, soonest first) + buckets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpiringDocumentsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applicants/pending-count:
    get:
      tags: [Admin]
      summary: Count guards + customers awaiting approval (role=admin)
      description: |
        New-applicants count for the dashboard notification card + the ผู้สมัคร page (#132): how
        many guards AND customers are pending admin approval (`approval_status = 'pending'`), plus
        the total. Both roles now share the same admin-review gate (customers are no longer
        auto-approved), so the per-role split drives the page's two tabs and `total` is the badge.
        Admin only (else 403); replica read.
      operationId: adminPendingApplicantsCount
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pending-applicant counts (guards, customers, total)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PendingApplicantsCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applicants/avg-approval-time:
    get:
      tags: [Admin]
      summary: Average guard approval turnaround (role=admin)
      description: |
        เวลาอนุมัติเฉลี่ย (#132): the mean of `reviewed_at - created_at` over APPROVED guards, in
        seconds + a pre-rounded hours value, with the `sample_size`. `avg_seconds`/`avg_hours` are
        `null` (and `sample_size` 0) when no guard has been approved yet — an honest empty state,
        not a fake 0h. `reviewed_at` is the dedicated approval-decision timestamp (never clobbered
        by a guard self-edit). Admin only (else 403); replica read.
      operationId: adminAvgApprovalTime
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Average approval time over approved guards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AvgApprovalTime' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/recruitment/candidates:
    get:
      tags: [Admin]
      summary: List guards as recruitment-pipeline candidates (role=admin)
      description: |
        Every guard as a lean pipeline candidate (no PII). The kanban groups pending guards by
        `recruitment_stage` (sourcing/screened/docs_verified) and finalized ones by
        `approval_status` — approve/reject reuse the existing guard-profile endpoints. Admin only.
      operationId: adminListCandidates
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pipeline candidates, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RecruitCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/recruitment/candidates/{user_id}/stage:
    put:
      tags: [Admin]
      summary: Move a pending candidate to a pipeline stage (role=admin)
      description: |
        Sets a PENDING guard's pre-approval `recruitment_stage`. A finalized (approved/rejected)
        candidate returns 409 — they leave the pipeline via approval_status, not this. An unknown
        stage returns 400. Admin only. This stage gates nothing (it's admin-workflow metadata).
      operationId: adminSetCandidateStage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageRequest' }
      responses:
        '200':
          description: The updated candidate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecruitCandidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/guard-profiles/{user_id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending guard profile (role=admin)
      description: |
        Moves the guard profile `pending → approved` via the pure approval transition.
        Approved is terminal: re-approving or moving an already-finalized profile returns
        409. Admin only (else 403). Returns the updated profile (FULL account number).
      operationId: adminApproveGuard
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/GuardProfileFullOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/guard-profiles/{user_id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending guard profile (role=admin)
      description: |
        Moves the guard profile `pending → rejected` via the pure approval transition. May
        carry an optional `reason`. Rejected is terminal (409 on a finalized profile). Admin
        only (else 403). Returns the updated profile (FULL account number).
      operationId: adminRejectGuard
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/GuardProfileFullOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/customer-profiles/{user_id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending customer profile (role=admin)
      description: |
        Moves the customer profile `pending → approved` via the pure approval transition
        (the customer mirror of the guard approve). Emits `user.approved` (transactional
        outbox) so identity unblocks the customer's login. Approved is terminal: re-approving
        or moving an already-finalized profile returns 409. Admin only (else 403). Returns the
        updated customer profile.
      operationId: adminApproveCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/CustomerProfileOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/customer-profiles/{user_id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending customer profile (role=admin)
      description: |
        Moves the customer profile `pending → rejected` via the pure approval transition (the
        customer mirror of the guard reject). May carry an optional `reason`. Rejected is
        terminal (409 on a finalized profile). Admin only (else 403). Returns the updated
        customer profile.
      operationId: adminRejectCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/CustomerProfileOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/guards:
    get:
      tags: [Admin]
      summary: Approved guard catalog (service-to-service)
      description: |
        Internal read for booking's discovery (`/available-guards`) — the APPROVED guard
        catalog. Guarded by a **service-JWT** (`ServiceCaller`), never reachable from the
        public edge (the gateway blocks `/internal/`). Returns ONLY `{ user_id,
        years_of_experience }` — least-privilege; the PDPA-sensitive bank/PII columns never
        cross the wire. Documented here for the contract; not part of the user-facing client.
      operationId: internalListGuards
      security: [{ serviceAuth: [] }]
      responses:
        '200':
          description: The approved guard catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InternalGuard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/users/{user_id}/export:
    get:
      tags: [Admin]
      summary: PDPA data export aggregation (service-to-service)
      description: |
        Internal read for identity's `ExportClient` fan-out — aggregates this service's slice
        of a user's PDPA data export. Guarded by a **service-JWT** (`serviceAuth`, aud
        `pguard-internal`), never reachable from the public edge (the gateway blocks
        `/internal/`). Returns this service's per-user export blob (an opaque object).
      operationId: internalExportUser
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: This service's per-user export blob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/users/{user_id}/pending-roles:
    get:
      tags: [Admin]
      summary: Roles with a submitted-but-pending profile (service-to-service)
      description: |
        Internal read for identity: the roles this user has SUBMITTED a profile for that are NOT
        yet approved (`approval_status = 'pending'` in `guard_profiles`/`customer_profiles`).
        identity calls this (over a **service-JWT**, `serviceAuth`, blocked at the public edge) to
        enrich `GET /auth/me` with `pending_roles`, so the mobile mode-picker shows a submitted role
        as "pending approval" instead of re-offering its blank registration form. Returns `[]` when
        nothing is pending.
      operationId: internalPendingRoles
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The roles awaiting approval for this user (`[]` when none)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-JWT (aud=pguard-internal); internal endpoints only.
    profileToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Single-use, purpose-scoped profile-submission token (`guard_profile` /
        `customer_profile`) issued by `POST /auth/register` and presented as
        `Authorization: Bearer <profile_token>`. Consumed single-use (Redis GETDEL) and
        purpose-isolated to its matching route. Used during initial registration when the
        user is not yet logged in; signed with the same `JWT_SECRET` as access tokens but
        carries a `purpose` claim and no iss/aud, so it is never accepted as an access token.

  responses:
    GuardProfileOk:
      description: The caller's guard profile (account number MASKED to last 4).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/GuardProfile' }
    GuardProfileSubmitOk:
      description: |
        Registration profile submit: the masked guard profile PLUS a short-lived, MULTI-use
        `doc_upload_token`. The client uploads credential images with this token (Bearer) at
        `POST /profile/guard/{user_id}/documents` immediately after — BEFORE approval — so an admin
        can review the documents when deciding. The token is own-scoped and expires in ~30 min.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/GuardProfile'
                      - type: object
                        required: [doc_upload_token]
                        properties:
                          doc_upload_token:
                            type: string
                            description: Short-lived (~30 min) Bearer token for credential-image uploads.
    GuardProfileFullOk:
      description: The guard profile (FULL account number — admin response).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/GuardProfile' }
    CustomerProfileOk:
      description: The caller's customer profile.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/CustomerProfile' }
    BadRequest:
      description: Validation error (bad field value, unknown filter)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but wrong role for this endpoint
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Illegal approval transition (target state not reachable)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
      description: Guard onboarding approval lifecycle (mirrors shared::models::ApprovalStatus).

    UpsertGuardProfileRequest:
      type: object
      description: All fields optional — a guard fills the profile across an onboarding flow.
      properties:
        full_name: { type: string, nullable: true, description: 'Guard full name (v1 parity).' }
        gender: { type: string, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true, description: 'ISO YYYY-MM-DD.' }
        years_of_experience: { type: integer, format: int32, nullable: true, minimum: 0, maximum: 80 }
        previous_workplace: { type: string, nullable: true }
        bank_name: { type: string, nullable: true }
        account_number: { type: string, nullable: true, description: 'Stored in full; masked on owner reads (PDPA).' }
        account_name: { type: string, nullable: true }
        address: { type: string, nullable: true, description: 'Home address (v1 parity).' }
        emergency_contact_name: { type: string, nullable: true }
        emergency_contact_phone: { type: string, nullable: true, description: 'Thai national format (≥10 digits, leading 0).' }
        emergency_contact_relationship: { type: string, nullable: true }
        document_expiries:
          type: array
          nullable: true
          description: |
            OPTIONAL per-document expiry dates from the registration doc step. Captured
            best-effort into the document_expiry table (feeds the admin "expiring" surface); the
            guard_profiles columns are unaffected.
          items: { $ref: '#/components/schemas/DocumentExpiryInput' }

    UpsertCustomerProfileRequest:
      type: object
      properties:
        full_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        email: { type: string, nullable: true, description: 'Validated: contains @ and ., length ≥ 5.' }
        contact_phone: { type: string, nullable: true, description: 'Thai national format (≥10 digits, leading 0).' }

    RejectRequest:
      type: object
      properties:
        reason: { type: string, nullable: true, description: 'Optional context for the rejection.' }

    UpdateOrgSettingsRequest:
      type: object
      description: |
        The org (company) profile body for `PUT /admin/org-settings`. All fields optional (the
        admin saves incrementally). `tax_id` is validated leniently (8–20 digits, spaces/hyphens
        allowed — not a checksum); `company_name`/`address` are bounded to 500 chars. Sending
        `null` CLEARS a field — which also removes it from every receipt issued afterwards.
      properties:
        company_name:
          type: string
          nullable: true
          maxLength: 500
          description: 'Legal entity name as registered — the issuer line of the tax invoice (ผู้ประกอบการ).'
        tax_id:
          type: string
          nullable: true
          description: '8–20 digits (spaces/hyphens allowed); a Thai TIN is 13 digits. Legally required on a full tax invoice.'
        address:
          type: string
          nullable: true
          maxLength: 500
          description: 'Registered address of the issuer — legally required on a full tax invoice.'

    OrgSettings:
      type: object
      description: |
        The org (company) profile shown on receipts + in-app. These three fields are the SELLER
        block a Thai full tax invoice (ใบกำกับภาษีแบบเต็มรูป) must carry: issuer name, TIN and
        registered address. Every field is nullable: an all-null object (incl. `updated_at`) is
        the "never saved yet" state returned by GET — and any receipt issued in that state is
        missing its legally-required issuer block.
      properties:
        company_name: { type: string, nullable: true, description: 'Issuer''s legal name on the tax invoice; null = never filled in.' }
        tax_id: { type: string, nullable: true, description: 'Issuer''s TIN (Thai: 13 digits); null = never filled in.' }
        address: { type: string, nullable: true, description: 'Issuer''s registered address; null = never filled in.' }
        updated_at: { type: string, format: date-time, nullable: true, description: 'When last saved; null until first written.' }

    InternalGuard:
      type: object
      description: |
        The lean approved-guard row for internal discovery — deliberately NARROW (no bank/PII;
        least-privilege over the service-to-service wire). `full_name`/`avatar_url` power the
        customer's guard-selection card (the same approved-guard exposure as
        `GET /guards/{id}/public`; `avatar_url` is presigned by profile). `has_documents` is a
        profile-derived boolean — all five credential documents (id card, security license,
        training cert, criminal check, driver license) on file — so the customer card can show
        WHETHER documents exist; the documents themselves never cross this wire.
      required: [user_id, has_documents, documents]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true, description: 'Presigned GET URL for the guard''s avatar (expires in ~1h), or null when unset.' }
        years_of_experience: { type: integer, format: int32, nullable: true }
        has_documents: { type: boolean, description: 'True when all five credential documents are on file (derived; passbook excluded).' }
        documents: { $ref: '#/components/schemas/GuardDocumentPresence' }

    GuardDocumentPresence:
      type: object
      description: >
        Per-credential PRESENCE (has / doesn''t-have) for the five customer-relevant credential
        documents. Booleans ONLY — a `true` means the document is on record; the file bytes never
        cross the wire (they stay owner/admin-only). Passbook is excluded (banking, not a credential).
      required: [id_card, security_license, training_cert, criminal_check, driver_license]
      properties:
        id_card: { type: boolean }
        security_license: { type: boolean }
        training_cert: { type: boolean }
        criminal_check: { type: boolean }
        driver_license: { type: boolean }

    PublicGuardProfile:
      type: object
      description: |
        The lean, customer-facing guard mini-profile for the live-tracking map. NARROW by design —
        only what identifies the assigned guard (name + experience + photo); NEVER bank/address/DOB/
        emergency-contact PII. `full_name` is reachable by a non-owner ONLY under the active-booking
        IDOR gate (see `GET /guards/{id}/public`). `avatar_url` is a short-lived presigned GET URL
        (the raw S3 key is never on the wire), `null` when the guard has not set a photo — the same
        exposure discovery makes of the chosen guard.
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        years_of_experience: { type: integer, format: int32, nullable: true }
        avatar_url: { type: string, nullable: true, description: 'Presigned GET URL for the guard''s avatar (expires in ~1h), or null when unset.' }

    PublicCustomerProfile:
      type: object
      description: |
        The lean, GUARD-facing customer mini-profile — the mirror of `PublicGuardProfile` for the
        other direction. NARROW by design: only the customer's name + photo (so the guard's job
        sheet can address them by name and show their face); NEVER the address/company/email/phone
        PII. `full_name` is reachable by any guard-role caller — from the job offer onwards, per
        the 2026-07-11 product decision (see `GET /customers/{id}/public`). `avatar_url` is a
        short-lived presigned GET URL (the raw S3 key is never on the wire), `null` when the
        customer has not set an avatar.
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true, description: 'Presigned GET URL for the customer''s avatar (expires in ~1h), or null when unset.' }

    ResolveNamesRequest:
      type: object
      description: |
        A batch of user_ids to resolve to display names (admin lists). Duplicates are
        de-duplicated server-side; an empty list returns an empty map. Bounded to 500 ids per
        call (a larger batch → 400 — page the calls).
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
          description: The user_ids to resolve.

    ResolvedName:
      type: object
      description: |
        One resolved identity for the admin name-resolver: a display name (admin-only PII here) +
        the role it was resolved as. NEVER any other PII. `display_name` is `null` when the row
        exists but has no name yet (mid-onboarding) — the role is still authoritative.

        `role` is `guard` / `customer` (from profile's own tables) OR `admin`: profile merges ADMIN
        names from identity's service-JWT'd `POST /internal/users/names` (admins have no profile row
        here — their name lives only in identity). An id with no row in EITHER place (genuinely
        unknown / deleted) is still OMITTED from the response map; the client uses a role-label
        fallback for it.
      required: [role]
      properties:
        role:
          type: string
          enum: [guard, customer, admin]
          description: |
            The role this id was resolved as — `guard` / `customer` from profile's tables, or
            `admin` merged from identity.
        display_name: { type: string, nullable: true, description: 'The user''s full name, or null if not set yet.' }

    GuardDocumentResponse:
      type: object
      description: |
        The result of a guard-document upload/read: the canonical document type + a short-lived
        (1h) presigned GET URL for the stored image. The raw S3 key is NEVER exposed.
      required: [document_type, download_url]
      properties:
        document_type: { type: string }
        download_url: { type: string, description: 'Presigned GET URL (expires in ~1h).' }

    GuardAvatarResponse:
      type: object
      description: |
        The result of a guard avatar upload/read: a short-lived (1h) presigned GET URL for the
        stored profile picture. The raw S3 key is NEVER exposed.
      required: [avatar_url]
      properties:
        avatar_url: { type: string, description: 'Presigned GET URL (expires in ~1h).' }

    CustomerAvatarResponse:
      type: object
      description: |
        The result of a customer avatar upload/read: a short-lived (1h) presigned GET URL for the
        stored profile picture. The MIRROR of `GuardAvatarResponse`. The raw S3 key is NEVER exposed.
      required: [avatar_url]
      properties:
        avatar_url: { type: string, description: 'Presigned GET URL (expires in ~1h).' }

    GuardDocumentExpiry:
      type: object
      description: One credential's expiry date (owner/admin view + edit).
      required: [document_type, expiry_date]
      properties:
        document_type: { type: string, example: id_card }
        expiry_date: { type: string, format: date, example: '2027-06-16' }

    SetDocumentExpiryRequest:
      type: object
      required: [document_type, expiry_date]
      properties:
        document_type:
          type: string
          description: An expiring credential (id_card / security_license / training_cert / criminal_check / driver_license).
        expiry_date: { type: string, format: date }

    GuardProfile:
      type: object
      required: [user_id, approval_status]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true, description: 'Guard full name (v1 parity).' }
        gender: { type: string, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        years_of_experience: { type: integer, format: int32, nullable: true }
        previous_workplace: { type: string, nullable: true }
        bank_name: { type: string, nullable: true }
        account_number:
          type: string
          nullable: true
          description: |
            MASKED to its last 4 characters on the owner read (`GET /profile/me`,
            `POST/PUT /profile/guard`); FULL on the admin endpoints.
        account_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        emergency_contact_name: { type: string, nullable: true }
        emergency_contact_phone: { type: string, nullable: true }
        emergency_contact_relationship: { type: string, nullable: true }
        approval_status: { $ref: '#/components/schemas/ApprovalStatus' }

    GuardProfileAdmin:
      description: |
        A guard profile row as returned to an ADMIN (`GET /admin/guard-profiles` — the approval
        queue). Everything in the owner-facing `GuardProfile` (with the FULL account number) PLUS
        the two fields a reviewer needs to know WHO they are approving: `created_at` (when the
        person signed up) and `login_phone` (the number that person can actually be called on).
        A SEPARATE shape from `GuardProfile` so the owner-facing read stays additive-only and
        never carries the identity-owned phone.
      allOf:
        - $ref: '#/components/schemas/GuardProfile'
        - type: object
          required: [created_at]
          properties:
            created_at:
              type: string
              format: date-time
              description: 'Signup time (`guard_profiles.created_at`) — also the list''s order-by key.'
            login_phone: { $ref: '#/components/schemas/LoginPhone' }

    CustomerProfile:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        contact_phone:
          type: string
          nullable: true
          description: |
            OPTIONAL extra number the customer typed into their own profile (an office line, a
            site contact, a relative). Frequently blank, and not necessarily this person's own
            number — it is NOT the account's login phone. See `LoginPhone`.

    CustomerProfileAdmin:
      type: object
      description: |
        A customer profile row in the admin directory. Adds `created_at` (signup time / the
        list's order key), `approval_status` (the customer review queue's pending/approved
        filter) and `login_phone` (the account's own number, from identity) to the owner-facing
        shape. Customers are now admin-approved exactly like guards (no longer auto-approved on
        first profile insert); `approval_status` is owned on `profile.customer_profiles`.

        NOTE for consumers: `login_phone` and `contact_phone` are DIFFERENT numbers. Reading
        `contact_phone` as "the applicant's phone" is what left the approval queue showing a bare
        short id and a "—" contact for a real, reachable person.
      required: [user_id, created_at, approval_status]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        contact_phone:
          type: string
          nullable: true
          description: |
            OPTIONAL extra number the customer typed into their own profile (an office line, a
            site contact, a relative). Frequently blank, and not necessarily this person's own
            number — it is NOT the account's login phone. Use `login_phone` to reach the
            applicant; show `contact_phone` only as an additional detail.
        login_phone: { $ref: '#/components/schemas/LoginPhone' }
        created_at: { type: string, format: date-time, description: 'Signup time — also the list''s order-by key.' }
        approval_status: { $ref: '#/components/schemas/ApprovalStatus' }

    LoginPhone:
      type: string
      nullable: true
      description: |
        The ACCOUNT'S OWN phone number — `identity.users.phone`, the number this person registered
        with and signs in with (it is the OTP login key, so every live account has exactly one and
        it is always present). Resolved per request from identity's service-JWT'd
        `POST /internal/users/names`; `null` ONLY when identity is unreachable or the account no
        longer exists — never for a healthy row.

        NOT to be confused with `contact_phone` on a customer profile, which is an OPTIONAL extra
        the customer may type in (often blank, and may be a third party's number), nor with a
        guard's `emergency_contact_phone`. When an admin needs to CALL an applicant, this is the
        number. Admin-surface PII: never log it or expose it outside the admin SPA.

    AccessAuditEntry:
      type: object
      description: One PDPA §30 data-access audit row (who accessed what PII, and when).
      required: [id, accessed_by, action, accessed_at]
      properties:
        id: { type: integer, format: int64 }
        accessed_by: { type: string, format: uuid }
        action: { type: string }
        target: { type: string, nullable: true }
        accessed_at: { type: string, format: date-time }

    CreateSupportTicketRequest:
      type: object
      description: |
        The mobile Help form body (`POST /support/tickets`). `kind` is the toggle (problem =
        แจ้งปัญหา, feedback = ส่งความคิดเห็น); `message` is the free-text body (non-empty,
        trimmed, ≤ 2000 chars). The reporter is NOT in the body — it is the authenticated caller.
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [problem, feedback]
          description: 'problem = report an issue; feedback = a suggestion/comment.'
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: 'The report body (1–2000 chars; trimmed server-side).'

    SupportTicket:
      type: object
      description: |
        One support ticket — returned to the reporter on create and to an admin in the newest-first
        list. `user_id` is the reporter (resolved to a display name by the admin name-resolver on
        the web side). `status` is `open` on creation (no triage workflow yet).
      required: [id, user_id, kind, message, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: 'The reporter (identity-owned id).' }
        kind: { type: string, enum: [problem, feedback] }
        message: { type: string }
        status: { type: string, description: 'Lifecycle state; `open` on creation.' }
        created_at: { type: string, format: date-time }

    DocumentExpiry:
      type: object
      description: |
        One guard-document expiry row (the admin "expiring documents" surface + the owner/admin
        per-guard list). `days_left = expiry_date - current_date` (computed in SQL): negative =
        already expired, 0 = due today, positive = days until it lapses.
      required: [id, guard_id, document_type, expiry_date, days_left]
      properties:
        id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid }
        document_type:
          type: string
          enum: [id_card, security_license, training_cert, criminal_check, driver_license]
        expiry_date: { type: string, format: date }
        days_left: { type: integer, format: int32, description: 'expiry_date − current_date (days; negative = expired).' }
        last_reminded_at: { type: string, format: date-time, nullable: true }

    ExpiringDocumentBuckets:
      type: object
      description: |
        Disjoint urgency-band counts over ALL recorded expiries (window-independent — the
        dashboard pills don't change as the list filter narrows). Bands by `days_left`:
        expired (<0), due_7 (0..=7), due_30 (8..=30), due_90 (31..=90).
      required: [expired, due_7, due_30, due_90]
      properties:
        expired: { type: integer, format: int64 }
        due_7: { type: integer, format: int64 }
        due_30: { type: integer, format: int64 }
        due_90: { type: integer, format: int64 }

    ExpiringDocumentsResponse:
      type: object
      description: |
        The admin expiring-documents payload: the `documents` list (filtered to the requested
        `window`, soonest first) plus the window-independent `buckets`.
      required: [documents, buckets]
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentExpiry' }
        buckets: { $ref: '#/components/schemas/ExpiringDocumentBuckets' }

    PendingApplicantsCount:
      type: object
      description: |
        Counts of guards + customers awaiting admin approval (the dashboard new-applicants badge +
        the ผู้สมัคร page tabs). `total = guards + customers`.
      required: [guards, customers, total]
      properties:
        guards: { type: integer, format: int64 }
        customers: { type: integer, format: int64 }
        total: { type: integer, format: int64 }

    AvgApprovalTime:
      type: object
      description: |
        Average guard approval turnaround (mean of `reviewed_at − created_at` over APPROVED
        guards). `avg_seconds`/`avg_hours` are null (and `sample_size` 0) when none approved yet.
      required: [sample_size]
      properties:
        avg_seconds: { type: integer, format: int64, nullable: true, description: 'Mean approval duration in seconds (null when no approvals yet).' }
        avg_hours: { type: number, format: double, nullable: true, description: 'Same value in hours, rounded to 1 decimal (null when no approvals yet).' }
        sample_size: { type: integer, format: int64, description: 'Number of approved guards the average is over.' }

    DocumentExpiryInput:
      type: object
      description: |
        One document's expiry date, folded into the guard-profile submit (the registration doc
        step). Metadata only — no image. The passbook is NOT an expiring credential and is
        excluded. An unknown type or a non-future date is skipped server-side (best-effort).
      required: [document_type, expiry_date]
      properties:
        document_type:
          type: string
          enum: [id_card, security_license, training_cert, criminal_check, driver_license]
        expiry_date:
          type: string
          format: date
          description: Must be in the future (a renewal date).

    RecruitCandidate:
      type: object
      description: A guard in the recruitment pipeline (lean projection — no PII).
      required: [user_id, approval_status, recruitment_stage]
      properties:
        user_id: { type: string, format: uuid }
        years_of_experience: { type: integer, format: int32, nullable: true }
        approval_status: { $ref: '#/components/schemas/ApprovalStatus' }
        recruitment_stage:
          type: string
          enum: [sourcing, screened, docs_verified]

    StageRequest:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum: [sourcing, screened, docs_verified]

    MyProfile:
      oneOf:
        - $ref: '#/components/schemas/MyGuardProfile'
        - $ref: '#/components/schemas/MyCustomerProfile'
      discriminator:
        propertyName: kind
      description: |
        The caller's own profile, tagged by `kind`. A guard sees `MyGuardProfile` (masked
        account number); a customer sees `MyCustomerProfile`.

    MyGuardProfile:
      allOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [guard] }
        - $ref: '#/components/schemas/GuardProfile'

    MyCustomerProfile:
      allOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [customer] }
        - $ref: '#/components/schemas/CustomerProfile'

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FORBIDDEN }
        message: { type: string }
