openapi: 3.1.0
info:
  title: pguard — Presence Service API
  version: 0.1.0
  description: |
    v2 OpenAPI contract for the presence service (source of truth — codegen produces Rust
    handler stubs/types, the Dart client, the TS client). presence owns real-time guard GPS:
    a WebSocket ingress (`/ws/track`, see `contracts/asyncapi/presence-ws.yaml`), the
    current-position store, online status, and these IDOR-safe read APIs. The append-only
    `location_history` is SENSITIVE GPS under a 90-day PDPA retention purge
    (`v1-audit/07-pdpa.md` §7.1/§7.3).

    v2 authz rules baked into the contract:
      1. **Bulk is admin-only.** `GET /locations` returns every guard's live position — a
         customer can NEVER pull bulk locations.
      2. **Per-guard reads are IDOR-gated.** A customer may read a specific guard's location /
         history ONLY while they have an **active booking** with that guard (derived from
         `pguard.events.booking.*` — presence holds no cross-service FK and makes no synchronous
         cross-schema read). A guard may read its own; an admin may read any.
      3. **Offerability vs freshness — three DIFFERENT signals, never conflate them.**
         * `available_for_work` — the guard switched "พร้อมรับงาน" ON, declared on the tracking
           WebSocket (`{"type":"availability"}`) and scoped to that session. This ALONE decides
           whether a guard appears in the customer's guard-selection list. A guard streaming GPS
           for an ACTIVE JOB with the toggle off is connected but NOT offerable — before this
           existed, offerability keyed on "a GPS fix arrived", which put such guards in front of
           customers (QA 08/09/2569).
         * SESSION liveness — the server has heard SOMETHING from the socket (fix, keep-alive or
           Pong) within 2 minutes. Expires rows a presence crash/redeploy stranded as online, and
           is why the read DTOs' `is_online` is computed, not a raw column read.
         * GPS freshness — `is_live`, the green-dot DISPLAY signal
           (`is_online AND recorded_at > now() - interval '5 minutes'`). It gates NOTHING: the
           mobile uplink is movement-gated, so a stationary available guard's last fix ages past
           the window while their socket is perfectly healthy.
         Discovery OFFERABILITY (`/internal/online-guards`) = availability AND session liveness.

    Client-facing paths are served behind the gateway under `/v1`. Success responses use the
    standard `{ success, data }` envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3009
    description: Local dev (presence-service direct)

tags:
  - name: Locations
    description: Live guard locations + history (IDOR-safe reads)

paths:
  /locations:
    get:
      tags: [Locations]
      summary: List live guard locations (admin only)
      description: |
        Returns the current position of every guard with a recorded location. **Admin only** —
        a guard or customer receives `403` (no bulk pull). `is_live` reflects the 5-minute
        freshness rule; `?online_only=true` restricts the result to currently-connected guards.
      operationId: listLocations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: online_only
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, only guards with `is_online = true` are returned.
      responses:
        '200': { $ref: '#/components/responses/LocationsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /guards/{id}/location:
    get:
      tags: [Locations]
      summary: Get a guard's latest location (own / active-booking customer / admin)
      description: |
        Latest known position for guard `{id}`. Authz: the guard may read its own; an admin any;
        a customer ONLY with an active booking with that guard (else `403` — no probing unrelated
        guards). `404` if the guard has no recorded location.
      operationId: getGuardLocation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GuardId'
      responses:
        '200': { $ref: '#/components/responses/LocationOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /guards/{id}/history:
    get:
      tags: [Locations]
      summary: Get a guard's location history (own / active-booking customer / admin)
      description: |
        Paginated GPS history for guard `{id}`, newest first (older than the 90-day PDPA
        retention window is purged). Same IDOR authz as `/guards/{id}/location`.
      operationId: getGuardHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GuardId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, default: 100, minimum: 1, maximum: 1000 }
          description: Max points (default 100, capped at 1000).
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, default: 0, minimum: 0 }
          description: Pagination offset.
      responses:
        '200': { $ref: '#/components/responses/HistoryOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/track/replay:
    get:
      tags: [Locations]
      summary: Admin route playback — by job (booking) or by guard + time range (#141)
      description: |
        **Admin only.** Returns a guard's GPS track, OLDEST-first (a replay plays forward in
        time), in ONE of two mutually-exclusive modes (provide exactly one selector → else `400`):

          - **by JOB** — `?booking_id=<uuid>`. The window is derived SERVER-SIDE from the
            event-projected assignment: `started_at` = the `job_accepted` event, `ended_at` = the
            terminal event (`completed`/`cancelled`/`declined`), or `now()` while the job is still
            active (`window_open=true`). The guard is the one the booking was assigned to.
            `guard_id`/`from`/`to` are ignored. `404` if the booking was never projected (unknown
            id, or a booking with no recorded start/guard).
          - **by GUARD** — `?guard_id=<uuid>&from=&to=`. That guard's track in the half-open
            `[from, to)` window. `from`/`to` are optional (default: the last 24h ending now); the
            span is clamped to 90 days (the retention horizon).

        `limit` caps the points (default **500** — the #141 cap; hard max **1000**). `truncated`
        is `true` when the window holds at least `limit` points (narrow the window or raise `limit`
        to the cap to see the rest). Each point carries its `recorded_at` timestamp.

        **Per-point speed/heading are NOT returned** — `per_point_speed_heading_available` is
        always `false`. The append-only `location_history` store keeps only lat/lng/accuracy + time;
        heading/speed are live-only signals (never historized). Flagged, not fabricated.

        Reads from the read replica (heavy history scan; admin authz enforced first).
      operationId: adminTrackReplay
      security: [{ bearerAuth: [] }]
      parameters:
        - name: booking_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: By-JOB selector. Derives the window from the booking's assignment. Mutually exclusive with `guard_id`.
        - name: guard_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: By-GUARD selector. Mutually exclusive with `booking_id`.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: By-GUARD window start (RFC3339, inclusive). Default `to - 24h`. Ignored in by-JOB mode.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: By-GUARD window end (RFC3339, exclusive). Default now. Ignored in by-JOB mode.
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, default: 500, minimum: 1, maximum: 1000 }
          description: Max points (default 500, capped at 1000).
      responses:
        '200': { $ref: '#/components/responses/TrackReplayOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/online-guards:
    get:
      tags: [Locations]
      summary: Live guards + positions (service-to-service)
      description: |
        Internal read for booking's discovery (`/available-guards`) — the guards who are
        currently OFFERABLE, each with their LATEST fix position. Membership is
        `available_for_work AND is_online AND` session liveness (see the rule in `info`):

          * the guard DECLARED "พร้อมรับงาน" on their tracking session — the hard product rule
            ("Guard ที่ยังไม่ได้เปิด Online Status ต้องไม่แสดงอยู่ในหน้าเลือก Guard"). Merely
            holding a GPS socket, e.g. to let a customer watch an active job, does NOT qualify.
          * that session has been heard from in the last 2 minutes, so rows stranded by a
            presence crash/redeploy expire on their own.

        Still deliberately NOT gated on GPS freshness: the mobile uplink is movement-gated, so a
        stationary available guard's last fix ages past the freshness window while its socket
        stays up, and a freshness gate here would drop a connected, willing guard from discovery
        (bug B). Session liveness keys on the last FRAME, which keep-alives advance; GPS freshness
        survives only as the green-dot `is_live` DISPLAY on the read DTOs.

        Guarded by a **service-JWT** (`serviceAuth`, aud `pguard-internal`), never reachable from
        the public edge (the gateway blocks `/internal/`). booking uses membership for the
        availability filter AND the coordinates to sort the customer's list nearest-to-meetup
        (C2); an error from this read makes discovery FAIL CLOSED (`503 PRESENCE_UNAVAILABLE`),
        never fall back to an unfiltered list. Narrow projection — id + position only, none of the
        heading/speed/accuracy the admin `/locations` bulk read carries (least-privilege).
      operationId: internalOnlineGuards
      security: [{ serviceAuth: [] }]
      responses:
        '200':
          description: The currently-live guards with their latest positions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OnlineGuards' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web; for WS, Bearer on the upgrade request only.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-JWT (aud=pguard-internal); internal endpoints only.

  parameters:
    GuardId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    LocationsOk:
      description: Live guard locations
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GuardLocation' }
    LocationOk:
      description: A guard's latest location
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/GuardLocation' }
    HistoryOk:
      description: A guard's location history (newest first)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryPoint' }
    TrackReplayOk:
      description: A guard's GPS track for the replay (oldest-first)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/TrackReplay' }
    BadRequest:
      description: Invalid request (e.g. neither or both of booking_id/guard_id supplied)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Forbidden:
      description: Authenticated but not authorized (wrong role, or no active booking with the guard)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    NotFound:
      description: No location recorded for the guard
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }

  schemas:
    GuardLocation:
      type: object
      required: [guard_id, lat, lng, recorded_at, is_online, is_live, available_for_work]
      properties:
        guard_id: { type: string, format: uuid }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracy: { type: number, format: float, nullable: true, description: Metres. }
        heading: { type: number, format: float, nullable: true, description: Degrees, 0..360. }
        speed: { type: number, format: float, nullable: true, description: m/s. }
        recorded_at: { type: string, format: date-time }
        is_online:
          type: boolean
          description: |
            A live WS session is currently connected — COMPUTED as the stored flag AND session
            liveness (last frame within 2 minutes), not a raw column read, so a session stranded
            by a presence crash/redeploy is reported as disconnected rather than as still online.
        is_live:
          type: boolean
          description: |
            Green-dot GPS freshness — `is_online AND recorded_at` within the last 5 minutes.
            DISPLAY only: it does not decide who is offered to customers.
        available_for_work:
          type: boolean
          description: |
            The guard switched "พร้อมรับงาน" ON for this session. This — not `is_online` — is what
            puts the guard in the customer's guard-selection list; a guard streaming GPS for an
            active job is `is_online: true, available_for_work: false`.

    HistoryPoint:
      type: object
      required: [lat, lng, recorded_at]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracy: { type: number, format: float, nullable: true }
        recorded_at: { type: string, format: date-time }

    TrackReplay:
      type: object
      required: [guard_id, from, to, window_open, points, limit, truncated, per_point_speed_heading_available]
      properties:
        guard_id:
          type: string
          format: uuid
          description: The guard whose track this is (resolved from the booking in by-JOB mode).
        booking_id:
          type: string
          format: uuid
          description: Present only in by-JOB mode — the booking the window was derived from.
        from: { type: string, format: date-time, description: Window start (inclusive). }
        to: { type: string, format: date-time, description: Window end (exclusive). }
        window_open:
          type: boolean
          description: >
            by-JOB only — true when the job is still active (no terminal event yet), so `to` was
            clamped to the request time. Always false in by-GUARD mode.
        points:
          type: array
          description: The GPS track, OLDEST-first. Each point carries its `recorded_at`.
          items: { $ref: '#/components/schemas/HistoryPoint' }
        limit:
          type: integer
          format: int64
          description: The applied point cap (default 500, hard max 1000).
        truncated:
          type: boolean
          description: True when the window holds at least `limit` points (page/narrow to see more).
        per_point_speed_heading_available:
          type: boolean
          description: >
            Always false — `location_history` does not store per-point speed/heading (live-only
            signals, never historized). A FLAG, not a fabrication.

    OnlineGuards:
      type: object
      required: [guards]
      properties:
        guards:
          type: array
          description: Guards currently OFFERABLE for discovery (is_online alone, NOT freshness-gated), each with their latest fix position.
          items: { $ref: '#/components/schemas/OnlineGuard' }

    OnlineGuard:
      type: object
      required: [guard_id, lat, lng]
      description: One live guard — the id plus the latest fix coordinates (for the nearest-first sort).
      properties:
        guard_id: { type: string, format: uuid }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FORBIDDEN }
        message: { type: string }
