openapi: 3.1.0
info:
  title: pguard — Payment Service API
  version: 0.1.0
  description: |
    v2 OpenAPI contract for the payment service (the source of truth — codegen produces the
    Rust handler stubs/types, the Dart client, and the TS client). THE MONEY PATH.

    Split from the v1 `../guard-dispatch/services/booking` god-service. v2 is **PRE-PAY then
    SETTLE** — money rules baked into the contract:
      1. **PRE-PAY (createPayment).** After a guard ACCEPTS, the customer pays the ESTIMATE up
         front via `POST /payments { booking_id }`. The amount is computed SERVER-SIDE from the
         authoritative booking (`base_fee × hours × guard_count + tip`, read via the service-JWT'd
         `GET /internal/bookings/{id}`) — the client NEVER sends the amount. This payment GATES
         the booking's en_route transition (booking learns it is paid by consuming
         `pguard.events.payment.completed` → sets `paid_at`; en_route on an unpaid booking is a
         409 PAYMENT_REQUIRED).
      2. **Idempotent pre-pay.** At most ONE completed payment per booking (DB UNIQUE partial
         index + ON CONFLICT). A repeat `POST /payments` returns the existing payment and emits no
         second `payment.completed` — it never double-charges.
      3. **SETTLE on completion, for actual hours.** On `pguard.events.booking.completed` the
         payment service RECONCILES the actual-hours bill = the base
         (`base_fee × booked_hours × guard_count`) prorated to the hours actually worked PLUS the
         full flat tip, against the PRE-PAID amount: refund the overpay (emit
         `payment.refund_processed`) or record the shortfall. The base is NEVER double-charged.
         Booking's server-owned pricing rides the (HMAC-signed) completion event, so the settle is
         self-contained and never trusts a client value.
      4. **Exact money.** All amounts are decimal (`rust_decimal::Decimal` server-side),
         never float (serialized as JSON strings on the wire).
      5. **Transactional outbox.** The pre-pay writes the business row AND the `payment.completed`
         event row in ONE transaction (the settle writes the diff AND `payment.refund_processed`);
         a background relay publishes `pguard.events.payment.*` to NATS JetStream (see
         `contracts/asyncapi/events.yaml`).
      6. **Generic errors.** No enumeration / no internal leak.

    All client-facing paths are served behind the gateway under the `/v1` prefix
    (CLAUDE.md "API versioning"). Success responses use the standard `{ success, data }`
    envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3006
    description: Local dev (payment-service direct)

tags:
  - name: Payments
    description: Customer payments (pre-pay the estimate up front; the bill is settled on completion)

paths:
  /payments:
    post:
      tags: [Payments]
      summary: PRE-PAY a booking's estimate (createPayment)
      description: |
        After a guard ACCEPTS, the customer pays the ESTIMATE up front. The client sends ONLY the
        `booking_id`; the amount is computed SERVER-SIDE from the authoritative booking
        (`base_fee × hours × guard_count + tip`, read via the service-JWT'd internal booking read)
        — the client NEVER sends the amount. Authz: the caller must be the booking's customer and
        the booking must be in a payable state (post-accept, pre-complete) → else 403/409.

        This payment GATES the booking's en_route (booking consumes `payment.completed` → sets
        `paid_at`). Idempotent per booking: a repeat returns the existing payment (200), never a
        second charge.
      operationId: createPayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '200': { $ref: '#/components/responses/PaymentOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Payments]
      summary: List the caller's payments
      description: |
        Payments where the caller is the paying customer, newest first. v2 is POST-PAY: there is
        no customer-initiated charge endpoint — the bill is RAISED on completion by the
        `booking.completed` consumer (base prorated to the hours actually worked + the flat tip)
        and emitted as `pguard.events.payment.completed`. This list is how the customer sees what
        was billed.
      operationId: listPayments
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/earnings:
    get:
      tags: [Payments]
      summary: The assigned guard's earning basis (role=guard)
      description: |
        The caller's COMPLETED (paid) jobs, newest first, each with the clamped `actual_hours`
        ACTUALLY worked (persisted at reconcile; `null` for an even-match / not-yet-reconciled row).
        GUARD-ONLY (keyed on the JWT `sub` → the assigned guard). The guard app pairs each
        `booking_id` with the `base_fee` from its own booking feed and pays `base_fee × actual_hours`
        (falling back to the booked hours when `actual_hours` is null), so a job that finished early
        — and was overpay-refunded to the customer — pays the guard for the hours actually worked
        rather than the full booked estimate. Cancelled/withdrawn (refunded) jobs are excluded (the
        guard earned nothing there).
      operationId: listGuardEarnings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller-guard's completed-job earning rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GuardEarning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payments:
    get:
      tags: [Admin]
      summary: List ALL payments cross-user (role=admin, read-only ledger)
      description: |
        The admin payment ledger — every payment (NOT owner-scoped, unlike `GET /payments`),
        newest first, with optional `status` and `customer_id` filters + limit/offset. Admin
        only (else 403). READ ONLY because refunds LEAVE AS A BATCH, not because they are
        automatic: they are sent through `POST /admin/refunds/export` (one SCB upload file), which
        is also the only thing that advances a refund to `processed`. There is deliberately no
        per-row refund action on this ledger.
      operationId: adminListPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by payment status. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: customer_id
          in: query
          required: false
          description: Restrict to payments placed by this customer (the customer's spend history).
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: All matching payments, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/refunds/queue:
    get:
      tags: [Admin]
      summary: Refund queue — refunds awaiting action / in-progress (role=admin)
      description: |
        The admin refund queue — payments whose completion SETTLE left a refund owed
        (`refund_status` is set), newest first. Feeds the dashboard "แจ้งเตือน / คิวคืนเงิน" card.
        Optional `status` filter (`pending` = awaiting action, `processed` = done; omitted → both)
        + limit/offset. Returns the page of refund rows PLUS the total `count` matching the same
        filter (the badge count, independent of the page window). Admin only (else 403).

        READ ONLY, and LANE A only (`payment.payments`). The money actually leaves through
        `POST /admin/refunds/export`, which covers both lanes — the other being the duplicate-transfer
        `payment.payment_slips` row, which this queue has never listed. A settle only ever sets
        `refund_status='pending'`; the export is what advances it to `'processed'`.
      operationId: adminRefundQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by refund-workflow state. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: The refund-queue page + total matching count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundQueueResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/refunds/preview:
    get:
      tags: [Admin]
      summary: Preview the customer-refund batch (role=admin)
      description: |
        The UNREFUNDED backlog aggregated PER CUSTOMER — who would get back how much — PLUS the
        customers EXCLUDED from the batch with the reason (no customer profile / no name / no usable
        PromptPay phone / a transfer outside SCB's per-transaction bounds). Every row carries its
        `customer_id` so the screen can tick a subset and pass those ids to the export.

        THE DESTINATION MUST BE A THAI MOBILE. A refund is credited only to a stored phone that is a
        genuine 10-digit Thai mobile (leading `0`) — never to a value that merely happens to be 13 or
        15 digits long, which SCB would stamp `NAT`/`EWL` and PromptPay to whoever owns that id. A
        customer whose stored phone is anything else is EXCLUDED with a reason asking for it to be
        corrected, and nothing of theirs is marked processed. (The guard payout is deliberately more
        permissive: a guard's proxy is a tax id they supplied as a payment address.)

        TWO LANES are summed into each row and both are covered: `payment.payments`
        (`refund_status = 'pending'` with `refund_amount > 0` — the completion-reconcile overpay, the
        cancellation refund, the race-lost pre-pay compensator) and `payment.payment_slips`
        (`applied = false` and pending — a genuine double-transfer for an already-paid booking).

        Optional `from`/`to` narrow the backlog to obligations that became owed within a Thai local
        day window. READ ONLY: computes but persists nothing and marks nothing processed. Admin only.
      operationId: previewRefunds
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive first day the refund became owed (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive last day the refund became owed (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
      responses:
        '200':
          description: The aggregated preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/refunds/export:
    post:
      tags: [Admin]
      summary: Generate + download the SCB customer-refund upload file (role=admin)
      description: |
        Build ONE SCB Business Net bulk-upload file that refunds MANY customers — one `TXNDET` per
        customer inside a single `BCHDET` batch, summing every obligation that customer is owed
        across BOTH lanes — PERSIST the batch + a per-obligation paid-marker, ADVANCE those
        obligations to `refund_status = 'processed'` in the same transaction, and return the file as
        `text/plain` (UTF-8, no BOM) for download. The download filename is
        `SCB_file_reference_<first 12 chars of the file ref>.txt`.

        NO WITHHOLDING. A refund is the customer's own money coming back, not assessable income, so
        every line carries `wht = 0` and the file contains no `WHTCER` and no `WHTDET`. The ภ.ง.ด.
        settings and the company tax id are therefore NOT required — only the debit accounts and the
        fee-charge code from `/admin/payouts/config`. The destination is the phone REGISTRATION
        already captured (the PromptPay `MOB` proxy); no new customer PII is collected for refunds.

        The request body is OPTIONAL: send none to refund the whole backlog, or narrow the run with
        `customer_ids` (the preview's tick list) and/or a `from`/`to` day window, and optionally pin
        the `value_date`. Customers left out — and customers excluded for an unreachable profile or
        an out-of-bounds amount — are neither written to the file NOR marked processed.

        409 `REFUND_ALREADY_EXPORTED` if a concurrent export already claimed an obligation, 409
        `REFUND_BATCH_REF_TAKEN` if ANY export — a refund or a guard payout, since both ride
        PromptPay off the same one-second clock — committed in the same Bangkok second (the batch
        reference has one-second resolution, and two files must never share the references the bank
        de-dups on), or 409 `REFUND_QUEUE_CHANGED` if a source row moved underneath the run. In every case the whole transaction rolls back, so NOTHING was
        marked processed and the same click a moment later succeeds. 400 when the selection is
        empty/invalid, `value_date` is in the past, nothing is refundable, or the debit config is
        incomplete. Admin only.
      operationId: exportRefunds
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRefundRequest' }
      responses:
        '200':
          description: The SCB upload file (pipe-delimited text)
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An obligation was already exported (`REFUND_ALREADY_EXPORTED`), another export in EITHER stream took the same batch reference this second (`REFUND_BATCH_REF_TAKEN`), or a source row changed mid-run (`REFUND_QUEUE_CHANGED`) — nothing was marked processed, retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/refunds/batches:
    get:
      tags: [Admin]
      summary: Generated refund files (role=admin)
      description: |
        The history of generated SCB refund files, newest first, with the total count for paging.
        Header rows only — the stored file text is served by `/admin/refunds/batches/{id}/file`, and
        `has_file` says whether that re-download will work. Admin only.
      operationId: listRefundBatches
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of the refund history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundBatchList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/refunds/batches/{id}:
    get:
      tags: [Admin]
      summary: One refund file + the obligations it settled (role=admin)
      description: |
        The batch header plus every per-obligation paid-marker it wrote. An item carrying `voided_at`
        was returned to the refundable queue (its source row is `pending` again); the row is kept as
        history rather than deleted. Admin only.
      operationId: getRefundBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The batch + its items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundBatchDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/refunds/batches/{id}/file:
    get:
      tags: [Admin]
      summary: Re-download a generated refund file (role=admin)
      description: |
        The STORED file text, byte for byte, with the same `text/plain; charset=utf-8` content type
        and `SCB_file_reference_<first 12 chars of the file ref>.txt` filename the export served.

        This is the escape hatch from the one-way door: the export marks the obligations processed and
        then streams the file ONCE, so without a stored copy a failed download / closed tab / proxy
        timeout would leave those customers marked refunded with no file to actually refund them. The
        text is never REGENERATED — the backlog has moved on, so a regenerated file would differ under
        the same batch ref. 404 for an unknown batch or one with no stored text. Admin only.
      operationId: downloadRefundBatchFile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stored SCB upload file (pipe-delimited text)
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such batch, or the batch has no stored file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/refunds/batches/{id}/status:
    post:
      tags: [Admin]
      summary: Record where a refund file got to at the bank (role=admin)
      description: |
        Move the batch along its lifecycle: `generated → uploaded → confirmed | rejected`. Each step
        stamps its own timestamp, so the batch keeps the full history. Admin only.

        `voided` is NOT accepted here (400): a void must also un-mark every item AND flip its source
        row back to `pending` — that is what returns the money to the queue — and must carry a reason,
        so it has its own endpoint. An illegal step is a typed 409: `REFUND_BATCH_TERMINAL` (the batch
        is `confirmed` or `voided` — a confirmed batch is money that already moved and can never be
        re-opened), `REFUND_BATCH_ALREADY_VOIDED`, or `REFUND_BATCH_TRANSITION`.
      operationId: setRefundBatchStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRefundBatchStatusRequest' }
      responses:
        '200':
          description: The updated batch header
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Illegal lifecycle step (`error.code` = `REFUND_BATCH_TERMINAL` / `REFUND_BATCH_ALREADY_VOIDED` / `REFUND_BATCH_TRANSITION`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/refunds/batches/{id}/void:
    post:
      tags: [Admin]
      summary: Void a refund file and return its obligations to the queue (role=admin)
      description: |
        Cancel a refund file that never reached the bank (or that the bank refused) and RETURN every
        obligation in it to the refundable queue, so those customers can be paid by a fresh file. Both
        halves happen: the item rows are flagged `voided_at` (kept as history — the paid-marker unique
        is partial on that flag) AND each source row goes back to `refund_status = 'pending'`. Either
        half alone would leave the customer permanently unrefunded.

        `reason` is REQUIRED and must be non-blank: a void moves money back into the queue, and six
        months later a void with no reason cannot be told apart from a mis-click. A `confirmed` batch
        can NEVER be voided (the transfers went out — un-marking would refund those customers a second
        time) and a second void is a typed 409, not a silent success. Admin only.
      operationId: voidRefundBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidRefundBatchRequest' }
      responses:
        '200':
          description: The voided batch header
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The batch is already voided (`REFUND_BATCH_ALREADY_VOIDED`) or terminal (`REFUND_BATCH_TERMINAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/refunds/batches/{id}/items/void:
    post:
      tags: [Admin]
      summary: Return SOME of a refund file's obligations to the queue (role=admin)
      description: |
        Put the named obligations back in the refundable queue while every OTHER obligation in the
        file stays settled and the batch's own status is left alone. Admin only.

        This is the remedy for the everyday partial failure: SCB can ACCEPT a bulk file and still fail
        individual credit lines — a PromptPay proxy not linked to a receiving account is the usual
        cause. The file is structurally valid, so the batch is honestly `confirmed`; a handful of
        customers simply never got their money. Voiding the WHOLE batch would un-settle the ones who
        DID, and is refused outright once the batch is `confirmed`.

        It therefore works at ANY batch status, `confirmed` included, and deliberately does not walk
        the lifecycle state machine: the status records what the bank did with the FILE (still true),
        while this records which OBLIGATIONS it actually settled. `reason` is REQUIRED and non-blank.

        Each obligation is named by the `(source_kind, source_id)` PAIR the batch drill-down reports —
        a bare id would be ambiguous, because `payment` and `slip` are separate tables with separate
        id spaces. Rejections are typed, never a partial success: 400 for an empty `sources` (that
        would be the whole-batch action), an unknown `source_kind` or a blank reason; 404 when an
        obligation is not in THIS batch; 409 `REFUND_ITEM_ALREADY_VOIDED` when one was already
        returned.
      operationId: voidRefundBatchItems
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidRefundBatchItemsRequest' }
      responses:
        '200':
          description: The batch + its items, with the named ones now carrying `voided_at`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundBatchDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such batch, or an obligation that is not part of it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: One of the named obligations was already returned to the queue (`REFUND_ITEM_ALREADY_VOIDED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/payouts/config:
    get:
      tags: [Admin]
      summary: Guard-payout settings (role=admin)
      description: |
        The single-row company payout settings — the debit accounts the transfers come from + the
        ภ.ง.ด. withholding terms (form/pay/income type + rate). Blank debit accounts + the standard
        ภ.ง.ด.53 defaults when unset (never 404s). Admin only.
      operationId: getPayoutConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The payout settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Save guard-payout settings (role=admin)
      description: Incremental — a field left null keeps the stored value (or the schema default on first write). Admin only.
      operationId: updatePayoutConfig
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePayoutConfigRequest' }
      responses:
        '200':
          description: The saved payout settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payouts/preview:
    get:
      tags: [Admin]
      summary: Preview the guard-payout batch (role=admin)
      description: |
        The UNPAID guard-payout backlog aggregated PER GUARD — who would be paid what (income / WHT
        withheld / net transfer via PromptPay) — PLUS the guards EXCLUDED from the batch with the
        reason (no profile row / missing name, tax id, address or a usable PromptPay proxy / a
        transfer outside SCB's per-transaction bounds). Every row carries its `guard_id`
        so the screen can tick a subset and pass those ids to the export. Optional `from`/`to`
        narrow the backlog to jobs finished within a day window. READ ONLY: computes but persists
        nothing and marks nothing paid. Admin only.
      operationId: previewPayout
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive first day the jobs were finished (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive last day the jobs were finished (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
      responses:
        '200':
          description: The aggregated preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payouts/export:
    post:
      tags: [Admin]
      summary: Generate + download the SCB guard-payout upload file (role=admin)
      description: |
        Build ONE SCB Business Net bulk-upload file that pays MANY guards — one `TXNDET` per guard
        inside a single `BCHDET` batch (plus a `WHTCER` certificate header and its own `WHTDET`
        income-detail record when tax is withheld from that guard), whose totals are the sum of
        every transfer. PERSIST the batch + a per-booking paid-marker (so no job is ever paid twice),
        and return the file as `text/plain` (UTF-8, no BOM) for download. The download filename is
        `SCB_file_reference_<first 12 chars of the file ref>.txt`.

        The request body is OPTIONAL: send none to pay the whole unpaid backlog (every payable
        guard), or narrow the run with `guard_ids` (the admin's tick list) and/or a `from`/`to` day
        window, and optionally pin the `value_date`. Guards left out — and guards excluded for a
        missing/invalid profile or an out-of-bounds amount — are neither written to the file nor
        marked paid.

        409 `PAYOUT_ALREADY_PAID` if a concurrent export already claimed a booking, or 409
        `PAYOUT_BATCH_REF_TAKEN` if ANY export — another payout or a customer refund, since both ride
        PromptPay off the same one-second clock — committed in the same Bangkok second. The batch
        reference has one-second resolution, and two files must never share the references the bank
        de-dups on. The losing export's whole transaction rolls back, so NOTHING
        was marked paid and the same click a moment later succeeds. 400 when the selection is
        empty/invalid, `value_date` is in the past, nothing is payable, or the company/debit config
        is incomplete (including a stored ภ.ง.ด. or fee-charge code outside SCB's tables). Admin only.
      operationId: exportPayout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportPayoutRequest' }
      responses:
        '200':
          description: The SCB upload file (pipe-delimited text)
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A job was already paid out by a concurrent export (`PAYOUT_ALREADY_PAID`), or another export in EITHER stream took the same batch reference this second (`PAYOUT_BATCH_REF_TAKEN`) — nothing was marked paid, retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/payouts/batches:
    get:
      tags: [Admin]
      summary: Generated payout files (role=admin)
      description: |
        The history of generated SCB payout files, newest first, with the total count for paging.
        Header rows only — the stored file text is served by `/admin/payouts/batches/{id}/file`, and
        `has_file` says whether that re-download will work (files generated before the text was
        stored have no copy). Admin only.
      operationId: listPayoutBatches
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of the payout history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutBatchList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payouts/batches/{id}:
    get:
      tags: [Admin]
      summary: One payout file + the bookings it paid (role=admin)
      description: |
        The batch header plus every per-booking paid-marker it wrote. An item carrying `voided_at`
        belongs to a VOIDED batch: the row is kept as history (the guard was in that file) but the
        booking is payable again. Admin only.
      operationId: getPayoutBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The batch + its items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutBatchDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payouts/batches/{id}/file:
    get:
      tags: [Admin]
      summary: Re-download a generated payout file (role=admin)
      description: |
        The STORED file text, byte for byte, with the same `text/plain; charset=utf-8` content type
        and `SCB_file_reference_<first 12 chars of the file ref>.txt` filename the export served.

        This is the escape hatch from the one-way door: the export marks the bookings paid and then
        streams the file ONCE, so a failed download / closed tab / proxy timeout used to leave those
        jobs paid forever with no copy of the file meant to pay them. The text is never REGENERATED —
        a regenerated file could differ (config, WHT rate or a guard profile changed) under the same
        batch ref. 404 both for an unknown batch and for one generated before the text was stored.
        Admin only.
      operationId: downloadPayoutBatchFile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stored SCB upload file (pipe-delimited text)
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such batch, or the batch has no stored file (generated before the text was kept).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/payouts/batches/{id}/status:
    post:
      tags: [Admin]
      summary: Record where a payout file got to at the bank (role=admin)
      description: |
        Move the batch along its lifecycle: `generated → uploaded → confirmed | rejected`. Each step
        stamps its own timestamp, so the batch keeps the full history. Admin only.

        `voided` is NOT accepted here (400): a void must also un-mark every item — that is what
        returns the bookings to the payable backlog — and must carry a reason, so it has its own
        endpoint. An illegal step is a typed 409: `PAYOUT_BATCH_TERMINAL` (the batch is `confirmed`
        or `voided` — a confirmed batch is money that already moved and can never be re-opened),
        `PAYOUT_BATCH_ALREADY_VOIDED`, or `PAYOUT_BATCH_TRANSITION`.
      operationId: setPayoutBatchStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPayoutBatchStatusRequest' }
      responses:
        '200':
          description: The updated batch header
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Illegal lifecycle step (`error.code` = `PAYOUT_BATCH_TERMINAL` / `PAYOUT_BATCH_ALREADY_VOIDED` / `PAYOUT_BATCH_TRANSITION`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/payouts/batches/{id}/void:
    post:
      tags: [Admin]
      summary: Void a payout file and return its work to the backlog (role=admin)
      description: |
        Cancel a batch that never reached the bank (or that the bank refused) and RETURN every
        booking in it to the payable backlog, so the guards can be paid by a fresh file. The item
        rows are kept as history (flagged `voided_at`), not deleted — the paid-marker unique is
        partial on that flag, which is what makes those bookings payable again.

        `reason` is REQUIRED and must be non-blank: a void moves money back into the queue, and six
        months later a void with no reason cannot be told apart from a mis-click. A `confirmed`
        batch can NEVER be voided (the transfers went out — un-marking would pay those guards a
        second time) and a second void is a typed 409, not a silent success. Admin only.
      operationId: voidPayoutBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidPayoutBatchRequest' }
      responses:
        '200':
          description: The voided batch header
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The batch is already voided (`PAYOUT_BATCH_ALREADY_VOIDED`) or terminal (`PAYOUT_BATCH_TERMINAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/payouts/batches/{id}/items/void:
    post:
      tags: [Admin]
      summary: Return SOME of a payout file's bookings to the backlog (role=admin)
      description: |
        Put the named bookings back in the payable backlog while every OTHER booking in the file
        stays paid and the batch's own status is left alone. Admin only.

        This is the remedy for the everyday partial failure: SCB can ACCEPT a bulk file and still
        fail individual credit lines — an unregistered PromptPay proxy, or one not linked to a
        receiving account, is the usual cause. The file is structurally valid, so the batch is
        honestly `confirmed`; a handful of guards simply never got their money. Voiding the WHOLE
        batch would un-pay the guards who DID get paid, and is refused outright once the batch is
        `confirmed`.

        It therefore works at ANY batch status, `confirmed` included, and deliberately does not walk
        the lifecycle state machine: the status records what the bank did with the FILE (still true),
        while this records which BOOKINGS it actually paid. `reason` is REQUIRED and non-blank — this
        is the record of why money the ledger says was paid is queued to be paid again.

        Rejections are typed, never a partial success: 400 for an empty `booking_ids` (that would be
        the whole-batch action) or a blank reason, 404 when a `booking_id` is not in THIS batch, 409
        `PAYOUT_ITEM_ALREADY_VOIDED` when one was already returned.
      operationId: voidPayoutBatchItems
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidPayoutBatchItemsRequest' }
      responses:
        '200':
          description: The batch + its items, with the named ones now carrying `voided_at`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutBatchDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such batch, or a `booking_id` that is not part of it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: One of the named bookings was already returned to the backlog (`PAYOUT_ITEM_ALREADY_VOIDED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/deductions/preview:
    get:
      tags: [Admin]
      summary: Preview the platform-cut sweep (role=admin)
      description: |
        Stream ② **ยอดที่โดนหักเข้าระบบ** — the itemised cut for the window, before any of it moves.
        Totals per component (commission / retained cancellation fee / tip / unpaid multi-guard share
        / proration rounding), the job count, the per-job ledger, and the jobs EXCLUDED because their
        pricing snapshot is incomplete, each with a Thai reason.

        WHAT IS SWEPT: the commission deducted from the guard's pay, the cancellation fee retained
        when a customer backs out, the tip, and the billed-but-unpaid share of a multi-guard booking.
        The last two are in the cut only because of two KNOWN, DEFERRED bugs (the customer is billed
        a tip the guard never receives; a booking billed for N guards pays exactly one), so they are
        itemised rather than folded into "commission" — fixing either bug moves that figure.

        WHAT IS NOT SWEPT, and never will be from here: **VAT** and the **WHT withheld from guards**.
        Both are the Revenue Department's money sitting in the same bank account, remitted by
        e-filing (ภ.พ.30 monthly, ภ.ง.ด.3/53 by the 7th of the following month) — see
        `/admin/reports/vat-register` and `/admin/reports/wht-payees`. They are reported here, clearly
        labelled as excluded, so nobody later "simplifies" them into the transfer.

        A job whose snapshot is incomplete (a charge predating the VAT split or the pricing snapshot)
        CANNOT be priced — `subtotal = base_fee × hours × guards + tip` is one equation in four
        unknowns — so it is EXCLUDED and COUNTED rather than silently contributing zero, which would
        under-state the cut. Optional `from`/`to` narrow the window to the Thai local days the jobs
        were SETTLED (the same basis the guard-payout backlog uses, so the two halves of one job move
        together). READ ONLY: persists nothing and marks nothing swept.

        `total_amount` is what the file would TRANSFER: `billed_cut_total` LESS `uncollected_total`,
        the part of those bills the customer never actually paid (the completion reconcile's `Extra`
        arm records a settled bill above the pre-payment and captures nothing). Both halves are shown
        rather than the cut quietly shrinking — sweeping money that never arrived would draw down an
        account that also holds the Revenue Department's VAT and the guards' unpaid income.

        With both ends omitted the window is the WHOLE unswept backlog; if that exceeds what the
        service will buffer, the response is a typed 400 asking for a narrower window rather than a
        truncated total. Preview and export are refused identically, so an admin can never export a
        different set of jobs from the one they previewed. Admin only.
      operationId: previewDeductions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive first day the job was settled (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive last day the job was settled (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
      responses:
        '200':
          description: The itemised cut
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeductionPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/deductions/export:
    post:
      tags: [Admin]
      summary: Generate + download the SCB platform-cut sweep file (role=admin)
      description: |
        Build ONE SCB Business Net upload file (product **`OAT`**, own-account transfer) that sweeps
        the platform's cut for the window out of the account receiving customer money and into the
        company revenue account, PERSIST the batch + its per-job ledger (which marks those jobs
        swept), and return the file as `text/plain` (UTF-8, no BOM). The download filename is
        `SCB_file_reference_<first 12 chars of the file ref>.txt`.

        STRUCTURALLY DIFFERENT from the other two streams: an `OAT` batch credits ONE destination, so
        the file carries a SINGLE `TXNDET` summing the whole sweep and the per-booking rows are the
        LEDGER behind that one credit line, not separate recipients. `recipient_count` is therefore
        always 1 and `job_count` is the interesting number. The per-transaction bound applies to the
        WHOLE sweep for the same reason — and an account credit has effectively no bank ceiling, so
        only the configured `max_transfer_per_txn` can bite, at which point the remedy is a narrower
        day window (the error says so).

        CONFIG REQUIRED: the company debit accounts, the fee-charge code, and `revenue_account` — the
        credit destination, which must be an SCB account (10 digits passing the §14 check digit) and
        is validated both at save time and here. The company NAME is required too (`TXNDET` field 13
        is mandatory); the company TIN is NOT, because nothing is withheld and no ภ.ง.ด. certificate
        is emitted.

        NO PER-JOB TICK LIST, deliberately: there is one destination, so there is nobody to choose
        between, and sweeping half a day's cut would leave the rest looking unswept for a reason
        nobody could reconstruct later. Send no body to sweep the whole unswept backlog.

        409 `DEDUCTION_ALREADY_SWEPT` if a concurrent export claimed a job; 409
        `DEDUCTION_BATCH_REF_TAKEN` if ANY export — payout, refund or sweep — committed in the same
        Bangkok second (the batch reference has one-second resolution and it is what the bank de-dups
        a batch on). In both cases the whole transaction rolls back, so NOTHING was marked swept and
        the same click a moment later succeeds. 400 when the window is invalid, `value_date` is in
        the past, there is nothing to sweep, the total is not a positive transferable amount, or the
        account config is incomplete. Admin only.
      operationId: exportDeductions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportDeductionRequest' }
      responses:
        '200':
          description: The SCB upload file (pipe-delimited text)
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A job was already swept (`DEDUCTION_ALREADY_SWEPT`) or another export in ANY stream took the same batch reference this second (`DEDUCTION_BATCH_REF_TAKEN`) — nothing was marked swept, retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/deductions/batches:
    get:
      tags: [Admin]
      summary: Generated platform-cut sweep files (role=admin)
      description: |
        The history of generated sweep files, newest first, with the total count for paging. Header
        rows only — the stored file text is served by `/admin/deductions/batches/{id}/file`, and
        `has_file` says whether that re-download will work. Admin only.
      operationId: listDeductionBatches
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: One page of sweep files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeductionBatchList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/deductions/batches/{id}:
    get:
      tags: [Admin]
      summary: One sweep file + the jobs it collected (role=admin)
      description: |
        The batch header plus every job whose cut it collected — the LEDGER behind the file's single
        credit line. An item carrying `voided_at` is back in the sweepable backlog (the row is kept as
        history, not deleted). Admin only.
      operationId: getDeductionBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The batch + its ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeductionBatchDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/deductions/batches/{id}/file:
    get:
      tags: [Admin]
      summary: Re-download a generated sweep file (role=admin)
      description: |
        The STORED file text, byte for byte, with the same content type and filename the export
        served. Never regenerated — the backlog has moved on since, so a regenerated file would differ
        under the same batch reference. 404 when the batch is unknown or has no stored text. Admin only.
      operationId: downloadDeductionBatchFile
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The stored SCB file
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/deductions/batches/{id}/status:
    post:
      tags: [Admin]
      summary: Record where a sweep file got to at the bank (role=admin)
      description: |
        `generated → uploaded → confirmed | rejected`, enforced by the ONE shared transition table.
        `confirmed` and `voided` are TERMINAL. `voided` is refused here by name (400): voiding must
        also release every job in the batch and must carry a reason, so it has its own endpoint —
        coming through this door it would flip the header while leaving the jobs claimed, i.e. never
        sweepable again. Admin only.
      operationId: setDeductionBatchStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDeductionBatchStatusRequest' }
      responses:
        '200':
          description: The updated batch header
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeductionBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            An illegal step. `error.code` is `DEDUCTION_BATCH_ALREADY_VOIDED` (the batch is already
            cancelled and its jobs are already back in the backlog), `DEDUCTION_BATCH_TERMINAL` (a
            confirmed/voided batch admits no further step) or `DEDUCTION_BATCH_TRANSITION`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/deductions/batches/{id}/void:
    post:
      tags: [Admin]
      summary: Cancel a sweep file and return its jobs to the backlog (role=admin)
      description: |
        The escape hatch from the one-way door: a batch whose file was lost (or that the bank refused)
        would otherwise leave its jobs marked swept — cut recorded as collected with no money moved —
        with only a hand-written UPDATE to undo it. Flips the header to `voided` and releases EVERY
        live job, which is what puts them back in the sweepable backlog. The reason is REQUIRED.

        A CONFIRMED batch cannot be voided (409 `DEDUCTION_BATCH_TERMINAL`): the money moved, so
        releasing its jobs would sweep the same cut a second time. The remedy for a confirmed batch
        that was wrong is a correcting transfer, or the per-item void below. Admin only.
      operationId: voidDeductionBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidDeductionBatchRequest' }
      responses:
        '200':
          description: The voided batch header
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeductionBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already voided (`DEDUCTION_BATCH_ALREADY_VOIDED`) or terminal (`DEDUCTION_BATCH_TERMINAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/deductions/batches/{id}/items/void:
    post:
      tags: [Admin]
      summary: Return SOME of a sweep's jobs to the backlog (role=admin)
      description: |
        Release the NAMED jobs, leaving every other job in the file collected and the batch's own
        status untouched. The trigger is not a failed credit line (an `OAT` file has ONE line, which
        the bank takes or does not): it is a job that should never have been collected — a settled row
        later found to be wrong, or a sweep run over a window an admin did not mean.

        **REFUSED ONCE THE BATCH IS `confirmed` (409 `DEDUCTION_BATCH_CONFIRMED`) — the OPPOSITE of
        the payout and refund files.** Theirs carry one credit line PER RECIPIENT, so an individual
        PromptPay credit can genuinely bounce inside a file the bank accepted and releasing that one
        item is right. This file carries ONE credit line for the whole batch, so `confirmed` means the
        entire summed amount moved into the revenue account; releasing a job would return its cut to
        the backlog and the next sweep would move it a SECOND time. The correct remedies, which the
        Thai error names, are a whole-batch void (if the money truly did not move) or a manual
        accounting adjustment (if it did).

        On every other status it works, and the reason is mandatory: the audit record carries it plus
        the released amount, which is what ties this file's stated total to the next sweep's.

        404 if a named job is not in THIS batch; 409 `DEDUCTION_ITEM_ALREADY_VOIDED` if one was
        already released. Admin only.
      operationId: voidDeductionBatchItems
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidDeductionBatchItemsRequest' }
      responses:
        '200':
          description: The batch + its ledger, re-read after the release
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeductionBatchDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The batch is `confirmed`, so its single credit line already moved the whole summed amount
            and no job may be released from it (`DEDUCTION_BATCH_CONFIRMED`); or a named job was
            already released (`DEDUCTION_ITEM_ALREADY_VOIDED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/reports/vat-register:
    get:
      tags: [Admin]
      summary: Output-VAT register (รายงานภาษีขาย) for one month — ภ.พ.30 (role=admin)
      description: |
        One line per settled payment that charged VAT: the Thai calendar day the customer PAID, the
        payment/booking/customer ids, the VAT-exclusive subtotal and the VAT; plus the period totals
        an accountant transcribes onto the ภ.พ.30 form.

        BUCKETED ON `paid_at`, and it matters: Thai VAT on a service has its tax point at RECEIPT OF
        PAYMENT, and it is the same basis `/admin/reports/revenue` uses, so the register and the
        revenue chart tie out line for line. (The platform-cut sweep buckets on the settle timestamp
        instead — a different question. The three streams can only be reconciled because each says
        which basis it uses.) The AMOUNTS are the SETTLED split, so a job paid in one month and
        prorated in the next reports its final VAT in the month it was paid.

        The customer is reported as an ID, not a name: resolving names would be a cross-service
        fan-out per row on a report that runs to thousands of rows a month, and the admin panel
        already has a batch resolver (`POST /admin/users/resolve`).

        `format=csv` returns the spreadsheet an accountant works in — rendered SERVER-SIDE with RFC
        4180 quoting, a UTF-8 BOM (without it Excel on Thai Windows renders Thai as mojibake) and
        formula neutralisation (including a lead hidden behind leading whitespace or a control byte,
        which spreadsheet importers strip before parsing the cell), plus a TOTAL row.

        A month with more rows than the service will buffer is a typed 400 asking for a narrower
        period, never a truncated list — a short VAT total is a number an accountant would file.
        Admin only.
      operationId: vatRegisterReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          required: true
          description: The filing period, `YYYY-MM` (Thai calendar month). Required — a defaulted period on a tax report is a filing for the wrong month.
          schema: { type: string, example: '2026-09' }
        - name: format
          in: query
          required: false
          description: '`csv` for the spreadsheet; omitted or anything else returns JSON.'
          schema: { type: string, enum: ['csv'] }
      responses:
        '200':
          description: The register (JSON), or the CSV download when `format=csv`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VatRegisterReport' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/wht-payees:
    get:
      tags: [Admin]
      summary: ภ.ง.ด.3/53 payee list for one month (role=admin)
      description: |
        Every guard who had tax withheld from a payout in the period, with their TIN, name, address,
        the income type, the gross assessable income paid and the tax withheld — plus the period
        totals. This reads `payout_batch_items.wht`, which has been WRITE-ONLY since the payout
        shipped: the one figure the law requires us to report was previously unreachable from the
        running system.

        BUCKETED ON the payout batch's `value_date` — the day the transfer settles is the day the
        payment to the payee is made, which is the month the filing covers (due by the 7th of the
        following month). Not the file's creation date: generating a file on the 31st for a value date
        of the 1st would file the withholding a month early.

        ONLY BATCHES WHOSE MONEY ACTUALLY MOVED ARE COUNTED — money that was never paid was never
        withheld, and a return that declares withholding which did not occur is an over-declaration to
        the Revenue Department with a payee certificate nobody can match. Status by status:
        `generated` IN (the certificate is produced and the file is on its way; if it never lands the
        admin voids it, which removes it here), `uploaded` IN, `confirmed` IN, **`rejected` OUT** (the
        bank refused the file — not one baht was transferred), `voided` OUT. Individually voided
        ITEMS are excluded too, which is what covers a per-item void on an otherwise-good batch.

        A capped-out month is a typed 400 telling the admin to narrow the period, never a silently
        truncated list: a short tax return looks exactly like a correct one.

        `form_type_code` and `income_type_code` are reported exactly as stored in the payout config —
        which ภ.ง.ด. form applies is the operator's TAX decision, and a report that silently corrected
        it would be filing something other than what was certified to the payee. A payee whose profile
        is missing is STILL LISTED with blank PII, because the withholding happened.

        `format=csv` as above (server-rendered, BOM'd, with a TOTAL row). Admin only.
      operationId: whtPayeeReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          required: true
          description: The filing period, `YYYY-MM` (Thai calendar month).
          schema: { type: string, example: '2026-09' }
        - name: format
          in: query
          required: false
          description: '`csv` for the spreadsheet; omitted or anything else returns JSON.'
          schema: { type: string, enum: ['csv'] }
      responses:
        '200':
          description: The payee list (JSON), or the CSV download when `format=csv`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WhtPayeeReport' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/revenue:
    get:
      tags: [Admin]
      summary: Revenue-trend analytics (role=admin)
      description: |
        Daily NET revenue (completed charges' effective amount minus refunds) over `[from, to)`,
        plus a month-over-month comparison against the immediately-preceding equal-length window.
        Defaults to the last 30 days; the window is capped at 366 days. Admin only (else 403).
      operationId: adminRevenueReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC3339). Default = `to − 30 days`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC3339). Default = now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Revenue trend + MoM
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RevenueReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/customer-spend:
    get:
      tags: [Admin]
      summary: Per-customer lifetime-spend report (role=admin)
      description: |
        Per-customer lifetime spend — for each customer, the summed effective amount of their
        actually-charged (`completed`) payments (prorated `final_amount` when set, else `amount`).
        Powers the web-admin customers page's spend column. Customers with no completed payment
        are omitted. Admin only (else 403).
      operationId: adminCustomerSpendReport
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Per-customer total spend
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerSpend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get one payment the caller owns (or admin)
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/PaymentOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/promptpay:
    get:
      tags: [Payments]
      summary: PromptPay transfer instructions for a booking (where to pay)
      description: |
        Tells the customer WHERE and HOW MUCH to transfer so they can pay the booking by PromptPay
        and then settle via `POST /payments/{id}/slip`. `{id}` is the BOOKING id. Own-only (the
        booking's customer) → else 403; the booking must be in a payable state (post-accept,
        pre-complete) → else 409.

        Returns the **server-computed estimate** (`base_fee × hours × guard_count + tip` — the SAME
        amount the slip/pre-pay handlers charge; the client never computes it), our **receiving
        account** formatted for display, and the authoritative **EMVCo PromptPay `qr_payload`**.

        The `qr_payload` is generated **server-side, in ONE authoritative place**, from
        `RECEIVING_ACCOUNT` + the estimate — a standard PromptPay/EMVCo merchant-presented QR
        (Payload-Format `00`, Point-of-Initiation `01`, Merchant-Account `29` with the PromptPay
        AID `A000000677010111` + the proxy phone/national-id from `RECEIVING_ACCOUNT`, amount tag
        `54`, currency `53`=764 THB, country `58`=TH, CRC `63`). The mobile renders it as a QR and
        MUST NOT rebuild its own — so the amount + receiver can never drift from the server.

        **Only valid under `PAYMENT_PROVIDER=slip2go`.** Under the simulated default this returns
        409 `SLIP_DISABLED` (there is nowhere to transfer — the client uses `POST /payments`).
        `RECEIVING_ACCOUNT` must be a PromptPay-addressable id (a mobile phone or a national/tax id);
        a plain bank account number cannot be encoded as a PromptPay QR (→ server config error).

        No DB write and no Slip2Go call — purely informational.
      operationId: getPromptPay
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The booking id to pay.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The PromptPay transfer instructions (amount + receiving account + QR payload)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PromptPayInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{id}/slip:
    post:
      tags: [Payments]
      summary: Pay a booking with a Slip2Go-verified transfer slip (REAL money path)
      description: |
        THE MONEY PATH (real). `{id}` is the BOOKING id. The customer transfers to OUR
        PromptPay/bank account, then uploads the transfer SLIP image here. The payment service
        verifies the slip with **Slip2Go** (`POST /verify-slip/qr-image/info`) — confirming it is
        genuine, paid to OUR account (`checkReceiver`), and for at least the server-computed
        estimate (`checkAmount: gte`) — then RE-VALIDATES on our side (amount ≥ estimate, receiver
        == our account) and stamps the payment paid (`payment_method=promptpay_slip`), emitting the
        SAME `payment.completed` event that gates en_route (no new event).

        Available only when the service runs with `PAYMENT_PROVIDER=slip2go`; under the simulated
        default this returns 409 `SLIP_DISABLED`. Own-only (the booking's customer) → else 403.

        **Anti-fraud / dedupe guarantee:** a verified slip's `transRef` and Slip2Go `referenceId`
        are stored under a UNIQUE constraint, so ONE slip can NEVER pay two bookings (a reused slip
        → 409 `SLIP_DUPLICATE`). **Idempotent:** re-submitting the SAME accepted slip returns the
        existing payment (200), no double-charge.

        **Double-pay (a SECOND, different transfer):** if the customer transfers twice for one
        booking (bank-app timeout → two real transfers with distinct `transRef`s), the second,
        DIFFERENT verified slip does NOT return 200 — it is recorded as an unapplied, refundable slip
        (the money is tracked, its refs are reserved against reuse) and the call returns 409
        `ALREADY_PAID_EXTRA_TRANSFER` so the extra transfer is visible and can be refunded.

        Failure modes carry a machine-readable `error.code` (branch on it, not the message):
        `SLIP_VERIFY_FAILED` (Slip2Go rejected it), `SLIP_AMOUNT_TOO_LOW` (underpay),
        `SLIP_WRONG_RECEIVER` (paid to another account), `SLIP_DUPLICATE` (already used),
        `ALREADY_PAID_EXTRA_TRANSFER` (a second, different transfer for an already-paid booking —
        recorded for refund), `SLIP_DISABLED` (provider not slip2go).
      operationId: payWithSlip
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The booking id to settle.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The transfer-slip image (JPEG/PNG/WEBP, ≤ 10 MB).
      responses:
        '200':
          description: Slip verified → booking paid (or an idempotent re-submit of an accepted slip)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlipRejected' }

  /internal/users/{user_id}/export:
    get:
      tags: [Admin]
      summary: PDPA data export aggregation (service-to-service)
      description: |
        Internal read for identity's `ExportClient` fan-out — aggregates this service's slice
        of a user's PDPA data export. Guarded by a **service-JWT** (`serviceAuth`, aud
        `pguard-internal`), never reachable from the public edge (the gateway blocks
        `/internal/`). Returns this service's per-user export blob (an opaque object).
      operationId: internalExportUser
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: This service's per-user export blob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-JWT (aud=pguard-internal); internal endpoints only.

  responses:
    PaymentOk:
      description: The payment
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Payment' }
    BadRequest:
      description: Invalid request body (e.g. malformed/missing booking_id)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but not permitted (wrong role / not your booking / not your payment)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Booking or payment not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Booking is not in a payable state (or already paid)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    SlipRejected:
      description: |
        The slip could not settle the booking. `error.code` is one of: `SLIP_VERIFY_FAILED`
        (Slip2Go rejected the slip), `SLIP_AMOUNT_TOO_LOW` (the slip is below the estimate),
        `SLIP_WRONG_RECEIVER` (paid to another account), `SLIP_DUPLICATE` (the slip was already
        used for a payment), `ALREADY_PAID_EXTRA_TRANSFER` (the booking was already paid and this is
        a SECOND, different real transfer — recorded as unapplied for refund, not a double-charge),
        `SLIP_DISABLED` (the service is not running the slip provider), or the booking is not in a
        payable state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    CreatePaymentRequest:
      type: object
      required: [booking_id]
      description: |
        PRE-PAY request body. Carries ONLY the booking id — the amount is computed SERVER-SIDE from
        the authoritative booking (never sent by the client).
      properties:
        booking_id: { type: string, format: uuid }

    PromptPayInfo:
      type: object
      required: [amount, amount_satang, receiving_account, qr_payload]
      description: |
        PromptPay transfer instructions for a booking. `qr_payload` is the authoritative EMVCo
        PromptPay QR string, generated server-side from `RECEIVING_ACCOUNT` + the estimate — the
        client renders it as a QR and never rebuilds it.
      properties:
        amount:
          type: string
          description: >-
            The server-side estimate to transfer (exact decimal as a string; money rule) —
            VAT-INCLUSIVE (`grand_total`), because that is the sum the customer actually sends.
          example: "2140.00"
        amount_satang:
          type: integer
          format: int64
          description: The same VAT-inclusive estimate in satang (the smallest THB unit, ×100) — a convenience field.
          example: 214000
        receiving_account:
          type: string
          description: OUR receiving PromptPay account, formatted for human display.
          example: "081-234-5678"
        qr_payload:
          type: string
          description: |
            The authoritative EMVCo PromptPay QR payload (render as a QR; do NOT rebuild). Encodes
            the PromptPay AID + our proxy + the amount + currency THB + country TH + CRC.
          example: "00020101021229370016A000000677010111011300668123456785303764540720.005802TH6304ABCD"

    PaymentStatus:
      type: string
      description: Payment lifecycle status.
      enum:
        - pending
        - completed
        - refunded

    Payment:
      type: object
      description: |
        One booking's charge. MONEY VOCABULARY (all exact decimal strings; VAT rate 7%):
          subtotal    = base_fee × hours × guard_count + tip   ← VAT-EXCLUSIVE, the catalog price
          vat_amount  = subtotal × 0.07
          grand_total = subtotal + vat_amount                  ← what the customer actually pays
        `amount` (what was pre-paid) is the VAT-INCLUSIVE `grand_total`, not the subtotal — the
        catalog's rates are quoted before VAT, so the charge is higher than base_fee × hours.
      required: [id, booking_id, customer_id, amount, grand_total, overpaid_amount, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid, nullable: true }
        amount: { type: string, description: 'Exact decimal PRE-PAID — the VAT-INCLUSIVE grand total. Never re-charged on settle.', example: "2140.00" }
        expected_total:
          type: string
          nullable: true
          description: >-
            Server-computed authoritative charge at pre-pay time — the VAT-INCLUSIVE total
            ((base_fee × hours × guards + tip) + VAT 7%), i.e. the same figure as `grand_total`.
          example: "2140.00"
        subtotal:
          type: string
          nullable: true
          description: >-
            VAT-EXCLUSIVE service cost of the CURRENTLY SETTLED bill — base_fee × hours ×
            guard_count + tip (booked hours until the completion settle, actual hours after). This
            is the "ราคาสินค้า/บริการ" line of the tax invoice, NOT what the customer pays. null on
            payments taken before VAT was itemized (their `amount` was the whole charge, VAT-free).
          example: "2000.00"
        vat_amount:
          type: string
          nullable: true
          description: >-
            VAT charged ON TOP of `subtotal` at 7% (`subtotal × 0.07`, rounded to 2dp) — the
            "ภาษีมูลค่าเพิ่ม 7%" line of the tax invoice. Collected for the Revenue Department, so
            it is NOT platform revenue. null on pre-VAT payments.
          example: "140.00"
        grand_total:
          type: string
          description: >-
            `subtotal + vat_amount` — the VAT-INCLUSIVE amount the customer owes, and the
            "จำนวนเงินรวมทั้งสิ้น" line of the tax invoice. ALWAYS present (unlike the two fields it
            is made of): on a pre-VAT row it falls back to `amount`, so this is the payable figure
            for every payment ever taken. Tracks the SETTLED bill — it follows `final_amount` once
            the actual hours are reconciled, and equals `amount` until then.
          example: "2140.00"
        cancellation_fee_charged:
          type: string
          nullable: true
          description: >-
            What was actually KEPT as a cancellation fee when the CUSTOMER cancelled before work
            started: `min(booking.cancellation_fee, amount_paid)` — capped at what was paid, so a
            cancellation can never leave the customer owing money (nothing paid → nothing charged,
            `"0.00"`). The refund is `amount_paid − cancellation_fee_charged`. Stays null/`"0.00"`
            when the GUARD withdrew (not the customer's fault → full refund) and on jobs that were
            never cancelled.
          example: "100.00"
        overpaid_amount:
          type: string
          description: >-
            Excess the customer transferred ABOVE the estimate on a slip payment
            (`max(0, slip_amount − amount)`); `"0.00"` for simulated/exact payments. This money is
            never the platform's — it is ALWAYS refunded on top of the settled bill, so every refund
            (cancel, race-compensator, completion reconcile) returns `amount + overpaid_amount`. NOT
            NULL (present on every row).
          example: "0.00"
        payment_method:
          type: string
          nullable: true
          description: 'How the charge settled: `prepaid` (simulated gateway) or `promptpay_slip` (real Slip2Go-verified transfer).'
          example: promptpay_slip
        status: { $ref: '#/components/schemas/PaymentStatus' }
        final_amount: { type: string, nullable: true, description: 'The reconciled actual-hours bill, set on the completion SETTLE (null until then). May be less than `amount` (overpay refunded) or more (shortfall recorded).' }
        refund_amount: { type: string, nullable: true, description: 'The overpay returned to the customer on the SETTLE when actual hours < pre-paid (null when none owed).' }
        actual_hours: { type: string, nullable: true, description: 'Clamped hours actually worked, recorded on the settle.' }
        refund_status:
          type: string
          nullable: true
          enum: [pending, processed]
          description: '`pending` once a settle refund is owed (an admin/real-gateway marks `processed`); null when no refund.'
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RevenuePoint:
      type: object
      required: [date, revenue, payments]
      properties:
        date: { type: string, format: date }
        revenue:
          type: string
          description: Net revenue that day (exact decimal as a string; money rule). Net of refunds.
          example: "12400.00"
        payments: { type: integer, format: int64, description: Completed charges that day. }

    RevenueReport:
      type: object
      required: [series, total, prev_total]
      properties:
        series:
          type: array
          items: { $ref: '#/components/schemas/RevenuePoint' }
        total: { type: string, description: Net revenue over the window (decimal string). }
        prev_total: { type: string, description: Net revenue over the prior equal-length window. }
        mom_pct:
          type: number
          format: double
          nullable: true
          description: Month-over-month % vs the prior window (null when it had zero revenue).

    CustomerSpend:
      type: object
      required: [customer_id, total]
      properties:
        customer_id: { type: string, format: uuid }
        total:
          type: string
          description: Lifetime spend — summed effective amount of the customer's completed payments (exact decimal as a string; money rule).
          example: "12400.00"

    GuardEarning:
      type: object
      required: [booking_id]
      description: |
        One completed job's earning basis for the assigned guard. `actual_hours` is the clamped
        hours ACTUALLY worked (persisted at reconcile); `null` for an even-match / not-yet-reconciled
        row, where the client falls back to the booked hours. The client computes the guard's take
        from its own booking feed:
          gross      = base_fee × actual_hours          (this guard's share — no guard_count, no tip)
          commission = gross × commission_percent / 100
          net        = gross − commission               ← what the guard is actually paid
        No VAT appears here: VAT is charged to the CUSTOMER on top of the bill and is not part of
        the guard's pay.
      properties:
        booking_id: { type: string, format: uuid }
        actual_hours:
          type: string
          nullable: true
          description: Clamped hours actually worked (exact decimal as a string; money rule). Null when unreconciled.
          example: "2.50"
        commission_percent:
          type: string
          nullable: true
          description: >-
            The booking's SNAPSHOT commission percent (0–100, exact decimal string) DEDUCTED from
            this guard's gross for this job — the platform's cut, taken out of the guard's pay, not
            added to the customer's bill. null on pre-feature bookings → treat as 0 (guard keeps
            the full gross).
          example: "10.00"

    RefundStatus:
      type: string
      description: Refund-workflow state (NOT the payment status — a partial refund stays `completed`).
      enum:
        - pending
        - processed

    RefundQueueItem:
      type: object
      required: [payment_id, booking_id, amount, status, created_at]
      description: |
        One refund-queue row — a payment whose settle or cancellation left a refund owed. `amount`
        is the refund owed (NOT the original charge); `status` is the refund-workflow state. On a
        customer cancellation the row is already NET of the cancellation fee
        (`amount_paid − cancellation_fee_charged`); on a guard withdrawal it is the full amount paid.
      properties:
        payment_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        amount:
          type: string
          description: >-
            The refund owed to the customer (exact decimal as a string; money rule) — already net
            of any `cancellation_fee_charged`, so this is exactly what is sent back.
          example: "1000.00"
        status: { $ref: '#/components/schemas/RefundStatus' }
        created_at: { type: string, format: date-time }

    RefundQueueResponse:
      type: object
      required: [refunds, count]
      description: The refund-queue page (newest first) + the total count matching the same filter.
      properties:
        refunds:
          type: array
          items: { $ref: '#/components/schemas/RefundQueueItem' }
        count:
          type: integer
          format: int64
          description: Total refund rows matching the filter (independent of limit/offset) — the badge count.

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: CONFLICT }
        message: { type: string }

    PayoutConfig:
      type: object
      description: The single-row guard-payout settings (company debit accounts + ภ.ง.ด. terms).
      properties:
        debit_account: { type: string, nullable: true, description: Company account the transfers are debited from. }
        fee_debit_account: { type: string, nullable: true, description: Account the transfer fees are debited from (defaults to the debit account). }
        revenue_account:
          type: string
          nullable: true
          description: |
            The company SCB account the PLATFORM-CUT sweep (stream ②, product `OAT`) is CREDITED to.
            `null` until an admin sets it; `POST /admin/deductions/export` refuses to run without it.
            Validated as a real SCB account (10 digits passing the §14 check digit) at save time AND
            again at export — an `OAT` line may credit no other bank, and a check-digit typo is
            BATCH-fatal: SCB rejects the file after the jobs in it were marked swept.
        wht_form_type_code:
          type: string
          example: '53'
          description: |
            ภ.ง.ด. form code. SCB accepts exactly seven values — `01`, `03`, `04`, `11`, `12`, `13`,
            `53` (`Master_data!TBWHTType`) — and they are NOT sequential, so treat them as a lookup,
            never a range. `04` = ภ.ง.ด.3 (payments to an individual), `53` = ภ.ง.ด.53 (payments to a
            juristic person). A guard paid on a 13-digit national-id PromptPay proxy is an individual.
        wht_pay_type_code:
          type: string
          example: '1'
          description: |
            `Master_data!TBWHTPayType`: `1` ผู้จ่ายออกครั้งเดียว, `2` ออกให้ตลอดไป, `3` หักภาษี ณ ที่จ่าย,
            `4` อื่นๆ. `4` is a real SCB code but NOT supported here — it requires a free-text remark
            on the certificate that pguard does not model, so saving it is a 400.
        wht_income_type_code:
          type: string
          example: '5'
          description: |
            Assessable-income type (`Master_data!TBIncomeType`). Fifteen codes, and they are NOT
            integers: `1`, `2`, `3`, `4a`, `4b1.1`…`4b1.4`, `4b2.1`…`4b2.5`, `5`, `6`. Security
            service fee is `5`.
        wht_income_desc: { type: string, example: 'ค่าบริการรักษาความปลอดภัย' }
        wht_rate_percent: { type: string, example: '3', description: 'Withholding rate percent (exact decimal, string).' }
        product_code: { type: string, example: 'PPY', description: SCB product (PromptPay credit). }
        fee_charge_code:
          type: string
          enum: ['OUR', 'BEN']
          example: 'OUR'
          description: |
            Who bears the transfer fee (`Master_data!TBFeeOther`) — it rides EVERY credit line
            (`TXNDET` field 8) and the bank requires it. `OUR` = the company pays the fee, which is
            the payout default because it is the only value that leaves the guard receiving exactly
            the amount our ledger records; `BEN` deducts the fee from the guard's credit, so our
            books and the bank's would disagree about the same transfer.
        sms_notify:
          type: boolean
          example: false
          description: |
            Whether SCB should SMS the guard about the transfer (`TXNDET` fields 9/10). OFF by
            default: the bank bills per message and the number is the guard's login phone. It does
            NOT affect how the money is addressed — the same phone is still the PromptPay `MOB`
            proxy for a guard with no tax id.
        max_transfer_per_txn:
          type: string
          nullable: true
          example: '2000000'
          description: |
            Per-transaction transfer cap in THB (exact decimal, string; null = uncapped). A guard
            whose TOTAL transfer exceeds it is EXCLUDED from the batch with a reason rather than
            written as a line SCB would reject. Default `2000000` — the SMART/ORFT/PromptPay limit
            for a `NAT`/`MOB` proxy (the ฿10,000 figure applies only to a 15-digit E-Wallet proxy).
        updated_at: { type: string, format: date-time, nullable: true, description: null until first saved. }

    UpdatePayoutConfigRequest:
      type: object
      description: Every field optional — a null field keeps the stored value (or the default on first write).
      properties:
        debit_account: { type: string, nullable: true }
        fee_debit_account: { type: string, nullable: true }
        revenue_account:
          type: string
          nullable: true
          description: |
            The company account the platform-cut sweep credits. Must be a valid SCB account (10 digits
            + check digit) or it is a 400 on the settings screen rather than a bounced money file.
            Null keeps the stored value.
        wht_form_type_code:
          type: string
          nullable: true
          description: |
            One of the seven ภ.ง.ด. codes (`01`, `03`, `04`, `11`, `12`, `13`, `53`); anything else
            is a 400. They are not a range — validate by lookup.
        wht_pay_type_code:
          type: string
          nullable: true
          description: |
            `1`, `2` or `3`. `4` (อื่นๆ) is refused with its own message: SCB requires a free-text
            pay-type remark alongside it and there is no field for one yet.
        wht_income_type_code:
          type: string
          nullable: true
          description: One of the fifteen `TBIncomeType` codes (`1`…`6`, `4a`, `4b1.1`…`4b2.5`); anything else is a 400.
        wht_income_desc: { type: string, nullable: true }
        fee_charge_code:
          type: string
          nullable: true
          description: |
            `OUR` (company pays the transfer fee — recommended) or `BEN` (deducted from the guard);
            anything else is a 400. Null keeps the stored value, so this mandatory credit-line field
            can never be blanked through this API.
        sms_notify:
          type: boolean
          nullable: true
          description: Opt in/out of the bank's SMS to the guard. Null keeps the stored value.
        wht_rate_percent: { type: string, nullable: true, description: '0–100 (exact decimal, string).' }
        max_transfer_per_txn:
          type: string
          nullable: true
          description: |
            Per-transaction transfer cap in THB (exact decimal, string). Must not be negative (400).
            Null keeps the stored value — like every field here, the cap cannot be CLEARED through
            this API, only changed.

    ExportDeductionRequest:
      type: object
      description: |
        All fields optional; an absent body sweeps the whole unswept backlog. There is deliberately NO
        per-job tick list — an `OAT` file credits ONE destination, so there is nobody to choose
        between, and sweeping half a day's cut would leave the rest looking unswept for a reason
        nobody could reconstruct later.
      properties:
        from:
          type: string
          format: date
          nullable: true
          description: Inclusive first day the job was SETTLED (Thai local day).
        to:
          type: string
          format: date
          nullable: true
          description: Inclusive last day the job was SETTLED (Thai local day).
        value_date:
          type: string
          format: date
          nullable: true
          description: |
            The batch's effective/value date. Omit for "today in Bangkok, rolled off a weekend"; set
            it to schedule a later settlement day or to step over a Thai public holiday (the platform
            has no holiday calendar). A PAST date is a 400 — SCB rejects a back-dated batch.

    ExcludedJob:
      type: object
      description: |
        A job whose cut could NOT be computed. Its cut is counted nowhere and it is NOT marked swept,
        so it reappears in the next preview instead of silently contributing zero — a report that
        under-states the platform's cut is worse than one that says "N jobs unknown".
      required: [payment_id, booking_id, code, reason]
      properties:
        payment_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        code:
          type: string
          enum: ['NOT_SETTLED', 'NO_VAT_SPLIT', 'NO_PRICING_SNAPSHOT', 'DOES_NOT_RECONCILE']
          description: |
            `NOT_SETTLED` — the reconcile has not run, so the cut is not final yet (it will be next
            run). `NO_VAT_SPLIT` — the charge predates the VAT split, so our money cannot be told from
            the Revenue Department's. `NO_PRICING_SNAPSHOT` — the charge predates the pricing snapshot;
            NOT recoverable, because `subtotal = base_fee × hours × guards + tip` is one equation in
            four unknowns and booking's current row is not what the job was billed on.
            `DOES_NOT_RECONCILE` — the stored money columns disagree with each other; a human question,
            never a number to sweep.
        reason: { type: string, description: The Thai sentence the admin reads. }

    PreviewCutJob:
      type: object
      description: One job's cut, every component itemised so an accountant can see WHY it contributes what it does.
      required:
        - payment_id
        - booking_id
        - settled_on
        - commission
        - cancellation_fee
        - tip
        - unpaid_guard_share
        - rounding_adjustment
        - uncollected
        - amount
      properties:
        payment_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        settled_on: { type: string, format: date, description: The Bangkok day the job was settled — the basis the window filters on. }
        commission: { type: string, description: 'Deducted from the guard''s pay (exact decimal, string).' }
        cancellation_fee: { type: string, description: The VAT-EXCLUSIVE part of a retained cancellation fee. }
        tip: { type: string, description: 'In the cut only because of a KNOWN, DEFERRED bug: the customer is billed a gratuity the guard never receives.' }
        unpaid_guard_share: { type: string, description: 'In the cut only because of a KNOWN, DEFERRED bug: a booking billed for N guards pays exactly one.' }
        rounding_adjustment: { type: string, description: 'Satang of drift between prorating on the unrounded worked-hours ratio and paying on actual_hours rounded to 2 dp. May be NEGATIVE — the platform really can be marginally out of pocket on one job.' }
        uncollected:
          type: string
          description: |
            BILLED AND NEVER COLLECTED, and SUBTRACTED from `amount`. The completion reconcile's
            `Extra` arm records a settled bill above what the customer pre-paid and captures nothing,
            so this much of the cut is not in the bank. The guard's income and the VAT are owed in
            full whatever the customer transferred, so the whole shortfall falls on the platform's
            share rather than being pro-rated across the components.
        amount: { type: string, description: 'The job''s total cut = the five components LESS `uncollected`. May be NEGATIVE, in which case the job nets DOWN against the rest of the sweep.' }

    DeductionPreview:
      type: object
      description: |
        The per-component totals of a sweep. VAT and the guard income still owed are reported
        ALONGSIDE and are explicitly NOT part of `total_amount` — the question this screen answers
        ("what happens to the money in the receiving account?") has three answers, and showing only
        one invites the other two to be swept by mistake later.

        `total_amount` = `billed_cut_total − uncollected_total`, and both halves are shown: money the
        platform earned on a bill the customer never fully paid must be visible as such, not silently
        missing from the figure an admin reconciles the transfer against.
      required:
        - job_count
        - total_amount
        - commission_total
        - cancellation_fee_total
        - tip_total
        - unpaid_guard_share_total
        - rounding_adjustment_total
        - billed_cut_total
        - uncollected_total
        - vat_not_swept
        - guard_income_not_swept
        - excluded
        - excluded_count
        - jobs
        - jobs_truncated
      properties:
        job_count: { type: integer }
        total_amount: { type: string, description: 'What the file transfers: `billed_cut_total − uncollected_total`.' }
        commission_total: { type: string }
        cancellation_fee_total: { type: string }
        tip_total: { type: string }
        unpaid_guard_share_total: { type: string }
        rounding_adjustment_total: { type: string, description: May be negative. }
        billed_cut_total: { type: string, description: 'Σ of the five components above — what the settled BILLS earned, before asking whether the customer transferred it.' }
        uncollected_total:
          type: string
          description: |
            BILLED AND NEVER COLLECTED — the reconcile's `Extra` arm wrote a settled bill above the
            pre-payment and captured nothing. DEDUCTED from `total_amount`, and given its own line so
            an admin can see that billed-but-unpaid money exists. Sweeping it would move baht that
            never arrived out of an account that also holds the Revenue Department's VAT and the
            guards' unpaid income.
        vat_not_swept: { type: string, description: Collected FOR the Revenue Department and remitted via ภ.พ.30 — shown so it is visible, and NOT part of `total_amount`. }
        guard_income_not_swept: { type: string, description: Still owed to guards out of these jobs; it leaves via the guard-payout file (stream ③), not this one. }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/ExcludedJob' }
          description: Capped at 500 rows; `excluded_count` is the true total.
        excluded_count: { type: integer }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/PreviewCutJob' }
          description: The per-job ledger, capped at 500 rows. The TOTALS above always cover every job in the window.
        jobs_truncated: { type: boolean }
        credit_account_masked:
          type: string
          nullable: true
          description: The destination masked to its last 4. `null` when no revenue account is configured — so the screen can say so instead of the export being where an admin finds out.

    DeductionBatch:
      type: object
      description: One generated platform-cut sweep file (header only).
      required:
        [id, file_ref, system_ref, batch_ref, value_date, total_amount, credit_account,
         recipient_count, job_count, status, has_file, created_at]
      properties:
        id: { type: string, format: uuid }
        file_ref: { type: string, description: '`HEADER` field 1 = batch_ref || `OAT`. NOT the download filename.' }
        system_ref: { type: string, example: 'PGUARD-DEDUCT' }
        batch_ref: { type: string, description: '`BCHDET` field 1 — the bare 12-digit DDMMYYHHMMSS Bangkok stamp.' }
        value_date: { type: string, format: date }
        total_amount: { type: string, description: 'Σ of every job''s cut — and, because an OAT batch credits one destination, also the single TXNDET amount.' }
        credit_account: { type: string, description: The company account this file credited, SNAPSHOTTED (the config may be edited later; a generated money file must still say where its money went). }
        recipient_count: { type: integer, description: 'Always 1 — an OAT batch credits ONE destination. `job_count` is the number that means something here.' }
        job_count: { type: integer, description: How many jobs' cuts this sweep collected. }
        status:
          type: string
          enum: [generated, uploaded, confirmed, rejected, voided]
          description: |
            Lifecycle: `generated → uploaded → confirmed | rejected`; `generated`/`uploaded`/`rejected`
            → `voided`. `confirmed` and `voided` are TERMINAL — the same table the payout and refund
            files walk.
        status_note: { type: string, nullable: true }
        void_reason: { type: string, nullable: true }
        has_file: { type: boolean, description: Whether the stored text exists, i.e. whether the re-download will work. }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        uploaded_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        voided_by: { type: string, format: uuid, nullable: true }

    DeductionBatchItem:
      type: object
      description: |
        One JOB whose cut a sweep collected — a LEDGER row behind the file's single credit line, not a
        recipient. The components are stored separately so a report can still say what the money WAS
        after the two deferred bugs (tip, guard_count) are fixed.
      required:
        [id, payment_id, booking_id, commission, cancellation_fee, tip, unpaid_guard_share,
         rounding_adjustment, uncollected, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid, description: The swept-marker key. }
        booking_id: { type: string, format: uuid }
        commission: { type: string }
        cancellation_fee: { type: string }
        tip: { type: string }
        unpaid_guard_share: { type: string }
        rounding_adjustment: { type: string, description: May be negative. }
        uncollected: { type: string, description: 'Billed and never collected — SUBTRACTED from `amount`. 0 on every ordinary job.' }
        amount: { type: string, description: 'commission + cancellation_fee + tip + unpaid_guard_share + rounding_adjustment − uncollected (a DB CHECK enforces it). May be negative.' }
        voided_at:
          type: string
          format: date-time
          nullable: true
          description: Set = this job is back in the sweepable backlog (the row is kept as history, not deleted).
        created_at: { type: string, format: date-time }

    DeductionBatchList:
      type: object
      required: [batches, total]
      properties:
        batches:
          type: array
          items: { $ref: '#/components/schemas/DeductionBatch' }
        total: { type: integer, format: int64, description: Total matching batches, so the screen can paginate. }

    DeductionBatchDetail:
      allOf:
        - $ref: '#/components/schemas/DeductionBatch'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DeductionBatchItem' }

    SetDeductionBatchStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: ['uploaded', 'confirmed', 'rejected']
          description: '`voided` is refused here (400) — it must release every job and carry a reason, so it has its own endpoint.'
        note: { type: string, nullable: true, description: Optional free text kept with the change (typically the bank's own rejection message). Max 500 characters. }

    VoidDeductionBatchRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            REQUIRED and non-blank. A void returns every job in the batch to the sweepable backlog,
            and six months later "voided" with no reason cannot be told apart from a mis-click. Max
            500 characters.

    VoidDeductionBatchItemsRequest:
      type: object
      required: [payment_ids, reason]
      properties:
        payment_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 500
          description: The jobs to release. Must be non-empty (an empty list is NOT "all of them" — that is the whole-batch void), and every one must belong to THIS batch and still be live.
        reason:
          type: string
          description: REQUIRED and non-blank — the record of why money the ledger says was collected is going back in the queue. Max 500 characters.

    VatRegisterRow:
      type: object
      description: One line of the output-VAT register — one settled payment.
      required: [date, payment_id, booking_id, customer_id, subtotal, vat, total]
      properties:
        date: { type: string, format: date, description: The Bangkok day the customer PAID — the VAT tax point for a service. }
        payment_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, description: Resolve names in bulk via `POST /admin/users/resolve` — this report does not fan out per row. }
        subtotal: { type: string, description: 'The VAT-EXCLUSIVE settled bill (exact decimal, string).' }
        vat: { type: string, description: The VAT charged on it. }
        total: { type: string, description: '`subtotal + vat` — what the tax invoice totals.' }

    VatRegisterReport:
      type: object
      required: [month, rows, row_count, total_subtotal, total_vat, total_amount]
      properties:
        month: { type: string, example: '2026-09' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/VatRegisterRow' }
        row_count: { type: integer }
        total_subtotal: { type: string }
        total_vat: { type: string, description: The figure transcribed onto the ภ.พ.30. }
        total_amount: { type: string }

    WhtPayeeRow:
      type: object
      description: |
        One payee of the ภ.ง.ด.3/53 filing, summed over every LIVE payout item in the period whose
        batch actually moved money (`generated`/`uploaded`/`confirmed`). A `rejected` batch — the bank
        refused the file — and a `voided` one withheld nothing and are both excluded.
      required: [guard_id, job_count, income, wht]
      properties:
        guard_id: { type: string, format: uuid }
        tax_id:
          type: string
          nullable: true
          description: |
            The payee's TIN, reported AS STORED (a report is the wrong place to silently reshape an
            identifier that goes onto a government form). `null` when profile has no id on file — the
            row is still reported, because the money WAS withheld and the filing has to account for it.
        name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        job_count: { type: integer, format: int64 }
        income: { type: string, description: 'Gross assessable income paid (exact decimal, string).' }
        wht: { type: string, description: Tax withheld — the figure the law requires us to report. }

    WhtPayeeReport:
      type: object
      required:
        [month, form_type_code, income_type_code, income_description, rows, payee_count,
         total_income, total_wht]
      properties:
        month: { type: string, example: '2026-09' }
        form_type_code:
          type: string
          example: '53'
          description: |
            From the stored payout config, reported EXACTLY as stored — `53` = ภ.ง.ด.53 (juristic
            person), `04` = ภ.ง.ด.3 (individual). Which form applies is the operator's TAX decision;
            a report that silently corrected it would be filing something other than what was
            certified to the payee.
        income_type_code: { type: string, example: '5' }
        income_description: { type: string, example: 'ค่าบริการรักษาความปลอดภัย' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/WhtPayeeRow' }
        payee_count: { type: integer }
        total_income: { type: string }
        total_wht: { type: string }

    RefundSourceKind:
      type: string
      description: |
        WHICH table owes a refund obligation. `payment` = `payment.payments` (the completion-reconcile
        overpay, the cancellation refund, the race-lost pre-pay compensator); `slip` =
        `payment.payment_slips` (a genuine double-transfer for an already-paid booking). The two are
        separate tables with separate id spaces, so an obligation is always named by the PAIR.
      enum:
        - payment
        - slip

    RefundSourceRef:
      type: object
      required: [source_kind, source_id]
      description: ONE refund obligation, named exactly as the batch drill-down reports it.
      properties:
        source_kind: { $ref: '#/components/schemas/RefundSourceKind' }
        source_id:
          type: string
          format: uuid
          description: The owing row's id — `payments.id` or `payment_slips.id`, per `source_kind`.

    ExportRefundRequest:
      type: object
      description: |
        Optional narrowing of the refund run. Omit the body entirely (or leave every field null) to
        refund the WHOLE backlog. `customer_ids` is the preview screen's tick list — MANY customers
        ride one file; customers left out stay owed and reappear in the next run (they are not marked
        processed). `from`/`to` bound the days the refunds became owed.
      properties:
        customer_ids:
          type: array
          nullable: true
          maxItems: 500
          description: Refund only these customers (1–500). Null = every refundable customer in the window.
          items: { type: string, format: uuid }
        from: { type: string, format: date, nullable: true, description: 'Inclusive first day the refund became owed (Thai local day).' }
        to: { type: string, format: date, nullable: true, description: 'Inclusive last day the refund became owed (Thai local day).' }
        value_date:
          type: string
          format: date
          nullable: true
          description: |
            The batch's effective/value date. Omit for today in Asia/Bangkok rolled forward off a
            weekend; set it to schedule a later settlement day or to step over a Thai public holiday
            (the platform has no holiday calendar). A PAST date is a 400 — SCB rejects a back-dated
            batch outright.

    PreviewRefundRecipient:
      type: object
      required: [customer_id, name, proxy_masked, obligation_count, amount]
      properties:
        customer_id: { type: string, format: uuid, description: Send this id back in `ExportRefundRequest.customer_ids` to refund exactly this customer. }
        name: { type: string }
        proxy_masked: { type: string, description: PromptPay proxy (the registration phone) masked to its last 4 (PII). }
        obligation_count:
          type: integer
          format: int64
          description: Pending obligations this row's amount covers, across both lanes (one TXNDET returns them all).
        amount: { type: string, description: Total to transfer back (2dp string). }

    ExcludedCustomer:
      type: object
      required: [customer_id, reason, obligation_count]
      properties:
        customer_id: { type: string, format: uuid }
        reason:
          type: string
          description: |
            Thai copy explaining why this customer cannot be refunded in this batch — no customer
            profile, no name for the mandatory recipient column, no usable PromptPay phone, or a total
            outside SCB's per-transaction bounds (the reason names the bound). Their obligations stay
            `pending`; nothing about them is marked processed.
        obligation_count: { type: integer, format: int64 }

    RefundPreview:
      type: object
      required: [recipients, excluded, recipient_count, total_amount]
      properties:
        recipients:
          type: array
          items: { $ref: '#/components/schemas/PreviewRefundRecipient' }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/ExcludedCustomer' }
        recipient_count: { type: integer, format: int64 }
        total_amount: { type: string, description: Σ transfers the file would debit (2dp string). }

    RefundBatch:
      type: object
      description: |
        One generated SCB customer-refund file — the header only (the file text is its own endpoint).
        The lifecycle is `generated → uploaded → confirmed | rejected`, with
        `generated`/`uploaded`/`rejected` also able to go to `voided`; `confirmed` and `voided` are
        TERMINAL.
      required: [id, file_ref, system_ref, batch_ref, value_date, total_amount, recipient_count, status, has_file, created_at]
      properties:
        id: { type: string, format: uuid }
        file_ref: { type: string, description: 'HEADER field 1 = batch_ref || product code (e.g. `070926120000PPY`). NOT the download filename.' }
        system_ref: { type: string, description: 'HEADER field 2 — `PGUARD-REFUND` (the payout file carries `PGUARD-PAYOUT`).' }
        batch_ref: { type: string, description: 'BCHDET field 1 — the bare 12-digit DDMMYYHHMMSS Bangkok stamp.' }
        value_date: { type: string, format: date }
        total_amount: { type: string, description: 'Σ transfers the file debits (2dp string).' }
        recipient_count:
          type: integer
          description: How many CUSTOMERS the file refunds (= TXNDET lines) — NOT how many obligations; a customer owed three refunds is one recipient.
        status:
          type: string
          enum: [generated, uploaded, confirmed, rejected, voided]
        status_note: { type: string, nullable: true, description: Free text kept with the latest status change (typically the bank's own message). }
        void_reason: { type: string, nullable: true }
        has_file:
          type: boolean
          description: Whether the file text is stored and can be re-downloaded.
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        uploaded_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        voided_by: { type: string, format: uuid, nullable: true }

    RefundBatchItem:
      type: object
      description: |
        One refund OBLIGATION settled by this batch (the paid-marker). `voided_at` set = the
        obligation was returned to the refundable queue and its source row is `pending` again; the row
        is kept as history rather than deleted.
      required: [id, source_kind, source_id, booking_id, customer_id, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        source_kind: { $ref: '#/components/schemas/RefundSourceKind' }
        source_id: { type: string, format: uuid, description: 'The owing row — `payments.id` or `payment_slips.id`.' }
        booking_id: { type: string, format: uuid, description: What the refund is for. }
        customer_id: { type: string, format: uuid }
        amount: { type: string, description: 'This obligation''s share of the customer''s transfer (2dp string).' }
        voided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    RefundBatchList:
      type: object
      required: [batches, total]
      properties:
        batches:
          type: array
          items: { $ref: '#/components/schemas/RefundBatch' }
        total: { type: integer, format: int64, description: Total batches matching, independent of the page window. }

    RefundBatchDetail:
      allOf:
        - $ref: '#/components/schemas/RefundBatch'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RefundBatchItem' }

    SetRefundBatchStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [uploaded, confirmed, rejected]
          description: |
            The step to record. `voided` is refused here (400) — voiding must also un-mark every item,
            return its source row to `pending`, and carry a reason, so it has its own endpoint;
            `generated` is only ever the initial state.
        note: { type: string, nullable: true, maxLength: 500, description: Free text kept with the change (e.g. the bank's rejection message). }

    VoidRefundBatchRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the batch is being voided. Must be non-blank — the void returns every obligation in it to the refundable queue.

    VoidRefundBatchItemsRequest:
      type: object
      required: [sources, reason]
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The obligations whose credit lines the bank could not deliver. Every one must belong to
            THIS batch (else 404) and still be live (else 409); exact duplicates are collapsed. An
            empty list is a 400 — it must never be read as "all of them", which is the whole-batch void.
          items: { $ref: '#/components/schemas/RefundSourceRef' }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why these obligations are going back in the queue (e.g. the bank's rejection message). Non-blank.

    ExportPayoutRequest:
      type: object
      description: |
        Optional narrowing of the export run. Omit the body entirely (or leave every field null) to
        pay the WHOLE unpaid backlog for every payable guard. `guard_ids` is the preview screen's
        tick list — MANY guards ride one file; guards left out stay unpaid and reappear in the next
        run (they are not marked paid). `from`/`to` bound the days the jobs were finished.
      properties:
        guard_ids:
          type: array
          nullable: true
          maxItems: 500
          description: Pay only these guards (1–500). Null = every payable guard in the window.
          items: { type: string, format: uuid }
        from: { type: string, format: date, nullable: true, description: 'Inclusive first day jobs were finished (Thai local day).' }
        to: { type: string, format: date, nullable: true, description: 'Inclusive last day jobs were finished (Thai local day).' }
        value_date:
          type: string
          format: date
          nullable: true
          description: |
            The batch's effective/value date. Omit for today in Asia/Bangkok rolled forward off a
            weekend; set it to schedule a later settlement day or to step over a Thai public holiday
            (the platform has no holiday calendar). A PAST date is a 400 — SCB rejects a back-dated
            batch outright.

    PreviewRecipient:
      type: object
      required: [guard_id, name, proxy_masked, job_count, income, wht, transfer]
      properties:
        guard_id: { type: string, format: uuid, description: Send this id back in `ExportPayoutRequest.guard_ids` to pay exactly this guard. }
        name: { type: string }
        proxy_masked: { type: string, description: PromptPay proxy masked to its last 4 (PII). }
        job_count: { type: integer, format: int64, description: Finished jobs this row's amounts cover (one TXNDET pays them all). }
        income: { type: string, description: Assessable income (2dp string). }
        wht: { type: string, description: Withholding tax (2dp string). }
        transfer: { type: string, description: Net PromptPay transfer = income − WHT (2dp string). }

    ExcludedGuard:
      type: object
      required: [guard_id, reason, job_count]
      properties:
        guard_id: { type: string, format: uuid }
        reason:
          type: string
          description: |
            Thai copy explaining why this guard cannot be paid in this batch — no profile row, no
            name, no usable PromptPay proxy, no tax id/address for the ภ.ง.ด. certificate, or a total
            transfer outside SCB's per-transaction bounds (the reason names the bound). The guard's
            jobs stay unpaid in the backlog; nothing is marked paid.
        job_count: { type: integer, format: int64 }

    PayoutBatch:
      type: object
      description: |
        One generated SCB payout file — the header only (the file text is its own endpoint). The
        lifecycle is `generated → uploaded → confirmed | rejected`, with
        `generated`/`uploaded`/`rejected` also able to go to `voided`; `confirmed` and `voided` are
        TERMINAL.
      required: [id, file_ref, system_ref, batch_ref, value_date, total_amount, recipient_count, status, has_file, created_at]
      properties:
        id: { type: string, format: uuid }
        file_ref: { type: string, description: 'HEADER field 1 = batch_ref || product code (e.g. `050926120000PPY`). NOT the download filename.' }
        system_ref: { type: string }
        batch_ref: { type: string, description: 'BCHDET field 1 — the bare 12-digit DDMMYYHHMMSS Bangkok stamp.' }
        value_date: { type: string, format: date }
        total_amount: { type: string, description: 'Σ net transfers the file debits (2dp string).' }
        recipient_count:
          type: integer
          description: How many GUARDS the file pays (= TXNDET lines) — NOT how many bookings; a guard with three finished jobs is one recipient.
        status:
          type: string
          enum: [generated, uploaded, confirmed, rejected, voided]
        status_note: { type: string, nullable: true, description: Free text kept with the latest status change (typically the bank's own message). }
        void_reason: { type: string, nullable: true }
        has_file:
          type: boolean
          description: Whether the file text is stored and can be re-downloaded (false for batches generated before the text was kept).
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        uploaded_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        voided_by: { type: string, format: uuid, nullable: true }

    PayoutBatchItem:
      type: object
      description: |
        One booking PAID by this batch (the paid-marker). `voided_at` set = the batch was voided and
        this booking is back in the payable backlog; the row is kept as history rather than deleted.
      required: [id, booking_id, guard_id, income, wht, transfer_amount, created_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid }
        income: { type: string, description: 'base_fee × actual_hours − commission (2dp string).' }
        wht: { type: string, description: 'Withholding tax for this booking (2dp string).' }
        transfer_amount: { type: string, description: 'income − wht (2dp string).' }
        voided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PayoutBatchList:
      type: object
      required: [batches, total]
      properties:
        batches:
          type: array
          items: { $ref: '#/components/schemas/PayoutBatch' }
        total: { type: integer, format: int64, description: Total batches matching, independent of the page window. }

    PayoutBatchDetail:
      allOf:
        - $ref: '#/components/schemas/PayoutBatch'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PayoutBatchItem' }

    SetPayoutBatchStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [uploaded, confirmed, rejected]
          description: |
            The step to record. `voided` is refused here (400) — voiding must also un-mark every item
            and carry a reason, so it has its own endpoint; `generated` is only ever the initial state.
        note: { type: string, nullable: true, maxLength: 500, description: Free text kept with the change (e.g. the bank's rejection message). }

    VoidPayoutBatchRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the batch is being voided. Must be non-blank — the void returns every booking in it to the payable backlog.

    VoidPayoutBatchItemsRequest:
      type: object
      required: [booking_ids, reason]
      properties:
        booking_ids:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The bookings whose credit lines the bank could not deliver. Every one must belong to THIS
            batch (else 404) and still be live (else 409); duplicates are collapsed. An empty list is
            a 400 — it must never be read as "all of them", which is the whole-batch void.
          items: { type: string, format: uuid }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why these lines are going back in the queue (e.g. the bank's rejection message). Non-blank.

    PayoutPreview:
      type: object
      required: [recipients, excluded, recipient_count, total_transfer, total_wht]
      properties:
        recipients:
          type: array
          items: { $ref: '#/components/schemas/PreviewRecipient' }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/ExcludedGuard' }
        recipient_count: { type: integer, format: int64 }
        total_transfer: { type: string, description: Σ net transfers (2dp string). }
        total_wht: { type: string, description: Σ withholding (2dp string). }
