openapi: 3.1.0
info:
  title: pguard — Payment Service API
  version: 0.1.0
  description: |
    v2 OpenAPI contract for the payment service (the source of truth — codegen produces the
    Rust handler stubs/types, the Dart client, and the TS client). THE MONEY PATH.

    Split from the v1 `../guard-dispatch/services/booking` god-service. v2 is **PRE-PAY then
    SETTLE** — money rules baked into the contract:
      1. **PRE-PAY (createPayment).** After a guard ACCEPTS, the customer pays the ESTIMATE up
         front via `POST /payments { booking_id }`. The amount is computed SERVER-SIDE from the
         authoritative booking (`base_fee × hours × guard_count + tip`, read via the service-JWT'd
         `GET /internal/bookings/{id}`) — the client NEVER sends the amount. This payment GATES
         the booking's en_route transition (booking learns it is paid by consuming
         `pguard.events.payment.completed` → sets `paid_at`; en_route on an unpaid booking is a
         409 PAYMENT_REQUIRED).
      2. **Idempotent pre-pay.** At most ONE completed payment per booking (DB UNIQUE partial
         index + ON CONFLICT). A repeat `POST /payments` returns the existing payment and emits no
         second `payment.completed` — it never double-charges.
      3. **SETTLE on completion, for actual hours.** On `pguard.events.booking.completed` the
         payment service RECONCILES the actual-hours bill = the base
         (`base_fee × booked_hours × guard_count`) prorated to the hours actually worked PLUS the
         full flat tip, against the PRE-PAID amount: refund the overpay (emit
         `payment.refund_processed`) or record the shortfall. The base is NEVER double-charged.
         Booking's server-owned pricing rides the (HMAC-signed) completion event, so the settle is
         self-contained and never trusts a client value.
      4. **Exact money.** All amounts are decimal (`rust_decimal::Decimal` server-side),
         never float (serialized as JSON strings on the wire).
      5. **Transactional outbox.** The pre-pay writes the business row AND the `payment.completed`
         event row in ONE transaction (the settle writes the diff AND `payment.refund_processed`);
         a background relay publishes `pguard.events.payment.*` to NATS JetStream (see
         `contracts/asyncapi/events.yaml`).
      6. **Generic errors.** No enumeration / no internal leak.

    All client-facing paths are served behind the gateway under the `/v1` prefix
    (CLAUDE.md "API versioning"). Success responses use the standard `{ success, data }`
    envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3006
    description: Local dev (payment-service direct)

tags:
  - name: Payments
    description: Customer payments (pre-pay the estimate up front; the bill is settled on completion)

paths:
  /payments:
    post:
      tags: [Payments]
      summary: PRE-PAY a booking's estimate (createPayment)
      description: |
        After a guard ACCEPTS, the customer pays the ESTIMATE up front. The client sends ONLY the
        `booking_id`; the amount is computed SERVER-SIDE from the authoritative booking
        (`base_fee × hours × guard_count + tip`, read via the service-JWT'd internal booking read)
        — the client NEVER sends the amount. Authz: the caller must be the booking's customer and
        the booking must be in a payable state (post-accept, pre-complete) → else 403/409.

        This payment GATES the booking's en_route (booking consumes `payment.completed` → sets
        `paid_at`). Idempotent per booking: a repeat returns the existing payment (200), never a
        second charge.
      operationId: createPayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '200': { $ref: '#/components/responses/PaymentOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Payments]
      summary: List the caller's payments
      description: |
        Payments where the caller is the paying customer, newest first. v2 is POST-PAY: there is
        no customer-initiated charge endpoint — the bill is RAISED on completion by the
        `booking.completed` consumer (base prorated to the hours actually worked + the flat tip)
        and emitted as `pguard.events.payment.completed`. This list is how the customer sees what
        was billed.
      operationId: listPayments
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/earnings:
    get:
      tags: [Payments]
      summary: The assigned guard's earning basis (role=guard)
      description: |
        The caller's COMPLETED (paid) jobs, newest first, each with the clamped `actual_hours`
        ACTUALLY worked (persisted at reconcile; `null` for an even-match / not-yet-reconciled row).
        GUARD-ONLY (keyed on the JWT `sub` → the assigned guard). The guard app pairs each
        `booking_id` with the `base_fee` from its own booking feed and pays `base_fee × actual_hours`
        (falling back to the booked hours when `actual_hours` is null), so a job that finished early
        — and was overpay-refunded to the customer — pays the guard for the hours actually worked
        rather than the full booked estimate. Cancelled/withdrawn (refunded) jobs are excluded (the
        guard earned nothing there).
      operationId: listGuardEarnings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller-guard's completed-job earning rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GuardEarning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payments:
    get:
      tags: [Admin]
      summary: List ALL payments cross-user (role=admin, read-only ledger)
      description: |
        The admin payment ledger — every payment (NOT owner-scoped, unlike `GET /payments`),
        newest first, with optional `status` and `customer_id` filters + limit/offset. Admin
        only (else 403). READ ONLY: there is no manual refund-process action here (v2 refunds
        are event-driven).
      operationId: adminListPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by payment status. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: customer_id
          in: query
          required: false
          description: Restrict to payments placed by this customer (the customer's spend history).
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: All matching payments, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/refunds/queue:
    get:
      tags: [Admin]
      summary: Refund queue — refunds awaiting action / in-progress (role=admin)
      description: |
        The admin refund queue — payments whose completion SETTLE left a refund owed
        (`refund_status` is set), newest first. Feeds the dashboard "แจ้งเตือน / คิวคืนเงิน" card.
        Optional `status` filter (`pending` = awaiting action, `processed` = done; omitted → both)
        + limit/offset. Returns the page of refund rows PLUS the total `count` matching the same
        filter (the badge count, independent of the page window). Admin only (else 403). READ ONLY:
        v2 refunds are event-driven (a settle sets `refund_status='pending'`) — there is no manual
        refund-process action here yet.
      operationId: adminRefundQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by refund-workflow state. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: The refund-queue page + total matching count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefundQueueResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payouts/config:
    get:
      tags: [Admin]
      summary: Guard-payout settings (role=admin)
      description: |
        The single-row company payout settings — the debit accounts the transfers come from + the
        ภ.ง.ด. withholding terms (form/pay/income type + rate). Blank debit accounts + the standard
        ภ.ง.ด.53 defaults when unset (never 404s). Admin only.
      operationId: getPayoutConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The payout settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Save guard-payout settings (role=admin)
      description: Incremental — a field left null keeps the stored value (or the schema default on first write). Admin only.
      operationId: updatePayoutConfig
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePayoutConfigRequest' }
      responses:
        '200':
          description: The saved payout settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payouts/preview:
    get:
      tags: [Admin]
      summary: Preview the guard-payout batch (role=admin)
      description: |
        The UNPAID guard-payout backlog aggregated PER GUARD — who would be paid what (income / WHT
        withheld / net transfer via PromptPay) — PLUS the guards EXCLUDED from the batch with the
        reason (missing name / tax id / a usable PromptPay proxy). Every row carries its `guard_id`
        so the screen can tick a subset and pass those ids to the export. Optional `from`/`to`
        narrow the backlog to jobs finished within a day window. READ ONLY: computes but persists
        nothing and marks nothing paid. Admin only.
      operationId: previewPayout
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive first day the jobs were finished (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive last day the jobs were finished (Thai local day, `YYYY-MM-DD`).
          schema: { type: string, format: date }
      responses:
        '200':
          description: The aggregated preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payouts/export:
    post:
      tags: [Admin]
      summary: Generate + download the SCB guard-payout upload file (role=admin)
      description: |
        Build ONE SCB Business Net bulk-upload file that pays MANY guards — one `TXNDET` (+ `WHTCER`
        when tax is withheld) per guard inside a single `BCHDET` batch, whose totals are the sum of
        every transfer. PERSIST the batch + a per-booking paid-marker (so no job is ever paid twice),
        and return the file as `text/plain` (UTF-8, no BOM) for download.

        The request body is OPTIONAL: send none to pay the whole unpaid backlog (every payable
        guard), or narrow the run with `guard_ids` (the admin's tick list) and/or a `from`/`to` day
        window. Guards left out are neither written to the file nor marked paid.

        409 `PAYOUT_ALREADY_PAID` if a concurrent export already claimed a booking; 400 when the
        selection is empty/invalid, nothing is payable, or the company/debit config is incomplete.
        Admin only.
      operationId: exportPayout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportPayoutRequest' }
      responses:
        '200':
          description: The SCB upload file (pipe-delimited text)
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A job in the batch was already paid out by a concurrent export (`error.code = PAYOUT_ALREADY_PAID`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /admin/reports/revenue:
    get:
      tags: [Admin]
      summary: Revenue-trend analytics (role=admin)
      description: |
        Daily NET revenue (completed charges' effective amount minus refunds) over `[from, to)`,
        plus a month-over-month comparison against the immediately-preceding equal-length window.
        Defaults to the last 30 days; the window is capped at 366 days. Admin only (else 403).
      operationId: adminRevenueReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC3339). Default = `to − 30 days`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC3339). Default = now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Revenue trend + MoM
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RevenueReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/customer-spend:
    get:
      tags: [Admin]
      summary: Per-customer lifetime-spend report (role=admin)
      description: |
        Per-customer lifetime spend — for each customer, the summed effective amount of their
        actually-charged (`completed`) payments (prorated `final_amount` when set, else `amount`).
        Powers the web-admin customers page's spend column. Customers with no completed payment
        are omitted. Admin only (else 403).
      operationId: adminCustomerSpendReport
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Per-customer total spend
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerSpend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get one payment the caller owns (or admin)
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/PaymentOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/promptpay:
    get:
      tags: [Payments]
      summary: PromptPay transfer instructions for a booking (where to pay)
      description: |
        Tells the customer WHERE and HOW MUCH to transfer so they can pay the booking by PromptPay
        and then settle via `POST /payments/{id}/slip`. `{id}` is the BOOKING id. Own-only (the
        booking's customer) → else 403; the booking must be in a payable state (post-accept,
        pre-complete) → else 409.

        Returns the **server-computed estimate** (`base_fee × hours × guard_count + tip` — the SAME
        amount the slip/pre-pay handlers charge; the client never computes it), our **receiving
        account** formatted for display, and the authoritative **EMVCo PromptPay `qr_payload`**.

        The `qr_payload` is generated **server-side, in ONE authoritative place**, from
        `RECEIVING_ACCOUNT` + the estimate — a standard PromptPay/EMVCo merchant-presented QR
        (Payload-Format `00`, Point-of-Initiation `01`, Merchant-Account `29` with the PromptPay
        AID `A000000677010111` + the proxy phone/national-id from `RECEIVING_ACCOUNT`, amount tag
        `54`, currency `53`=764 THB, country `58`=TH, CRC `63`). The mobile renders it as a QR and
        MUST NOT rebuild its own — so the amount + receiver can never drift from the server.

        **Only valid under `PAYMENT_PROVIDER=slip2go`.** Under the simulated default this returns
        409 `SLIP_DISABLED` (there is nowhere to transfer — the client uses `POST /payments`).
        `RECEIVING_ACCOUNT` must be a PromptPay-addressable id (a mobile phone or a national/tax id);
        a plain bank account number cannot be encoded as a PromptPay QR (→ server config error).

        No DB write and no Slip2Go call — purely informational.
      operationId: getPromptPay
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The booking id to pay.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The PromptPay transfer instructions (amount + receiving account + QR payload)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PromptPayInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{id}/slip:
    post:
      tags: [Payments]
      summary: Pay a booking with a Slip2Go-verified transfer slip (REAL money path)
      description: |
        THE MONEY PATH (real). `{id}` is the BOOKING id. The customer transfers to OUR
        PromptPay/bank account, then uploads the transfer SLIP image here. The payment service
        verifies the slip with **Slip2Go** (`POST /verify-slip/qr-image/info`) — confirming it is
        genuine, paid to OUR account (`checkReceiver`), and for at least the server-computed
        estimate (`checkAmount: gte`) — then RE-VALIDATES on our side (amount ≥ estimate, receiver
        == our account) and stamps the payment paid (`payment_method=promptpay_slip`), emitting the
        SAME `payment.completed` event that gates en_route (no new event).

        Available only when the service runs with `PAYMENT_PROVIDER=slip2go`; under the simulated
        default this returns 409 `SLIP_DISABLED`. Own-only (the booking's customer) → else 403.

        **Anti-fraud / dedupe guarantee:** a verified slip's `transRef` and Slip2Go `referenceId`
        are stored under a UNIQUE constraint, so ONE slip can NEVER pay two bookings (a reused slip
        → 409 `SLIP_DUPLICATE`). **Idempotent:** re-submitting the SAME accepted slip returns the
        existing payment (200), no double-charge.

        **Double-pay (a SECOND, different transfer):** if the customer transfers twice for one
        booking (bank-app timeout → two real transfers with distinct `transRef`s), the second,
        DIFFERENT verified slip does NOT return 200 — it is recorded as an unapplied, refundable slip
        (the money is tracked, its refs are reserved against reuse) and the call returns 409
        `ALREADY_PAID_EXTRA_TRANSFER` so the extra transfer is visible and can be refunded.

        Failure modes carry a machine-readable `error.code` (branch on it, not the message):
        `SLIP_VERIFY_FAILED` (Slip2Go rejected it), `SLIP_AMOUNT_TOO_LOW` (underpay),
        `SLIP_WRONG_RECEIVER` (paid to another account), `SLIP_DUPLICATE` (already used),
        `ALREADY_PAID_EXTRA_TRANSFER` (a second, different transfer for an already-paid booking —
        recorded for refund), `SLIP_DISABLED` (provider not slip2go).
      operationId: payWithSlip
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The booking id to settle.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The transfer-slip image (JPEG/PNG/WEBP, ≤ 10 MB).
      responses:
        '200':
          description: Slip verified → booking paid (or an idempotent re-submit of an accepted slip)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlipRejected' }

  /internal/users/{user_id}/export:
    get:
      tags: [Admin]
      summary: PDPA data export aggregation (service-to-service)
      description: |
        Internal read for identity's `ExportClient` fan-out — aggregates this service's slice
        of a user's PDPA data export. Guarded by a **service-JWT** (`serviceAuth`, aud
        `pguard-internal`), never reachable from the public edge (the gateway blocks
        `/internal/`). Returns this service's per-user export blob (an opaque object).
      operationId: internalExportUser
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: This service's per-user export blob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-JWT (aud=pguard-internal); internal endpoints only.

  responses:
    PaymentOk:
      description: The payment
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Payment' }
    BadRequest:
      description: Invalid request body (e.g. malformed/missing booking_id)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but not permitted (wrong role / not your booking / not your payment)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Booking or payment not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Booking is not in a payable state (or already paid)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    SlipRejected:
      description: |
        The slip could not settle the booking. `error.code` is one of: `SLIP_VERIFY_FAILED`
        (Slip2Go rejected the slip), `SLIP_AMOUNT_TOO_LOW` (the slip is below the estimate),
        `SLIP_WRONG_RECEIVER` (paid to another account), `SLIP_DUPLICATE` (the slip was already
        used for a payment), `ALREADY_PAID_EXTRA_TRANSFER` (the booking was already paid and this is
        a SECOND, different real transfer — recorded as unapplied for refund, not a double-charge),
        `SLIP_DISABLED` (the service is not running the slip provider), or the booking is not in a
        payable state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    CreatePaymentRequest:
      type: object
      required: [booking_id]
      description: |
        PRE-PAY request body. Carries ONLY the booking id — the amount is computed SERVER-SIDE from
        the authoritative booking (never sent by the client).
      properties:
        booking_id: { type: string, format: uuid }

    PromptPayInfo:
      type: object
      required: [amount, amount_satang, receiving_account, qr_payload]
      description: |
        PromptPay transfer instructions for a booking. `qr_payload` is the authoritative EMVCo
        PromptPay QR string, generated server-side from `RECEIVING_ACCOUNT` + the estimate — the
        client renders it as a QR and never rebuilds it.
      properties:
        amount:
          type: string
          description: >-
            The server-side estimate to transfer (exact decimal as a string; money rule) —
            VAT-INCLUSIVE (`grand_total`), because that is the sum the customer actually sends.
          example: "2140.00"
        amount_satang:
          type: integer
          format: int64
          description: The same VAT-inclusive estimate in satang (the smallest THB unit, ×100) — a convenience field.
          example: 214000
        receiving_account:
          type: string
          description: OUR receiving PromptPay account, formatted for human display.
          example: "081-234-5678"
        qr_payload:
          type: string
          description: |
            The authoritative EMVCo PromptPay QR payload (render as a QR; do NOT rebuild). Encodes
            the PromptPay AID + our proxy + the amount + currency THB + country TH + CRC.
          example: "00020101021229370016A000000677010111011300668123456785303764540720.005802TH6304ABCD"

    PaymentStatus:
      type: string
      description: Payment lifecycle status.
      enum:
        - pending
        - completed
        - refunded

    Payment:
      type: object
      description: |
        One booking's charge. MONEY VOCABULARY (all exact decimal strings; VAT rate 7%):
          subtotal    = base_fee × hours × guard_count + tip   ← VAT-EXCLUSIVE, the catalog price
          vat_amount  = subtotal × 0.07
          grand_total = subtotal + vat_amount                  ← what the customer actually pays
        `amount` (what was pre-paid) is the VAT-INCLUSIVE `grand_total`, not the subtotal — the
        catalog's rates are quoted before VAT, so the charge is higher than base_fee × hours.
      required: [id, booking_id, customer_id, amount, grand_total, overpaid_amount, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid, nullable: true }
        amount: { type: string, description: 'Exact decimal PRE-PAID — the VAT-INCLUSIVE grand total. Never re-charged on settle.', example: "2140.00" }
        expected_total:
          type: string
          nullable: true
          description: >-
            Server-computed authoritative charge at pre-pay time — the VAT-INCLUSIVE total
            ((base_fee × hours × guards + tip) + VAT 7%), i.e. the same figure as `grand_total`.
          example: "2140.00"
        subtotal:
          type: string
          nullable: true
          description: >-
            VAT-EXCLUSIVE service cost of the CURRENTLY SETTLED bill — base_fee × hours ×
            guard_count + tip (booked hours until the completion settle, actual hours after). This
            is the "ราคาสินค้า/บริการ" line of the tax invoice, NOT what the customer pays. null on
            payments taken before VAT was itemized (their `amount` was the whole charge, VAT-free).
          example: "2000.00"
        vat_amount:
          type: string
          nullable: true
          description: >-
            VAT charged ON TOP of `subtotal` at 7% (`subtotal × 0.07`, rounded to 2dp) — the
            "ภาษีมูลค่าเพิ่ม 7%" line of the tax invoice. Collected for the Revenue Department, so
            it is NOT platform revenue. null on pre-VAT payments.
          example: "140.00"
        grand_total:
          type: string
          description: >-
            `subtotal + vat_amount` — the VAT-INCLUSIVE amount the customer owes, and the
            "จำนวนเงินรวมทั้งสิ้น" line of the tax invoice. ALWAYS present (unlike the two fields it
            is made of): on a pre-VAT row it falls back to `amount`, so this is the payable figure
            for every payment ever taken. Tracks the SETTLED bill — it follows `final_amount` once
            the actual hours are reconciled, and equals `amount` until then.
          example: "2140.00"
        cancellation_fee_charged:
          type: string
          nullable: true
          description: >-
            What was actually KEPT as a cancellation fee when the CUSTOMER cancelled before work
            started: `min(booking.cancellation_fee, amount_paid)` — capped at what was paid, so a
            cancellation can never leave the customer owing money (nothing paid → nothing charged,
            `"0.00"`). The refund is `amount_paid − cancellation_fee_charged`. Stays null/`"0.00"`
            when the GUARD withdrew (not the customer's fault → full refund) and on jobs that were
            never cancelled.
          example: "100.00"
        overpaid_amount:
          type: string
          description: >-
            Excess the customer transferred ABOVE the estimate on a slip payment
            (`max(0, slip_amount − amount)`); `"0.00"` for simulated/exact payments. This money is
            never the platform's — it is ALWAYS refunded on top of the settled bill, so every refund
            (cancel, race-compensator, completion reconcile) returns `amount + overpaid_amount`. NOT
            NULL (present on every row).
          example: "0.00"
        payment_method:
          type: string
          nullable: true
          description: 'How the charge settled: `prepaid` (simulated gateway) or `promptpay_slip` (real Slip2Go-verified transfer).'
          example: promptpay_slip
        status: { $ref: '#/components/schemas/PaymentStatus' }
        final_amount: { type: string, nullable: true, description: 'The reconciled actual-hours bill, set on the completion SETTLE (null until then). May be less than `amount` (overpay refunded) or more (shortfall recorded).' }
        refund_amount: { type: string, nullable: true, description: 'The overpay returned to the customer on the SETTLE when actual hours < pre-paid (null when none owed).' }
        actual_hours: { type: string, nullable: true, description: 'Clamped hours actually worked, recorded on the settle.' }
        refund_status:
          type: string
          nullable: true
          enum: [pending, processed]
          description: '`pending` once a settle refund is owed (an admin/real-gateway marks `processed`); null when no refund.'
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RevenuePoint:
      type: object
      required: [date, revenue, payments]
      properties:
        date: { type: string, format: date }
        revenue:
          type: string
          description: Net revenue that day (exact decimal as a string; money rule). Net of refunds.
          example: "12400.00"
        payments: { type: integer, format: int64, description: Completed charges that day. }

    RevenueReport:
      type: object
      required: [series, total, prev_total]
      properties:
        series:
          type: array
          items: { $ref: '#/components/schemas/RevenuePoint' }
        total: { type: string, description: Net revenue over the window (decimal string). }
        prev_total: { type: string, description: Net revenue over the prior equal-length window. }
        mom_pct:
          type: number
          format: double
          nullable: true
          description: Month-over-month % vs the prior window (null when it had zero revenue).

    CustomerSpend:
      type: object
      required: [customer_id, total]
      properties:
        customer_id: { type: string, format: uuid }
        total:
          type: string
          description: Lifetime spend — summed effective amount of the customer's completed payments (exact decimal as a string; money rule).
          example: "12400.00"

    GuardEarning:
      type: object
      required: [booking_id]
      description: |
        One completed job's earning basis for the assigned guard. `actual_hours` is the clamped
        hours ACTUALLY worked (persisted at reconcile); `null` for an even-match / not-yet-reconciled
        row, where the client falls back to the booked hours. The client computes the guard's take
        from its own booking feed:
          gross      = base_fee × actual_hours          (this guard's share — no guard_count, no tip)
          commission = gross × commission_percent / 100
          net        = gross − commission               ← what the guard is actually paid
        No VAT appears here: VAT is charged to the CUSTOMER on top of the bill and is not part of
        the guard's pay.
      properties:
        booking_id: { type: string, format: uuid }
        actual_hours:
          type: string
          nullable: true
          description: Clamped hours actually worked (exact decimal as a string; money rule). Null when unreconciled.
          example: "2.50"
        commission_percent:
          type: string
          nullable: true
          description: >-
            The booking's SNAPSHOT commission percent (0–100, exact decimal string) DEDUCTED from
            this guard's gross for this job — the platform's cut, taken out of the guard's pay, not
            added to the customer's bill. null on pre-feature bookings → treat as 0 (guard keeps
            the full gross).
          example: "10.00"

    RefundStatus:
      type: string
      description: Refund-workflow state (NOT the payment status — a partial refund stays `completed`).
      enum:
        - pending
        - processed

    RefundQueueItem:
      type: object
      required: [payment_id, booking_id, amount, status, created_at]
      description: |
        One refund-queue row — a payment whose settle or cancellation left a refund owed. `amount`
        is the refund owed (NOT the original charge); `status` is the refund-workflow state. On a
        customer cancellation the row is already NET of the cancellation fee
        (`amount_paid − cancellation_fee_charged`); on a guard withdrawal it is the full amount paid.
      properties:
        payment_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        amount:
          type: string
          description: >-
            The refund owed to the customer (exact decimal as a string; money rule) — already net
            of any `cancellation_fee_charged`, so this is exactly what is sent back.
          example: "1000.00"
        status: { $ref: '#/components/schemas/RefundStatus' }
        created_at: { type: string, format: date-time }

    RefundQueueResponse:
      type: object
      required: [refunds, count]
      description: The refund-queue page (newest first) + the total count matching the same filter.
      properties:
        refunds:
          type: array
          items: { $ref: '#/components/schemas/RefundQueueItem' }
        count:
          type: integer
          format: int64
          description: Total refund rows matching the filter (independent of limit/offset) — the badge count.

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: CONFLICT }
        message: { type: string }

    PayoutConfig:
      type: object
      description: The single-row guard-payout settings (company debit accounts + ภ.ง.ด. terms).
      properties:
        debit_account: { type: string, nullable: true, description: Company account the transfers are debited from. }
        fee_debit_account: { type: string, nullable: true, description: Account the transfer fees are debited from (defaults to the debit account). }
        wht_form_type_code: { type: string, example: '53', description: 'ภ.ง.ด. form code (53 = payments to a company).' }
        wht_pay_type_code: { type: string, example: '1' }
        wht_income_type_code: { type: string, example: '5', description: Assessable-income type (service fee). }
        wht_income_desc: { type: string, example: 'ค่าบริการรักษาความปลอดภัย' }
        wht_rate_percent: { type: string, example: '3', description: 'Withholding rate percent (exact decimal, string).' }
        product_code: { type: string, example: 'PPY', description: SCB product (PromptPay credit). }
        updated_at: { type: string, format: date-time, nullable: true, description: null until first saved. }

    UpdatePayoutConfigRequest:
      type: object
      description: Every field optional — a null field keeps the stored value (or the default on first write).
      properties:
        debit_account: { type: string, nullable: true }
        fee_debit_account: { type: string, nullable: true }
        wht_form_type_code: { type: string, nullable: true }
        wht_pay_type_code: { type: string, nullable: true }
        wht_income_type_code: { type: string, nullable: true }
        wht_income_desc: { type: string, nullable: true }
        wht_rate_percent: { type: string, nullable: true, description: '0–100 (exact decimal, string).' }

    ExportPayoutRequest:
      type: object
      description: |
        Optional narrowing of the export run. Omit the body entirely (or leave every field null) to
        pay the WHOLE unpaid backlog for every payable guard. `guard_ids` is the preview screen's
        tick list — MANY guards ride one file; guards left out stay unpaid and reappear in the next
        run (they are not marked paid). `from`/`to` bound the days the jobs were finished.
      properties:
        guard_ids:
          type: array
          nullable: true
          maxItems: 500
          description: Pay only these guards (1–500). Null = every payable guard in the window.
          items: { type: string, format: uuid }
        from: { type: string, format: date, nullable: true, description: 'Inclusive first day jobs were finished (Thai local day).' }
        to: { type: string, format: date, nullable: true, description: 'Inclusive last day jobs were finished (Thai local day).' }

    PreviewRecipient:
      type: object
      required: [guard_id, name, proxy_masked, job_count, income, wht, transfer]
      properties:
        guard_id: { type: string, format: uuid, description: Send this id back in `ExportPayoutRequest.guard_ids` to pay exactly this guard. }
        name: { type: string }
        proxy_masked: { type: string, description: PromptPay proxy masked to its last 4 (PII). }
        job_count: { type: integer, format: int64, description: Finished jobs this row's amounts cover (one TXNDET pays them all). }
        income: { type: string, description: Assessable income (2dp string). }
        wht: { type: string, description: Withholding tax (2dp string). }
        transfer: { type: string, description: Net PromptPay transfer = income − WHT (2dp string). }

    ExcludedGuard:
      type: object
      required: [guard_id, reason, job_count]
      properties:
        guard_id: { type: string, format: uuid }
        reason: { type: string, description: Why the guard cannot be paid this batch (missing name / tax id / proxy). }
        job_count: { type: integer, format: int64 }

    PayoutPreview:
      type: object
      required: [recipients, excluded, recipient_count, total_transfer, total_wht]
      properties:
        recipients:
          type: array
          items: { $ref: '#/components/schemas/PreviewRecipient' }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/ExcludedGuard' }
        recipient_count: { type: integer, format: int64 }
        total_transfer: { type: string, description: Σ net transfers (2dp string). }
        total_wht: { type: string, description: Σ withholding (2dp string). }
