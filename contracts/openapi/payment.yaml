openapi: 3.1.0
info:
  title: pguard — Payment Service API
  version: 0.1.0
  description: |
    v2 OpenAPI contract for the payment service (the source of truth — codegen produces the
    Rust handler stubs/types, the Dart client, and the TS client). THE MONEY PATH.

    Split from the v1 `../guard-dispatch/services/booking` god-service. v2 is **POST-PAY** —
    money rules baked into the contract:
      1. **No client-initiated charge.** There is no "pay" endpoint. The customer is billed on
         job completion, not up front — so this service exposes only READS (a customer's own
         payment + ledger, the admin cross-user ledger + revenue report, the PDPA export).
      2. **Bill raised on completion, for actual hours.** On `pguard.events.booking.completed`
         the payment service raises the bill = the base (`base_fee × booked_hours × guard_count`)
         prorated to the hours actually worked, PLUS the full flat tip. Booking's server-owned
         pricing rides the (HMAC-signed) event, so payment never reads booking and never trusts
         a client value.
      3. **Idempotent charge.** At most ONE completed payment per booking (DB UNIQUE partial
         index + ON CONFLICT). A redelivered completion event returns the existing payment and
         emits no second `payment.completed` — it never double-charges.
      4. **No refund flow.** Billing for actual usage means there is nothing to refund;
         `payment.refund_processed` is reserved for a future real-gateway dispute/refund path
         and is not emitted under post-pay.
      5. **Exact money.** All amounts are decimal (`rust_decimal::Decimal` server-side),
         never float (serialized as JSON strings on the wire).
      6. **Transactional outbox.** The charge writes the business row AND the `payment.completed`
         event row in ONE transaction; a background relay publishes `pguard.events.payment.*` to
         NATS JetStream (see `contracts/asyncapi/events.yaml`).
      7. **Generic errors.** No enumeration / no internal leak.

    All client-facing paths are served behind the gateway under the `/v1` prefix
    (CLAUDE.md "API versioning"). Success responses use the standard `{ success, data }`
    envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3006
    description: Local dev (payment-service direct)

tags:
  - name: Payments
    description: Customer payment reads (post-pay — the bill is raised on completion, not via an endpoint)

paths:
  /payments:
    get:
      tags: [Payments]
      summary: List the caller's payments
      description: |
        Payments where the caller is the paying customer, newest first. v2 is POST-PAY: there is
        no customer-initiated charge endpoint — the bill is RAISED on completion by the
        `booking.completed` consumer (base prorated to the hours actually worked + the flat tip)
        and emitted as `pguard.events.payment.completed`. This list is how the customer sees what
        was billed.
      operationId: listPayments
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/payments:
    get:
      tags: [Admin]
      summary: List ALL payments cross-user (role=admin, read-only ledger)
      description: |
        The admin payment ledger — every payment (NOT owner-scoped, unlike `GET /payments`),
        newest first, with optional `status` and `customer_id` filters + limit/offset. Admin
        only (else 403). READ ONLY: there is no manual refund-process action here (v2 refunds
        are event-driven).
      operationId: adminListPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by payment status. An unrecognized value returns 400.
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: customer_id
          in: query
          required: false
          description: Restrict to payments placed by this customer (the customer's spend history).
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: All matching payments, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/revenue:
    get:
      tags: [Admin]
      summary: Revenue-trend analytics (role=admin)
      description: |
        Daily NET revenue (completed charges' effective amount minus refunds) over `[from, to)`,
        plus a month-over-month comparison against the immediately-preceding equal-length window.
        Defaults to the last 30 days; the window is capped at 366 days. Admin only (else 403).
      operationId: adminRevenueReport
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC3339). Default = `to − 30 days`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC3339). Default = now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Revenue trend + MoM
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RevenueReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get one payment the caller owns (or admin)
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/PaymentOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/users/{user_id}/export:
    get:
      tags: [Admin]
      summary: PDPA data export aggregation (service-to-service)
      description: |
        Internal read for identity's `ExportClient` fan-out — aggregates this service's slice
        of a user's PDPA data export. Guarded by a **service-JWT** (`serviceAuth`, aud
        `pguard-internal`), never reachable from the public edge (the gateway blocks
        `/internal/`). Returns this service's per-user export blob (an opaque object).
      operationId: internalExportUser
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: This service's per-user export blob
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-JWT (aud=pguard-internal); internal endpoints only.

  responses:
    PaymentOk:
      description: The payment
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Payment' }
    BadRequest:
      description: Invalid request body (e.g. bad method, non-positive or over-cap amount)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but not permitted (wrong role / not your booking / not your payment)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Booking or payment not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Booking is not in a payable state (or already paid)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    PaymentStatus:
      type: string
      description: Payment lifecycle status.
      enum:
        - pending
        - completed
        - refunded

    Payment:
      type: object
      required: [id, booking_id, customer_id, amount, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        guard_id: { type: string, format: uuid, nullable: true }
        amount: { type: string, description: Exact decimal charged, example: "2000.00" }
        expected_total:
          type: string
          nullable: true
          description: Server-computed authoritative total at charge time (base_fee × hours × guards + tip).
          example: "2000.00"
        payment_method: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        final_amount: { type: string, nullable: true, description: 'Legacy proration field; null under post-pay (the charged `amount` is already the final bill).' }
        refund_amount: { type: string, nullable: true, description: 'Legacy refund field; null under post-pay (no refunds — billed for actual hours).' }
        actual_hours: { type: string, nullable: true, description: 'Legacy proration field; null under post-pay.' }
        refund_status:
          type: string
          nullable: true
          enum: [pending, processed]
          description: 'Legacy refund-tracking field; null under post-pay (no refunds emitted).'
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RevenuePoint:
      type: object
      required: [date, revenue, payments]
      properties:
        date: { type: string, format: date }
        revenue:
          type: string
          description: Net revenue that day (exact decimal as a string; money rule). Net of refunds.
          example: "12400.00"
        payments: { type: integer, format: int64, description: Completed charges that day. }

    RevenueReport:
      type: object
      required: [series, total, prev_total]
      properties:
        series:
          type: array
          items: { $ref: '#/components/schemas/RevenuePoint' }
        total: { type: string, description: Net revenue over the window (decimal string). }
        prev_total: { type: string, description: Net revenue over the prior equal-length window. }
        mom_pct:
          type: number
          format: double
          nullable: true
          description: Month-over-month % vs the prior window (null when it had zero revenue).

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: CONFLICT }
        message: { type: string }
