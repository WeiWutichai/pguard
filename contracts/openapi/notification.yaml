openapi: 3.1.0
info:
  title: pguard — Notification Service API
  version: 0.1.0
  description: |
    First v2 OpenAPI contract slice (the source of truth for this service — codegen
    produces the Rust handler stubs/types, the Dart client, and the TS client).

    Ported from v1 `../guard-dispatch/services/notification` with two v2 fixes baked
    into the contract:
      1. **Internal push is authenticated.** v1's `POST /internal/push` had *no auth*
         (audit Issue C — "/internal/push had no auth"). v2 requires a service-JWT
         (`serviceAuth`, audience `pguard-internal`). See CLAUDE.md "Service auth".
      2. **Event-driven by default.** Cross-service triggers (booking.*, chat.*,
         payment.*) arrive via the NATS event bus (see `contracts/asyncapi/events.yaml`),
         not cross-schema writes. The internal push endpoint stays for the rare direct
         fan-out where an event consumer is not appropriate.

    All client-facing paths are served behind the gateway under the `/v1` prefix
    (CLAUDE.md "API versioning"). Success responses use the standard `{ success, data }`
    envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3004
    description: Local dev (notification-service direct)

tags:
  - name: FCM Tokens
    description: Device token management
  - name: Notifications
    description: Notification listing + read state
  - name: Broadcast
    description: Admin bulk-send — composer, drafts, scheduling, history, audience counts
  - name: Internal
    description: Service-to-service endpoints (service-JWT only; not exposed publicly)

paths:
  /tokens:
    post:
      tags: [FCM Tokens]
      summary: Register an FCM device token for the authenticated user
      operationId: registerToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [FCM Tokens]
      summary: Unregister an FCM device token
      operationId: unregisterToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications:
    get:
      tags: [Notifications]
      summary: List the authenticated user's notifications
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - name: role
          in: query
          description: Filter by target role (guard/customer) from payload.
          schema: { type: string, enum: [guard, customer] }
        - name: limit
          in: query
          schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/NotificationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count unread notifications
      operationId: unreadCount
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [guard, customer] }
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllAsRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [guard, customer] }
      responses:
        '200':
          description: Number of notifications marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark a single notification as read
      operationId: markAsRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/send:
    post:
      tags: [Notifications]
      summary: Send a notification (admin only)
      description: |
        Admin-only broadcast/targeted send. Role gating is enforced in the handler
        (403 for non-admin) — an acceptance criterion carried from the v1 audit
        (explicit role checks, no frontend-only gating).
      operationId: sendNotification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendNotificationRequest' }
      responses:
        '200':
          description: The created notification log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/broadcasts:
    post:
      tags: [Broadcast]
      summary: Compose a broadcast (admin only)
      description: |
        Admin-only bulk-send. `mode` selects the action: `now` fans out immediately
        (status → sent), `draft` persists an editable draft, `scheduled` persists for a
        future `scheduled_at` (the service scheduler fires it). Role gating is enforced in
        the handler (403 for non-admin). The audience (`all|guards|customers`) is resolved
        cross-service from profile (service-JWT) — notification owns no user/role registry.
      operationId: createBroadcast
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBroadcastRequest' }
      responses:
        '200':
          description: The created (and, for mode=now, sent) broadcast
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Broadcast' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Broadcast]
      summary: List broadcast campaigns (admin only), newest first
      operationId: listBroadcasts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Broadcast campaign history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/broadcasts/{id}:
    get:
      tags: [Broadcast]
      summary: Get one broadcast campaign (admin only)
      operationId: getBroadcast
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The broadcast campaign
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Broadcast]
      summary: Edit a DRAFT broadcast (admin only)
      description: Only a `draft` broadcast can be edited; a sent/scheduled one returns 409.
      operationId: updateBroadcast
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBroadcastRequest' }
      responses:
        '200':
          description: The updated draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/broadcasts/{id}/send:
    post:
      tags: [Broadcast]
      summary: Send a draft/scheduled broadcast NOW (admin only)
      operationId: sendBroadcast
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The sent broadcast
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/audience-counts:
    get:
      tags: [Broadcast]
      summary: Recipient totals per audience (admin only)
      operationId: audienceCounts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recipient counts for the composer audience picker
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AudienceCounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/automation/rules:
    get:
      tags: [Broadcast]
      summary: List automation rules (admin only)
      description: |
        Admin automation rules (when trigger → if condition → then action + enable toggle).
        AUTHORING/storage only — a stored rule does NOT yet fire; wiring live execution into the
        event consumer is a deliberate follow-up (a production-behavior change).
      operationId: listRules
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Automation rules, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AutomationRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Broadcast]
      summary: Create an automation rule (admin only)
      operationId: createRule
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRuleRequest' }
      responses:
        '200':
          description: The created rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AutomationRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/automation/rules/{id}:
    put:
      tags: [Broadcast]
      summary: Update an automation rule (admin only — commonly the enable toggle)
      operationId: updateRule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRuleRequest' }
      responses:
        '200':
          description: The updated rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AutomationRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Broadcast]
      summary: Delete an automation rule (admin only)
      operationId: deleteRule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/notifications/push:
    post:
      tags: [Internal]
      summary: Service-to-service push (service-JWT only)
      description: |
        Direct service-to-service push, for the rare fan-out where an event consumer is
        not appropriate. **v2 changes:** (1) requires a service-JWT (`serviceAuth`,
        audience `pguard-internal`) — v1's equivalent was unauthenticated; (2)
        notification owns its schema, so this endpoint **persists the notification_logs
        row and then delivers via FCM** — callers no longer write the notification
        schema themselves (that was v1's cross-schema coupling). Not routed through the
        public gateway.
      operationId: internalPush
      security: [{ serviceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendNotificationRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token, audience `pguard-internal`, signed with SERVICE_JWT_SECRET.

  responses:
    EmptyOk:
      description: Success (no payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { type: 'null' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Conflicts with the resource's current state (e.g. editing a non-draft)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    NotificationType:
      type: string
      enum:
        - booking_created
        - guard_assigned
        - guard_en_route
        - guard_arrived
        - booking_completed
        - booking_cancelled
        - chat_message
        - system

    RegisterTokenRequest:
      type: object
      required: [token, device_type]
      properties:
        token: { type: string, description: FCM device token }
        device_type: { type: string, enum: [ios, android, web] }

    DeleteTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    SendNotificationRequest:
      type: object
      required: [user_id, title, body, notification_type]
      properties:
        user_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        payload:
          type: object
          additionalProperties: true
          nullable: true

    NotificationLog:
      type: object
      required: [id, user_id, title, body, notification_type, is_read, sent_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        payload:
          type: object
          additionalProperties: true
          nullable: true
        is_read: { type: boolean }
        sent_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    Audience:
      type: string
      description: Broadcast target audience (resolved to recipients via profile).
      enum: [all, guards, customers]

    BroadcastStatus:
      type: string
      enum: [draft, scheduled, sent]

    BroadcastMode:
      type: string
      description: How a composed broadcast is dispatched.
      enum: [now, draft, scheduled]

    CreateBroadcastRequest:
      type: object
      required: [audience, title, body, mode]
      properties:
        audience: { $ref: '#/components/schemas/Audience' }
        title: { type: string }
        body: { type: string }
        notification_type:
          allOf: [{ $ref: '#/components/schemas/NotificationType' }]
          description: Defaults to `system` when omitted.
        mode: { $ref: '#/components/schemas/BroadcastMode' }
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Required (future) when `mode = scheduled`.

    UpdateBroadcastRequest:
      type: object
      description: Edit a DRAFT broadcast — all fields optional (only provided fields change).
      properties:
        audience: { $ref: '#/components/schemas/Audience' }
        title: { type: string, nullable: true }
        body: { type: string, nullable: true }
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        scheduled_at: { type: string, format: date-time, nullable: true }

    Broadcast:
      type: object
      required: [id, audience, title, body, notification_type, status, recipient_count, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: '#/components/schemas/Audience' }
        title: { type: string }
        body: { type: string }
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        status: { $ref: '#/components/schemas/BroadcastStatus' }
        scheduled_at: { type: string, format: date-time, nullable: true }
        recipient_count: { type: integer, format: int32 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }

    AudienceCounts:
      type: object
      required: [all, guards, customers]
      properties:
        all: { type: integer, format: int64 }
        guards: { type: integer, format: int64 }
        customers: { type: integer, format: int64 }

    AutomationRule:
      type: object
      required: [id, trigger_key, action_key, is_enabled, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        trigger_key: { type: string, description: "When (a fixed admin-facing key set)." }
        condition_text: { type: string, nullable: true }
        action_key: { type: string, description: "Then (a fixed admin-facing key set)." }
        is_enabled: { type: boolean }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRuleRequest:
      type: object
      required: [trigger_key, action_key]
      properties:
        trigger_key: { type: string }
        condition_text: { type: string, nullable: true }
        action_key: { type: string }
        is_enabled: { type: boolean, default: true }

    UpdateRuleRequest:
      type: object
      description: All fields optional (COALESCE); the common edit is the enable toggle.
      properties:
        trigger_key: { type: string }
        condition_text: { type: string, nullable: true }
        action_key: { type: string }
        is_enabled: { type: boolean }

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: UNAUTHORIZED }
        message: { type: string }
