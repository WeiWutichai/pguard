openapi: 3.1.0
info:
  title: pguard — Notification Service API
  version: 0.1.0
  description: |
    First v2 OpenAPI contract slice (the source of truth for this service — codegen
    produces the Rust handler stubs/types, the Dart client, and the TS client).

    Ported from v1 `../guard-dispatch/services/notification` with two v2 fixes baked
    into the contract:
      1. **Internal push is authenticated.** v1's `POST /internal/push` had *no auth*
         (audit Issue C — "/internal/push had no auth"). v2 requires a service-JWT
         (`serviceAuth`, audience `pguard-internal`). See CLAUDE.md "Service auth".
      2. **Event-driven by default.** Cross-service triggers (booking.*, chat.*,
         payment.*) arrive via the NATS event bus (see `contracts/asyncapi/events.yaml`),
         not cross-schema writes. The internal push endpoint stays for the rare direct
         fan-out where an event consumer is not appropriate.

    All client-facing paths are served behind the gateway under the `/v1` prefix
    (CLAUDE.md "API versioning"). Success responses use the standard `{ success, data }`
    envelope; errors use `ErrorBody`.
  license:
    name: UNLICENSED

servers:
  - url: https://api.pguard.app/v1
    description: Production (via api-gateway)
  - url: http://localhost:3000/v1
    description: Local dev (via api-gateway)
  - url: http://localhost:3004
    description: Local dev (notification-service direct)

tags:
  - name: FCM Tokens
    description: Device token management
  - name: Notifications
    description: Notification listing + read state
  - name: Internal
    description: Service-to-service endpoints (service-JWT only; not exposed publicly)

paths:
  /tokens:
    post:
      tags: [FCM Tokens]
      summary: Register an FCM device token for the authenticated user
      operationId: registerToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [FCM Tokens]
      summary: Unregister an FCM device token
      operationId: unregisterToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications:
    get:
      tags: [Notifications]
      summary: List the authenticated user's notifications
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - name: role
          in: query
          description: Filter by target role (guard/customer) from payload.
          schema: { type: string, enum: [guard, customer] }
        - name: limit
          in: query
          schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/NotificationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count unread notifications
      operationId: unreadCount
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [guard, customer] }
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllAsRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [guard, customer] }
      responses:
        '200':
          description: Number of notifications marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark a single notification as read
      operationId: markAsRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/send:
    post:
      tags: [Notifications]
      summary: Send a notification (admin only)
      description: |
        Admin-only broadcast/targeted send. Role gating is enforced in the handler
        (403 for non-admin) — an acceptance criterion carried from the v1 audit
        (explicit role checks, no frontend-only gating).
      operationId: sendNotification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendNotificationRequest' }
      responses:
        '200':
          description: The created notification log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/notifications/push:
    post:
      tags: [Internal]
      summary: Service-to-service push (service-JWT only)
      description: |
        Direct service-to-service push, for the rare fan-out where an event consumer is
        not appropriate. **v2 changes:** (1) requires a service-JWT (`serviceAuth`,
        audience `pguard-internal`) — v1's equivalent was unauthenticated; (2)
        notification owns its schema, so this endpoint **persists the notification_logs
        row and then delivers via FCM** — callers no longer write the notification
        schema themselves (that was v1's cross-schema coupling). Not routed through the
        public gateway.
      operationId: internalPush
      security: [{ serviceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendNotificationRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (HS256). Also accepted as the `access_token` cookie for web.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token, audience `pguard-internal`, signed with SERVICE_JWT_SECRET.

  responses:
    EmptyOk:
      description: Success (no payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseEnvelope'
              - type: object
                properties:
                  data: { type: 'null' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    NotificationType:
      type: string
      enum:
        - booking_created
        - guard_assigned
        - guard_en_route
        - guard_arrived
        - booking_completed
        - booking_cancelled
        - chat_message
        - system

    RegisterTokenRequest:
      type: object
      required: [token, device_type]
      properties:
        token: { type: string, description: FCM device token }
        device_type: { type: string, enum: [ios, android, web] }

    DeleteTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    SendNotificationRequest:
      type: object
      required: [user_id, title, body, notification_type]
      properties:
        user_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        payload:
          type: object
          additionalProperties: true
          nullable: true

    NotificationLog:
      type: object
      required: [id, user_id, title, body, notification_type, is_read, sent_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        payload:
          type: object
          additionalProperties: true
          nullable: true
        is_read: { type: boolean }
        sent_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    ApiResponseEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string, nullable: true }
      description: Standard success envelope; concrete `data` shape is composed per-endpoint.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: UNAUTHORIZED }
        message: { type: string }
