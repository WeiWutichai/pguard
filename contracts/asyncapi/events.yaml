asyncapi: 3.0.0
info:
  title: pguard — Event Bus (NATS JetStream)
  version: 0.1.0
  description: |
    Source of truth for cross-service events. Mirrors `packages/shared-events`
    (`topics` constants + `EventEnvelope`). Every message is wrapped in the standard
    envelope; JetStream durable consumers are **at-least-once**, so consumers MUST
    dedupe on `event_id` and use idempotency keys (CLAUDE.md "NATS topics").

    Naming: `pguard.events.<bounded_context>.<event_name>`.

    **Signed envelopes (forged-event defense).** The NATS bus has no producer authentication,
    so every message carries a detached **HMAC-SHA256 signature** of its exact payload bytes in
    the NATS header `X-Pguard-Signature` (lowercase hex), keyed by the shared
    `EVENT_SIGNING_SECRET`. Producers attach it via the single signed-publish helper
    (`shared_events::publish_signed`); **consumers MUST verify it (`shared_events::verify_message`)
    BEFORE any dedupe/business logic** and DROP (ack-without-apply, increment
    `nats_rejected_events_total`) any message whose signature is missing or invalid. This is the
    event-bus counterpart of the request-path Service-JWT, and is what makes a forged
    `user.approved`/`user.compromised` (which would approve or force-revoke an arbitrary account)
    unactable. The signature is a transport-layer NATS header, not a field of the JSON envelope.

defaultContentType: application/json

servers:
  jetstream:
    host: localhost:4222
    protocol: nats
    description: Local dev NATS with JetStream (infra/docker/docker-compose.yml).

channels:
  bookingJobAccepted:
    address: pguard.events.booking.job_accepted
    messages: { jobAccepted: { $ref: '#/components/messages/BookingJobAccepted' } }
  bookingDeclined:
    address: pguard.events.booking.declined
    messages: { declined: { $ref: '#/components/messages/GenericBookingEvent' } }
  bookingCancelled:
    address: pguard.events.booking.cancelled
    messages: { cancelled: { $ref: '#/components/messages/GenericBookingEvent' } }
  bookingCompleted:
    address: pguard.events.booking.completed
    messages: { completed: { $ref: '#/components/messages/BookingCompleted' } }
  bookingGuardEnRoute:
    address: pguard.events.booking.guard_en_route
    messages: { enRoute: { $ref: '#/components/messages/GenericBookingEvent' } }
  bookingArrived:
    address: pguard.events.booking.arrived
    messages: { arrived: { $ref: '#/components/messages/GenericBookingEvent' } }
  paymentCompleted:
    address: pguard.events.payment.completed
    messages: { paymentCompleted: { $ref: '#/components/messages/PaymentCompleted' } }
  paymentRefundProcessed:
    address: pguard.events.payment.refund_processed
    messages: { refundProcessed: { $ref: '#/components/messages/PaymentRefundProcessed' } }
  ratingSubmitted:
    address: pguard.events.rating.submitted
    messages: { ratingSubmitted: { $ref: '#/components/messages/RatingSubmitted' } }
  callingInitiated:
    address: pguard.events.calling.initiated
    messages: { initiated: { $ref: '#/components/messages/GenericCallEvent' } }
  callingAccepted:
    address: pguard.events.calling.accepted
    messages: { accepted: { $ref: '#/components/messages/GenericCallEvent' } }
  callingRejected:
    address: pguard.events.calling.rejected
    messages: { rejected: { $ref: '#/components/messages/GenericCallEvent' } }
  callingEnded:
    address: pguard.events.calling.ended
    messages: { ended: { $ref: '#/components/messages/GenericCallEvent' } }
  chatMessageSent:
    address: pguard.events.chat.message_sent
    messages: { messageSent: { $ref: '#/components/messages/ChatMessageSent' } }
  userCompromised:
    address: pguard.events.user.compromised
    messages: { compromised: { $ref: '#/components/messages/UserCompromised' } }
  userApproved:
    address: pguard.events.user.approved
    messages: { approved: { $ref: '#/components/messages/UserApproved' } }
  # pguard.events.user.rejected is a RESERVED topic (shared-events) with no producer/consumer
  # yet — login already blocks non-approved accounts. Documented here when a consumer is added.

operations:
  onBookingJobAccepted:
    action: receive
    channel: { $ref: '#/channels/bookingJobAccepted' }
    summary: notification + presence + payment consume this.
  onBookingCompleted:
    action: receive
    channel: { $ref: '#/channels/bookingCompleted' }
    summary: payment consumes this → finalize proration/refund (idempotent by event_id).
  onPaymentCompleted:
    action: receive
    channel: { $ref: '#/channels/paymentCompleted' }
    summary: booking + notification consume this.
  onUserCompromised:
    action: receive
    channel: { $ref: '#/channels/userCompromised' }
    summary: identity consumes this → force-revoke-all sessions for the user.
  onUserApproved:
    action: receive
    channel: { $ref: '#/channels/userApproved' }
    summary: >-
      Producer = profile (emitted via its transactional outbox, atomic with the
      guard_profiles approval flip). Consumer = identity → flips its OWN
      users.approval_status to 'approved' so the account can log in (idempotent by event_id).
      Closes the approval→login loop with no cross-schema write.

components:
  messages:
    BookingJobAccepted:
      name: BookingJobAccepted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_JobAccepted' }
    GenericBookingEvent:
      name: GenericBookingEvent
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_BookingRef' }
    BookingCompleted:
      name: BookingCompleted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_BookingCompleted' }
    PaymentCompleted:
      name: PaymentCompleted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_PaymentRef' }
    PaymentRefundProcessed:
      name: PaymentRefundProcessed
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_RefundRef' }
    RatingSubmitted:
      name: RatingSubmitted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_RatingRef' }
    GenericCallEvent:
      name: GenericCallEvent
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_CallRef' }
    ChatMessageSent:
      name: ChatMessageSent
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_ChatRef' }
    UserCompromised:
      name: UserCompromised
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_UserRef' }
    UserApproved:
      name: UserApproved
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_UserApproved' }

  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, occurred_at, correlation_id, payload]
      properties:
        event_id: { type: string, format: uuid, description: Dedupe key (at-least-once). }
        event_type: { type: string, example: pguard.events.booking.job_accepted }
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string, format: uuid }
        payload: { type: object }

    EnvelopeOf_JobAccepted:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, guard_id, customer_id]
              properties:
                booking_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }

    EnvelopeOf_BookingRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, nullable: true }

    EnvelopeOf_BookingCompleted:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, booked_hours]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, nullable: true }
                booked_hours: { type: integer, description: Hours booked (proration denominator). }
                actual_seconds:
                  type: integer
                  format: int64
                  nullable: true
                  description: >-
                    Seconds actually worked (now − work_started_at). Null if the guard never
                    started → payment keeps the full charge (no proration basis). The payment
                    service consumes this to finalize proration/refund idempotently.

    EnvelopeOf_PaymentRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [payment_id, booking_id, guard_id, amount]
              properties:
                payment_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, description: Recipient (the paid guard). }
                amount: { type: string, description: Decimal string (THB). }

    EnvelopeOf_RefundRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [payment_id, booking_id, refund_amount, final_amount]
              properties:
                payment_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                refund_amount: { type: string, description: Decimal string (THB) refunded. }
                final_amount: { type: string, description: Decimal string (THB) charged after proration. }

    EnvelopeOf_RatingRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [rating_id, booking_id, guard_id, score]
              properties:
                rating_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, description: Recipient (the reviewed guard). }
                score: { type: integer, minimum: 1, maximum: 5 }

    EnvelopeOf_CallRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [call_id, booking_id]
              properties:
                call_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }

    EnvelopeOf_ChatRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [message_id, conversation_id, sender_id, recipient_id]
              properties:
                message_id: { type: string, format: uuid }
                conversation_id: { type: string, format: uuid }
                sender_id: { type: string, format: uuid }
                recipient_id: { type: string, format: uuid, description: The other participant (notification target). }

    EnvelopeOf_UserRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [user_id, reason]
              properties:
                user_id: { type: string, format: uuid }
                reason: { type: string, example: refresh_token_reuse_detected }

    EnvelopeOf_UserApproved:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string, format: uuid }
                role: { type: string, enum: [guard, customer], description: Informational; identity flips by user_id. }
                approved_at: { type: string, format: date-time }
