asyncapi: 3.0.0
info:
  title: pguard — Event Bus (NATS JetStream)
  version: 0.1.0
  description: |
    Source of truth for cross-service events. Mirrors `packages/shared-events`
    (`topics` constants + `EventEnvelope`). Every message is wrapped in the standard
    envelope; JetStream durable consumers are **at-least-once**, so consumers MUST
    dedupe on `event_id` and use idempotency keys (CLAUDE.md "NATS topics").

    Naming: `pguard.events.<bounded_context>.<event_name>`.

    **Signed envelopes (forged-event defense).** The NATS bus has no producer authentication,
    so every message carries a detached **HMAC-SHA256 signature** of its exact payload bytes in
    the NATS header `X-Pguard-Signature` (lowercase hex), keyed by the shared
    `EVENT_SIGNING_SECRET`. Producers attach it via the single signed-publish helper
    (`shared_events::publish_signed`); **consumers MUST verify it (`shared_events::verify_message`)
    BEFORE any dedupe/business logic** and DROP (ack-without-apply, increment
    `nats_rejected_events_total`) any message whose signature is missing or invalid. This is the
    event-bus counterpart of the request-path Service-JWT, and is what makes a forged
    `user.approved`/`user.compromised` (which would approve or force-revoke an arbitrary account)
    unactable. The signature is a transport-layer NATS header, not a field of the JSON envelope.

defaultContentType: application/json

servers:
  jetstream:
    host: localhost:4222
    protocol: nats
    description: Local dev NATS with JetStream (infra/docker/docker-compose.yml).

channels:
  bookingRequested:
    address: pguard.events.booking.requested
    description: >-
      Customer created a booking request (status = requested, no guard yet). Producer =
      booking (transactional outbox, atomic with the bookings insert). Consumer =
      notification → data-push every ONLINE guard a "งานใหม่ใกล้คุณ"/"New job nearby" so they
      can open the job and accept it. NOT a lifecycle status change for the customer's
      booking-status WS — the gateway's `status_from_topic` returns None for it (the customer
      already knows they just created the booking).
    messages: { requested: { $ref: '#/components/messages/BookingRequested' } }
  bookingJobAccepted:
    address: pguard.events.booking.job_accepted
    messages: { jobAccepted: { $ref: '#/components/messages/BookingJobAccepted' } }
  bookingDeclined:
    address: pguard.events.booking.declined
    description: >-
      The ASSIGNED guard withdrew PRE-ARRIVAL (`accepted → declined` or `en_route → declined`)
      → terminal `declined`. Producer = booking (transactional outbox, atomic with the status
      write). Consumers = payment (FULL-REFUND when the booking was already paid) + notification
      (tells the customer their guard backed out). Carries the mandatory `cancellation_reason`
      on top of the shared booking-ref keys, so a consumer renders WHY without reading back
      into booking.
    messages: { declined: { $ref: '#/components/messages/BookingCancellation' } }
  bookingCancelled:
    address: pguard.events.booking.cancelled
    description: >-
      The CUSTOMER (or an admin) cancelled a PRE-ARRIVAL booking → terminal `cancelled`.
      Producer = booking (transactional outbox, atomic with the status write). Consumers =
      payment (FULL-REFUND when the booking was already paid) + notification. Same
      `cancellation_reason` payload extension as `booking.declined`, differing only in the
      code set (customer codes, not guard ones).
    messages: { cancelled: { $ref: '#/components/messages/BookingCancellation' } }
  bookingCompleted:
    address: pguard.events.booking.completed
    messages: { completed: { $ref: '#/components/messages/BookingCompleted' } }
  bookingGuardEnRoute:
    address: pguard.events.booking.guard_en_route
    messages: { enRoute: { $ref: '#/components/messages/GenericBookingEvent' } }
  bookingArrived:
    address: pguard.events.booking.arrived
    messages: { arrived: { $ref: '#/components/messages/GenericBookingEvent' } }
  bookingCompletionRequested:
    address: pguard.events.booking.completion_requested
    description: >-
      Guard REQUESTED completion (arrived → pending_completion); the customer must now review and
      approve (→ completed) or reject (→ arrived). Producer = booking (transactional outbox, atomic
      with the status write). A customer-facing LIFECYCLE status change: the gateway's
      `status_from_topic` maps it to the `pending_completion` wire status so the customer's
      booking-status WS updates live (no manual refresh); notification pushes the customer
      "เจ้าหน้าที่ขอปิดงาน — โปรดตรวจสอบ" / "Guard requested completion — please review". Same
      booking-ref payload (booking_id/customer_id/guard_id) as the other lifecycle events.
    messages: { completionRequested: { $ref: '#/components/messages/GenericBookingEvent' } }
  bookingProgressReported:
    address: pguard.events.booking.progress_reported
    description: >-
      Guard hourly check-in submitted (photo + GPS persisted by booking). Producer =
      booking (transactional outbox, atomic with the progress_reports insert). No consumer
      yet — the notification service will use this to tell the customer their guard
      checked in (follow-up slice). NOT a lifecycle status change: the gateway's booking
      status WS ignores it (status_from_topic → None).
    messages: { progressReported: { $ref: '#/components/messages/BookingProgressReported' } }
  paymentCompleted:
    address: pguard.events.payment.completed
    description: >-
      Emitted by payment on a successful PRE-PAY (the customer paid the estimate up front). Booking
      consumes it to un-gate — set paid_at, which allows the en_route transition; notification
      consumes it to push the customer "ชำระเงินสำเร็จ" and the guard "ลูกค้าชำระเงินแล้ว".
    messages: { paymentCompleted: { $ref: '#/components/messages/PaymentCompleted' } }
  paymentRefundProcessed:
    address: pguard.events.payment.refund_processed
    description: >-
      Emitted by payment on a RECONCILE refund: on booking.completed the actual-hours bill is
      diffed against the PRE-PAID amount, and when the customer worked fewer hours than booked the
      overpay is refunded (the base is never double-charged). Not emitted when actual ≥ paid.
    messages: { refundProcessed: { $ref: '#/components/messages/PaymentRefundProcessed' } }
  ratingSubmitted:
    address: pguard.events.rating.submitted
    messages: { ratingSubmitted: { $ref: '#/components/messages/RatingSubmitted' } }
  callingInitiated:
    address: pguard.events.calling.initiated
    messages: { initiated: { $ref: '#/components/messages/GenericCallEvent' } }
  callingAccepted:
    address: pguard.events.calling.accepted
    messages: { accepted: { $ref: '#/components/messages/GenericCallEvent' } }
  callingRejected:
    address: pguard.events.calling.rejected
    messages: { rejected: { $ref: '#/components/messages/GenericCallEvent' } }
  callingEnded:
    address: pguard.events.calling.ended
    description: >-
      A call reached a terminal state. Producer = calling. Consumers = chat (records a `system`
      call-summary line in the matched pair's thread — see `chat-ws.yaml`) + notification (a
      "missed call" push when the call was never answered). The payload carries everything a
      consumer needs to render the summary WITHOUT a read-back into calling: `call_type`,
      `status`/`end_reason` (→ outcome completed|missed|rejected), `duration_seconds` + `answered_at`
      (→ the duration; null/absent ⟹ never answered), and `caller_id`/`callee_id`.
    messages: { ended: { $ref: '#/components/messages/CallEnded' } }
  chatMessageSent:
    address: pguard.events.chat.message_sent
    messages: { messageSent: { $ref: '#/components/messages/ChatMessageSent' } }
  userCompromised:
    address: pguard.events.user.compromised
    messages: { compromised: { $ref: '#/components/messages/UserCompromised' } }
  userApproved:
    address: pguard.events.user.approved
    messages: { approved: { $ref: '#/components/messages/UserApproved' } }
  # pguard.events.user.rejected is a RESERVED topic (shared-events) with no producer/consumer
  # yet — login already blocks non-approved accounts. Documented here when a consumer is added.

operations:
  onBookingRequested:
    action: receive
    channel: { $ref: '#/channels/bookingRequested' }
    summary: notification consumes this → data-push every online guard "งานใหม่ใกล้คุณ" (new job nearby).
  onBookingJobAccepted:
    action: receive
    channel: { $ref: '#/channels/bookingJobAccepted' }
    summary: notification + presence + payment consume this.
  onBookingCompleted:
    action: receive
    channel: { $ref: '#/channels/bookingCompleted' }
    summary: >-
      payment consumes this → RECONCILE the actual-hours bill against the PRE-PAID amount (refund
      the overpay via refund_processed / record the shortfall; idempotent by event_id).
  onBookingCompletionRequested:
    action: receive
    channel: { $ref: '#/channels/bookingCompletionRequested' }
    summary: >-
      notification consumes this → push the CUSTOMER "เจ้าหน้าที่ขอปิดงาน — โปรดตรวจสอบ" (guard
      requested completion, please review). The gateway booking-status WS also forwards it live as
      the `pending_completion` status so the customer's screen updates without a manual refresh.
  onPaymentRefundProcessed:
    action: receive
    channel: { $ref: '#/channels/paymentRefundProcessed' }
    summary: >-
      Emitted by payment on a reconcile refund (actual hours < pre-paid). A future notification
      consumer tells the customer their overpay was refunded.
  onPaymentCompleted:
    action: receive
    channel: { $ref: '#/channels/paymentCompleted' }
    summary: >-
      booking + notification consume this. booking (durable `booking-payment-completed`,
      idempotent by event_id) stamps `bookings.paid_at`, which UN-GATES the PRE-PAY
      `accepted → en_route` transition (en_route on an unpaid booking is a 409
      PAYMENT_REQUIRED). notification pushes "ชำระเงินสำเร็จ" / "ลูกค้าชำระเงินแล้ว".
  onUserCompromised:
    action: receive
    channel: { $ref: '#/channels/userCompromised' }
    summary: identity consumes this → force-revoke-all sessions for the user.
  onUserApproved:
    action: receive
    channel: { $ref: '#/channels/userApproved' }
    summary: >-
      Producer = profile (emitted via its transactional outbox, atomic with the
      guard_profiles approval flip). Consumer = identity → flips its OWN
      users.approval_status to 'approved' so the account can log in (idempotent by event_id).
      Closes the approval→login loop with no cross-schema write.
  onCallingEnded:
    action: receive
    channel: { $ref: '#/channels/callingEnded' }
    summary: >-
      chat consumes this → records a `system` call-summary line in the matched pair's thread
      (find-or-create the conversation, idempotent by event_id); notification consumes it → a
      "missed call" push when the call was never answered. The chat summary content is a JSON
      string `{"k":"call","ct":<audio|video>,"oc":<completed|missed|rejected>,"ds":<seconds|null>}`
      derived ENTIRELY from this payload (outcome from status/end_reason + answered_at, ds from
      duration_seconds).

components:
  messages:
    BookingRequested:
      name: BookingRequested
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_BookingRequested' }
    BookingJobAccepted:
      name: BookingJobAccepted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_JobAccepted' }
    GenericBookingEvent:
      name: GenericBookingEvent
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_BookingRef' }
    BookingCancellation:
      name: BookingCancellation
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_BookingCancellation' }
    BookingCompleted:
      name: BookingCompleted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_BookingCompleted' }
    BookingProgressReported:
      name: BookingProgressReported
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_ProgressReported' }
    PaymentCompleted:
      name: PaymentCompleted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_PaymentRef' }
    PaymentRefundProcessed:
      name: PaymentRefundProcessed
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_RefundRef' }
    RatingSubmitted:
      name: RatingSubmitted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_RatingRef' }
    GenericCallEvent:
      name: GenericCallEvent
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_CallRef' }
    CallEnded:
      name: CallEnded
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_CallEnded' }
    ChatMessageSent:
      name: ChatMessageSent
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_ChatRef' }
    UserCompromised:
      name: UserCompromised
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_UserRef' }
    UserApproved:
      name: UserApproved
      contentType: application/json
      payload: { $ref: '#/components/schemas/EnvelopeOf_UserApproved' }

  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, occurred_at, correlation_id, payload]
      properties:
        event_id: { type: string, format: uuid, description: Dedupe key (at-least-once). }
        event_type: { type: string, example: pguard.events.booking.job_accepted }
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string, format: uuid }
        payload: { type: object }

    EnvelopeOf_BookingRequested:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, customer_id, address, scheduled_at, hours, guard_count]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid, description: The requesting customer. }
                address: { type: string, description: Free-text site address (for the guard's job card). }
                lat:
                  type: number
                  format: double
                  nullable: true
                  description: >-
                    Site latitude (customer-supplied; null when not provided). Carried so a
                    consumer can radius-rank online guards without reading back into booking.
                lng:
                  type: number
                  format: double
                  nullable: true
                  description: Site longitude (customer-supplied; null when not provided).
                scheduled_at: { type: string, format: date-time, description: When the job is scheduled (RFC3339). }
                hours: { type: integer, format: int32, minimum: 1, description: Booked duration in hours. }
                guard_count: { type: integer, format: int32, minimum: 1, description: Guards requested. }

    EnvelopeOf_JobAccepted:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, guard_id, customer_id]
              properties:
                booking_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }

    EnvelopeOf_BookingRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, nullable: true }

    EnvelopeOf_BookingCancellation:
      description: >-
        The booking-ref keys plus the MANDATORY cancellation reason, shared by
        `booking.cancelled` and `booking.declined`. `cancellation_reason` is always present
        (the API rejects a cancel/decline without one — 400 CANCEL_REASON_REQUIRED), so a
        consumer may rely on it for any event emitted after migration 0009.
        `cancellation_note` is OMITTED ENTIRELY when the customer/guard gave none — the same
        omit-when-absent convention `guard_id` already follows here.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, cancellation_reason]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, nullable: true }
                cancellation_reason:
                  type: string
                  enum: [changed_plan, mistake, not_needed, emergency, sick, cannot_reach, other]
                  description: >-
                    Stable reason code — NEVER localized text (consumers map it to a label).
                    `booking.cancelled` carries a CUSTOMER code (`changed_plan` เปลี่ยนแผน,
                    `mistake` แจ้งผิดพลาด, `not_needed` ไม่ต้องการแล้ว, `other` อื่นๆ);
                    `booking.declined` carries a GUARD code (`emergency` เหตุฉุกเฉินส่วนตัว,
                    `sick` ป่วย, `cannot_reach` เดินทางไปไม่ได้, `other` อื่นๆ). The union is
                    listed here because both events share this payload; treat an unrecognized
                    code as "ไม่ระบุ"/"Not specified" rather than failing the message.
                cancellation_note:
                  type: string
                  maxLength: 500
                  description: >-
                    Free-text detail (trimmed, ≤ 500 characters). OMITTED when none was given;
                    always present when `cancellation_reason` is `other` (the API enforces it —
                    400 CANCEL_NOTE_REQUIRED).

    EnvelopeOf_BookingCompleted:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, customer_id, booked_hours, base_fee, guard_count, tip]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, nullable: true }
                booked_hours: { type: integer, description: Hours booked (proration denominator). }
                actual_seconds:
                  type: integer
                  format: int64
                  nullable: true
                  description: >-
                    Seconds actually worked (now − work_started_at). Null if the guard never
                    started (defensive — completion requires a start). The payment service
                    consumes this to RECONCILE the actual-hours bill against the PRE-PAID amount.
                base_fee:
                  type: string
                  description: >-
                    Booking's server-owned per-guard-hour fee (decimal string). Carried so the
                    reconcile consumer recomputes the bill self-contained, never from a client.
                  example: "500.00"
                guard_count: { type: integer, description: Guards booked. }
                tip:
                  type: string
                  description: Customer's flat tip (decimal string) — billed in full, never prorated.
                  example: "0"

    EnvelopeOf_ProgressReported:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [booking_id, customer_id, guard_id, report_id, hour_number]
              properties:
                booking_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid, description: Notification target (the customer). }
                guard_id: { type: string, format: uuid, description: The reporting (assigned) guard. }
                report_id: { type: string, format: uuid }
                hour_number: { type: integer, format: int32, minimum: 1 }

    EnvelopeOf_PaymentRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [payment_id, booking_id, customer_id, amount]
              properties:
                payment_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                customer_id:
                  type: string
                  format: uuid
                  description: >-
                    The paying customer. Carried so booking can un-gate (set paid_at → allow
                    en_route) and notification can push the customer "ชำระเงินสำเร็จ".
                guard_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    The accepted guard (set in a payable state). Carried so notification can push
                    the guard "ลูกค้าชำระเงินแล้ว".
                amount: { type: string, description: Decimal string (THB) — the PRE-PAID estimate. }

    EnvelopeOf_RefundRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [payment_id, booking_id, refund_amount, final_amount]
              properties:
                payment_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                refund_amount: { type: string, description: Decimal string (THB) refunded. }
                final_amount: { type: string, description: Decimal string (THB) charged after proration. }

    EnvelopeOf_RatingRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [rating_id, booking_id, guard_id, score]
              properties:
                rating_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                guard_id: { type: string, format: uuid, description: Recipient (the reviewed guard). }
                score: { type: integer, minimum: 1, maximum: 5 }

    EnvelopeOf_CallRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [call_id, booking_id]
              properties:
                call_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                call_type:
                  type: string
                  enum: [audio, video]
                  description: >-
                    The media kind. Additive/optional — older producers may omit it; consumers
                    that need it (the chat call-summary line) default to `audio` when absent.

    EnvelopeOf_CallEnded:
      description: >-
        The `pguard.events.calling.ended` payload. Extends [EnvelopeOf_CallRef] (`call_id`,
        `booking_id`, `call_type`) with everything a consumer needs to render the call-summary
        line self-contained — no read-back into calling. ALL the added fields are
        additive/optional so an older producer that only emits `{call_id, booking_id}` still
        validates; a consumer derives the OUTCOME from `status`/`end_reason` (reject vs hangup) and
        whether the call was answered (`answered_at`/`duration_seconds > 0` ⟹ completed, else
        missed), and the DURATION from `duration_seconds` (null/absent ⟹ never answered).
      allOf:
        - $ref: '#/components/schemas/EnvelopeOf_CallRef'
        - type: object
          properties:
            payload:
              type: object
              properties:
                caller_id: { type: string, format: uuid, description: The party who placed the call. }
                callee_id: { type: string, format: uuid, description: The party who received the call. }
                status:
                  type: string
                  enum: [initiated, accepted, connected, completed, rejected, missed, ended]
                  description: The call's terminal status (the chat outcome maps reject→rejected; answered→completed).
                end_reason:
                  type: string
                  nullable: true
                  description: >-
                    Why the call ended (e.g. `rejected`, `hangup`, `no_answer`, `remote_hangup`).
                    A reject-flavoured reason/status ⟹ outcome `rejected`.
                answered_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: >-
                    When the callee answered (null ⟹ never answered ⟹ outcome `missed`,
                    `duration_seconds` = null).
                duration_seconds:
                  type: integer
                  format: int64
                  nullable: true
                  description: >-
                    Seconds the call was connected (the chat summary's `ds`). Null/absent when the
                    call was never answered.

    EnvelopeOf_ChatRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [message_id, conversation_id, sender_id, recipient_id]
              properties:
                message_id: { type: string, format: uuid }
                conversation_id: { type: string, format: uuid }
                sender_id: { type: string, format: uuid }
                recipient_id: { type: string, format: uuid, description: The other participant (notification target). }
                message_type:
                  type: string
                  enum: [text, image, video, system]
                  description: >-
                    The message kind (mirrors `chat-ws.yaml`'s `EnvelopeOf_ChatRef`). Carried so the
                    notification consumer can SUPPRESS the "new message" push for `system` rows (e.g.
                    a call-summary line) — those are recorded in the thread but must not raise a
                    redundant notification. Additive/optional: older producers may omit it.

    EnvelopeOf_UserRef:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [user_id, reason]
              properties:
                user_id: { type: string, format: uuid }
                reason: { type: string, example: refresh_token_reuse_detected }

    EnvelopeOf_UserApproved:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string, format: uuid }
                role: { type: string, enum: [guard, customer], description: Informational; identity flips by user_id. }
                approved_at: { type: string, format: date-time }
