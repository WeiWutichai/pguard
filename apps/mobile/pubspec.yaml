# pguard v2 — Flutter + Riverpod 2.x mobile app (Phase 2: push-based real-time).
# See ../../CLAUDE.md "Flutter (mobile)" Do/Don't and "Architecture decisions".
# Customer-side on-demand security guard booking app (bilingual TH/EN).
name: pguard_mobile
description: pguard customer mobile app — book on-demand security guards (TH/EN).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 2.x + codegen (locked decision; replaces Provider).
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking — REST via dio; real-time booking status via WebSocket (no polling).
  dio: ^5.5.0
  web_socket_channel: ^3.0.0

  # Storage — secure storage for tokens + PIN hash; prefs for non-sensitive only.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # PIN hashing (SHA-256 + per-install salt) for the local PIN gate.
  crypto: ^3.0.3

  # Biometric unlock (fingerprint/Face ID) — an OPTIONAL fast path over the PIN gate; the PIN
  # always stays the fallback credential. Requires FlutterFragmentActivity on Android (see
  # MainActivity.kt) and NSFaceIDUsageDescription on iOS (see ios/Runner/Info.plist).
  local_auth: ^2.3.0

  # Image capture/selection for guard registration document photos (real picker; camera/gallery).
  image_picker: ^1.1.2

  # Share/save the rendered PromptPay QR to a banking app (capture the QR RepaintBoundary → PNG in a
  # temp dir → OS share sheet). path_provider was already a transitive dep (image_picker etc.); both
  # are pinned here so the share button can import them directly.
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # WebRTC voice/video — P2P RTCPeerConnection; signaling rides the calling /ws/call SDP/ICE relay
  # (the mediasoup SFU control plane is service-JWT internal-only, so no mediasoup client is used).
  flutter_webrtc: ^0.12.5

  # Runtime mic/camera permission requests (Android + iOS) for the call media plane.
  permission_handler: ^11.3.1

  # Real device GPS. While ONLINE the uplink runs inside an Android FOREGROUND SERVICE (persistent
  # notification) so a guard stays trackable with the screen off / app backgrounded while waiting
  # for jobs (AndroidSettings + ForegroundNotificationConfig are re-exported by geolocator).
  geolocator: ^11.1.0

  # Real OpenStreetMap map — replaces the hand-painted backdrop. Pure-Dart tile renderer (no
  # native SDK, no API key): OSM raster tiles via a TileLayer + lightweight Marker/Polyline layers.
  # `latlong2` is its coordinate type (we convert GeoPoint↔LatLng in PgMap). Place search +
  # reverse-geocode use OSM Nominatim (free, UA-header required) via a plain dio client (NOT the
  # gateway PguardApi — Nominatim is an external host). Distances stay straight-line (geo.dart).
  flutter_map: ^8.1.0
  latlong2: ^0.9.1

  # FCM push — wakes the callee on an incoming call (notification maps calling.initiated → a push
  # with data{type:incoming_call,call_id,...}; the push controller routes it to the call screen).
  # Requires android/app/google-services.json (app.pguard.mobile) to build.
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0

  # i18n — bilingual TH/EN.
  intl: ^0.19.0

  # Design tokens — single source of truth (no hardcoded colors). Path package; the
  # cross-language trio lives in apps/design-tokens (tokens.css / .dart / tokens.ts).
  pguard_design_tokens:
    path: ../design-tokens
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Deterministic time control for debounce/timer unit tests (PlaceSearchController). Already in the
  # lock as a transitive dep of flutter_test/test; declared here so tests may import it directly.
  fake_async: ^1.3.1

  # Codegen — `dart run build_runner build` generates Riverpod providers (*.g.dart).
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

  # Lints — custom_lint enables riverpod_lint analyzer plugin.
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_lints: ^4.0.0

  # E2E (Patrol) — drives the real app on a device/emulator against the live backend. The
  # native automation requires an Android emulator or iOS simulator (no headless mode). Runner:
  # `dart run patrol_cli test -t integration_test/<file>.dart`. See tests/e2e/mobile/README.md.
  integration_test:
    sdk: flutter
  patrol: ^3.13.0

flutter:
  uses-material-design: true
  # Bundled illustrations (role-chooser hero, etc.).
  assets:
    - assets/images/
  # Brand typefaces per the hi-fi design (tokens.css --font-thai / --font-mono): bundled
  # OFL TTFs (assets/fonts, from google/fonts) — self-contained, no runtime fetch.
  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
